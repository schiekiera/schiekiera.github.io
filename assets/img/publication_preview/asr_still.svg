<title id="title">ASR validation pipeline, animated</title>
<desc id="desc">Three naming responses: the audio is transcribed by Whisper and matched to the target word in up to three stages. cat heard as cat passes the exact match; to heard as two passes the homophone check; ban heard as ben fails all three and goes to manual review.</desc>
