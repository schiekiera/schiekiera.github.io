<line class="draw" pathLength="1" x1="112" y1="225.1" x2="112" y2="224.9" stroke="#1d1d1f" stroke-width="2" opacity="0" style="animation: ar0 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/><polygon points="112,230.9 106.5,220.9 117.5,220.9" fill="#1d1d1f" opacity="0" style="animation: ah0 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<circle class="pop" cx="112" cy="214.1" r="9" fill="#2A9D8F" stroke="#1d1d1f" stroke-width="2" style="animation: bd0 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<circle class="pop" cx="112" cy="241.9" r="9" fill="#E07B24" stroke="#1d1d1f" stroke-width="2" style="animation: pd0 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="112" y1="214.1" x2="192" y2="180.8" stroke="#2A9D8F" stroke-width="3.5" stroke-linecap="round" style="animation: bl1 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="112" y1="241.9" x2="192" y2="230.8" stroke="#E07B24" stroke-width="3.5" stroke-linecap="round" style="animation: pl1 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="192" y1="191.8" x2="192" y2="213.8" stroke="#1d1d1f" stroke-width="2" opacity="0" style="animation: ar1 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/><polygon points="192,219.8 186.5,209.8 197.5,209.8" fill="#1d1d1f" opacity="0" style="animation: ah1 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<circle class="pop" cx="192" cy="180.8" r="9" fill="#2A9D8F" stroke="#1d1d1f" stroke-width="2" style="animation: bd1 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<circle class="pop" cx="192" cy="230.8" r="9" fill="#E07B24" stroke="#1d1d1f" stroke-width="2" style="animation: pd1 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="192" y1="180.8" x2="272" y2="147.4" stroke="#2A9D8F" stroke-width="3.5" stroke-linecap="round" style="animation: bl2 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="192" y1="230.8" x2="272" y2="230.8" stroke="#E07B24" stroke-width="3.5" stroke-linecap="round" style="animation: pl2 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="272" y1="158.4" x2="272" y2="213.8" stroke="#1d1d1f" stroke-width="2" opacity="0" style="animation: ar2 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/><polygon points="272,219.8 266.5,209.8 277.5,209.8" fill="#1d1d1f" opacity="0" style="animation: ah2 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
