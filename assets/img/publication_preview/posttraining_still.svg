<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-labelledby="title desc">
<title id="title">Post-training, animated</title>
<desc id="desc">Alignment with human behaviour across four model generations (illustrative): each base model is followed by its post-trained version, which is less aligned; base models improve while post-trained models do not, so the gap widens.</desc>
<style>
svg { fill: #1d1d1f; }
text { font-family: "Latin Modern Roman", "CMU Serif", Georgia, "Times New Roman", serif; }
.cap { font-size: 24px; font-style: italic; fill: #6b6b6b; text-anchor: middle; }
.pop, .bar { transform-box: fill-box; }
.pop { transform-origin: center; }
.bar { transform-origin: 50% 100%; }
.draw { stroke-dasharray: 1; }
@keyframes gap { 0%, 63.000% { opacity: 0 } 66.000%, 90.000% { opacity: 1 } 94.000%, 100% { opacity: 0 } }
@keyframes ar0 { 0%, 7.500% { stroke-dashoffset: 1; opacity: 1 } 11.000%, 60.000% { stroke-dashoffset: 0; opacity: 1 } 64.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes ah0 { 0%, 10.500% { opacity: 0 } 12.000%, 60.000% { opacity: 1 } 64.000%, 100% { opacity: 0 } }
@keyframes bd0 { 0%, 5.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 8.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes pd0 { 0%, 12.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 15.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes bl1 { 0%, 15.500% { stroke-dashoffset: 1; opacity: 1 } 20.000%, 90.000% { stroke-dashoffset: 0; opacity: 1 } 94.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes pl1 { 0%, 22.500% { stroke-dashoffset: 1; opacity: 1 } 27.000%, 90.000% { stroke-dashoffset: 0; opacity: 1 } 94.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes ar1 { 0%, 21.500% { stroke-dashoffset: 1; opacity: 1 } 25.000%, 60.000% { stroke-dashoffset: 0; opacity: 1 } 64.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes ah1 { 0%, 24.500% { opacity: 0 } 26.000%, 60.000% { opacity: 1 } 64.000%, 100% { opacity: 0 } }
@keyframes bd1 { 0%, 19.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 22.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes pd1 { 0%, 26.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 29.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes bl2 { 0%, 29.500% { stroke-dashoffset: 1; opacity: 1 } 34.000%, 90.000% { stroke-dashoffset: 0; opacity: 1 } 94.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes pl2 { 0%, 36.500% { stroke-dashoffset: 1; opacity: 1 } 41.000%, 90.000% { stroke-dashoffset: 0; opacity: 1 } 94.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes ar2 { 0%, 35.500% { stroke-dashoffset: 1; opacity: 1 } 39.000%, 60.000% { stroke-dashoffset: 0; opacity: 1 } 64.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes ah2 { 0%, 38.500% { opacity: 0 } 40.000%, 60.000% { opacity: 1 } 64.000%, 100% { opacity: 0 } }
@keyframes bd2 { 0%, 33.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 36.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes pd2 { 0%, 40.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 43.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes bl3 { 0%, 43.500% { stroke-dashoffset: 1; opacity: 1 } 48.000%, 90.000% { stroke-dashoffset: 0; opacity: 1 } 94.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes pl3 { 0%, 50.500% { stroke-dashoffset: 1; opacity: 1 } 55.000%, 90.000% { stroke-dashoffset: 0; opacity: 1 } 94.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes ar3 { 0%, 49.500% { stroke-dashoffset: 1; opacity: 1 } 53.000%, 60.000% { stroke-dashoffset: 0; opacity: 1 } 64.000% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes ah3 { 0%, 52.500% { opacity: 0 } 54.000%, 60.000% { opacity: 1 } 64.000%, 100% { opacity: 0 } }
@keyframes bd3 { 0%, 47.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 50.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes pd3 { 0%, 54.000% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 57.000%, 90.000% { opacity: 1; transform: scale(1) } 94.000%, 100% { opacity: 0; transform: scale(1) } }
@keyframes lab { 0%, 10.000% { opacity: 0 } 13.000%, 90.000% { opacity: 1 } 94.000%, 100% { opacity: 0 } }
@keyframes c1 { 0%, 4.000% { opacity: 0 } 7.000%, 60.000% { opacity: 1 } 64.000%, 100% { opacity: 0 } }
@keyframes c2 { 0%, 63.000% { opacity: 0 } 66.000%, 90.000% { opacity: 1 } 94.000%, 100% { opacity: 0 } }
* { animation: none !important; } .cap { display: none; }
</style>
<rect width="400" height="480" fill="#ffffff"/>
<line x1="78" y1="50" x2="78" y2="342" stroke="#1d1d1f" stroke-width="2"/>
<line x1="78" y1="342" x2="378" y2="342" stroke="#1d1d1f" stroke-width="2"/>
<text x="62" y="203.0" font-size="21" font-style="italic" text-anchor="middle" transform="rotate(-90 62 203.0)">alignment with humans</text>
<text x="229.0" y="372" font-size="21" font-style="italic" text-anchor="middle">model generation</text>
<line x1="112" y1="342" x2="112" y2="348" stroke="#1d1d1f" stroke-width="2"/>
<line x1="192" y1="342" x2="192" y2="348" stroke="#1d1d1f" stroke-width="2"/>
