<line class="draw" pathLength="1" x1="272" y1="147.4" x2="352" y2="114.0" stroke="#2A9D8F" stroke-width="3.5" stroke-linecap="round" style="animation: bl3 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="272" y1="230.8" x2="352" y2="233.6" stroke="#E07B24" stroke-width="3.5" stroke-linecap="round" style="animation: pl3 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<line class="draw" pathLength="1" x1="352" y1="125.0" x2="352" y2="216.6" stroke="#1d1d1f" stroke-width="2" opacity="0" style="animation: ar3 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/><polygon points="352,222.6 346.5,212.6 357.5,212.6" fill="#1d1d1f" opacity="0" style="animation: ah3 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<circle class="pop" cx="352" cy="114.0" r="9" fill="#2A9D8F" stroke="#1d1d1f" stroke-width="2" style="animation: bd3 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<circle class="pop" cx="352" cy="233.6" r="9" fill="#E07B24" stroke="#1d1d1f" stroke-width="2" style="animation: pd3 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<g style="animation: lab 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both"><text x="98" y="198" font-size="21" fill="#2A9D8F">base</text><text x="98" y="276" font-size="21" fill="#E07B24">post-trained</text></g>
<text class="cap" x="200" y="454" opacity="0" style="animation: c1 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both">post-training lowers alignment</text>
<text class="cap" x="200" y="454" style="animation: c2 10.0s cubic-bezier(.45,0,.2,1) 0s infinite both">and the gap widens</text>
</svg>
