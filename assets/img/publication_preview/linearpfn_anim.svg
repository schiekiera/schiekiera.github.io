<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">LinearPFN, animated</title>
<desc id="desc">A dataset as a grid of tokens (features x1 to x3 and outcome y). Attention runs across the features of one row, then across the rows of one column; then inclusion-probability bars rise for x1 and x3, while x2 is not selected and fades.</desc>
<style>
text { font-family: "Latin Modern Roman", "CMU Serif", Georgia, "Times New Roman", serif; fill: #1d1d1f; }
.cap { font-size: 24px; font-style: italic; fill: #6b6b6b; text-anchor: middle; }
.bar { transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes focus { 0% { opacity: 0 } 6% { opacity: 1 } 52% { opacity: 1 } 58% { opacity: 0 } 100% { opacity: 0 } }
@keyframes rowatt { 0%, 10% { opacity: 0 } 14% { opacity: 1 } 26% { opacity: 1 } 30% { opacity: 0 } 100% { opacity: 0 } }
@keyframes colatt { 0%, 32% { opacity: 0 } 36% { opacity: 1 } 48% { opacity: 1 } 52% { opacity: 0 } 100% { opacity: 0 } }
@keyframes bar { 0%, 56% { transform: scaleY(0) } 64% { transform: scaleY(1) } 92% { transform: scaleY(1) } 98% { transform: scaleY(0) } 100% { transform: scaleY(0) } }
@keyframes dim { 0%, 60% { opacity: 1 } 66% { opacity: .3 } 92% { opacity: .3 } 98% { opacity: 1 } 100% { opacity: 1 } }
@keyframes c1 { 0%, 8% { opacity: 0 } 12% { opacity: 1 } 28% { opacity: 1 } 31% { opacity: 0 } 100% { opacity: 0 } }
@keyframes c2 { 0%, 31% { opacity: 0 } 35% { opacity: 1 } 49% { opacity: 1 } 52% { opacity: 0 } 100% { opacity: 0 } }
@keyframes c3 { 0%, 56% { opacity: 0 } 60% { opacity: 1 } 92% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="400" height="480" fill="#ffffff"/>
<text x="110.0" y="30" font-size="26" font-style="italic" text-anchor="middle" fill="#B8692F">x<tspan font-size="17" dy="5">1</tspan></text><rect x="85" y="42" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="85" y="102" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="85" y="162" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="85" y="222" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="85" y="288" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/>
<g opacity=".3" style="animation: dim 10s cubic-bezier(.45,0,.2,1) 0.00s infinite both"><text x="170.0" y="30" font-size="26" font-style="italic" text-anchor="middle" fill="#1d1d1f">x<tspan font-size="17" dy="5">2</tspan></text><rect x="145" y="42" width="50" height="50" rx="7" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="2.5"/><rect x="145" y="102" width="50" height="50" rx="7" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="2.5"/><rect x="145" y="162" width="50" height="50" rx="7" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="2.5"/><rect x="145" y="222" width="50" height="50" rx="7" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="2.5"/><rect x="145" y="288" width="50" height="50" rx="7" fill="#FFFFFF" stroke="#8C8C8C" stroke-width="2.5"/></g>
<text x="230.0" y="30" font-size="26" font-style="italic" text-anchor="middle" fill="#B8692F">x<tspan font-size="17" dy="5">3</tspan></text><rect x="205" y="42" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="205" y="102" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="205" y="162" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="205" y="222" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/><rect x="205" y="288" width="50" height="50" rx="7" fill="#F7D9BB" stroke="#B8692F" stroke-width="2.5"/>
<text x="290.0" y="30" font-size="26" font-style="italic" text-anchor="middle" fill="#3C5DAA">y</text><rect x="265" y="42" width="50" height="50" rx="7" fill="#D5E4F3" stroke="#3C5DAA" stroke-width="2.5"/><rect x="265" y="102" width="50" height="50" rx="7" fill="#D5E4F3" stroke="#3C5DAA" stroke-width="2.5"/><rect x="265" y="162" width="50" height="50" rx="7" fill="#D5E4F3" stroke="#3C5DAA" stroke-width="2.5"/><rect x="265" y="222" width="50" height="50" rx="7" fill="#D5E4F3" stroke="#3C5DAA" stroke-width="2.5"/><rect x="265" y="288" width="50" height="50" rx="7" fill="#FFFFFF" stroke="#3C5DAA" stroke-width="2.5" stroke-dasharray="6 5"/>
<g opacity="0" style="animation: focus 10s cubic-bezier(.45,0,.2,1) 0.00s infinite both"><rect x="145" y="162" width="50" height="50" rx="7" fill="#97CFB2" stroke="#4E9A6B" stroke-width="2.5"/></g>
<g opacity="0" style="animation: rowatt 10s cubic-bezier(.45,0,.2,1) 0.12s infinite both"><rect x="85" y="162" width="50" height="50" rx="7" fill="#D3EDDF" stroke="#4E9A6B" stroke-width="2.5"/></g>
<g opacity="0" style="animation: rowatt 10s cubic-bezier(.45,0,.2,1) 0.12s infinite both"><rect x="205" y="162" width="50" height="50" rx="7" fill="#D3EDDF" stroke="#4E9A6B" stroke-width="2.5"/></g>
<g opacity="0" style="animation: rowatt 10s cubic-bezier(.45,0,.2,1) 0.24s infinite both"><rect x="265" y="162" width="50" height="50" rx="7" fill="#D3EDDF" stroke="#4E9A6B" stroke-width="2.5"/></g>
<g opacity="0" style="animation: colatt 10s cubic-bezier(.45,0,.2,1) 0.24s infinite both"><rect x="145" y="42" width="50" height="50" rx="7" fill="#D3EDDF" stroke="#4E9A6B" stroke-width="2.5"/></g>
<g opacity="0" style="animation: colatt 10s cubic-bezier(.45,0,.2,1) 0.12s infinite both"><rect x="145" y="102" width="50" height="50" rx="7" fill="#D3EDDF" stroke="#4E9A6B" stroke-width="2.5"/></g>
<g opacity="0" style="animation: colatt 10s cubic-bezier(.45,0,.2,1) 0.12s infinite both"><rect x="145" y="222" width="50" height="50" rx="7" fill="#D3EDDF" stroke="#4E9A6B" stroke-width="2.5"/></g>
<g opacity="0" style="animation: colatt 10s cubic-bezier(.45,0,.2,1) 0.24s infinite both"><rect x="145" y="288" width="50" height="50" rx="7" fill="#D3EDDF" stroke="#4E9A6B" stroke-width="2.5"/></g>
<rect class="bar" x="95" y="357.9" width="30" height="52.1" fill="#F7D9BB" stroke="#B8692F" stroke-width="2" style="animation: bar 10s cubic-bezier(.45,0,.2,1) 0.00s infinite both"/>
<rect class="bar" x="155" y="404.4" width="30" height="5.6" fill="#E4E4E4" stroke="#8C8C8C" stroke-width="2" style="animation: bar 10s cubic-bezier(.45,0,.2,1) 0.10s infinite both"/>
<rect class="bar" x="215" y="362.4" width="30" height="47.6" fill="#F7D9BB" stroke="#B8692F" stroke-width="2" style="animation: bar 10s cubic-bezier(.45,0,.2,1) 0.20s infinite both"/>
<line x1="80" y1="410" x2="260" y2="410" stroke="#1d1d1f" stroke-width="2"/>
<text x="290.0" y="406" font-size="22" font-style="italic" text-anchor="middle">PIP</text>
<text class="cap" x="200" y="454" opacity="0" style="animation: c1 10s cubic-bezier(.45,0,.2,1) 0.00s infinite both">attention across features</text>
<text class="cap" x="200" y="454" opacity="0" style="animation: c2 10s cubic-bezier(.45,0,.2,1) 0.00s infinite both">attention across rows</text>
<text class="cap" x="200" y="454" style="animation: c3 10s cubic-bezier(.45,0,.2,1) 0.00s infinite both">variable selection</text>
</svg>
