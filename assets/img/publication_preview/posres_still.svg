<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-labelledby="title desc">
<title id="title">Classifying positive results, animated</title>
<desc id="desc">Abstracts pass through SciBERT, which labels each as positive only or mixed / negative; then the share of positive results in psychotherapy abstracts over time is drawn (illustrative): flat until 2005, declining afterwards.</desc>
<style>
svg { fill: #1d1d1f; }
text { font-family: "Latin Modern Roman", "CMU Serif", Georgia, "Times New Roman", serif; }
.cap { font-size: 24px; font-style: italic; fill: #6b6b6b; text-anchor: middle; }
.pop, .bar { transform-box: fill-box; }
.pop { transform-origin: center; }
.bar { transform-origin: 50% 100%; }
.draw { stroke-dasharray: 1; }
@keyframes phaseA { 0%, 0.000% { opacity: 0 } 1.905%, 49.524% { opacity: 1 } 53.333%, 100% { opacity: 0 } }
@keyframes phaseB { 0%, 51.429% { opacity: 0 } 54.286%, 91.429% { opacity: 1 } 95.238%, 100% { opacity: 0 } }
@keyframes capA { 0%, 2.857% { opacity: 0 } 5.714%, 46.667% { opacity: 1 } 50.476%, 100% { opacity: 0 } }
@keyframes capB { 0%, 53.333% { opacity: 0 } 56.190%, 91.429% { opacity: 1 } 95.238%, 100% { opacity: 0 } }
@keyframes glow { 0% { stroke: #1d1d1f } 5.714% { stroke: #1d1d1f } 7.619%, 11.429% { stroke: #2A9D8F } 13.333% { stroke: #1d1d1f } 21.905% { stroke: #1d1d1f } 23.810%, 27.619% { stroke: #2A9D8F } 29.524% { stroke: #1d1d1f } 38.095% { stroke: #1d1d1f } 40.000%, 43.810% { stroke: #2A9D8F } 45.714% { stroke: #1d1d1f } 100% { stroke: #1d1d1f } }
@keyframes ab0 { 0%, 1.905% { opacity: 0; transform: translateY(-26px) } 5.238%, 15.238% { opacity: 1; transform: translateY(0px) } 19.048%, 100% { opacity: 0; transform: translateY(0px) } }
@keyframes tag0 { 0%, 9.524% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 12.381%, 15.238% { opacity: 1; transform: scale(1) } 19.048%, 100% { opacity: 0; transform: scale(1) } }
@keyframes ab1 { 0%, 18.095% { opacity: 0; transform: translateY(-26px) } 21.429%, 31.429% { opacity: 1; transform: translateY(0px) } 35.238%, 100% { opacity: 0; transform: translateY(0px) } }
@keyframes tag1 { 0%, 25.714% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 28.571%, 31.429% { opacity: 1; transform: scale(1) } 35.238%, 100% { opacity: 0; transform: scale(1) } }
@keyframes ab2 { 0%, 34.286% { opacity: 0; transform: translateY(-26px) } 37.619%, 47.619% { opacity: 1; transform: translateY(0px) } 51.429%, 100% { opacity: 0; transform: translateY(0px) } }
@keyframes tag2 { 0%, 41.905% { opacity: 0; transform: scale(.6); animation-timing-function: cubic-bezier(.34,1.56,.64,1) } 44.762%, 47.619% { opacity: 1; transform: scale(1) } 51.429%, 100% { opacity: 0; transform: scale(1) } }
@keyframes trend { 0%, 54.286% { stroke-dashoffset: 1; opacity: 1 } 67.619%, 91.429% { stroke-dashoffset: 0; opacity: 1 } 95.238% { stroke-dashoffset: 0; opacity: 0 } 100% { stroke-dashoffset: 1; opacity: 0 } }
@keyframes mark { 0%, 63.810% { opacity: 0 } 66.667%, 91.429% { opacity: 1 } 95.238%, 100% { opacity: 0 } }
* { animation: none !important; }
</style>
<rect width="400" height="480" fill="#ffffff"/>
<g transform="translate(0 60)">
<g opacity="0" style="animation: phaseA 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both">
<line x1="200" y1="130" x2="200" y2="151" stroke="#1d1d1f" stroke-width="2.5"/><polygon points="200,160 193.5,148 206.5,148" fill="#1d1d1f"/>
<rect x="130" y="160" width="140" height="48" rx="10" fill="#F3F4F6" stroke="#1d1d1f" stroke-width="2.5" style="animation: glow 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<text x="200" y="192" font-size="24" font-weight="bold" text-anchor="middle">SciBERT</text>
<line x1="200" y1="208" x2="200" y2="227" stroke="#1d1d1f" stroke-width="2.5"/><polygon points="200,236 193.5,224 206.5,224" fill="#1d1d1f"/>
</g>
<g opacity="0" style="animation: ab0 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"><rect x="120" y="20" width="160" height="104" rx="8" fill="#ffffff" stroke="#C5CAD1" stroke-width="2"/><text x="136" y="48" font-size="19" font-weight="bold">Abstract</text><rect x="136" y="62" width="115" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="75" width="102" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="88" width="122" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="101" width="77" height="6" rx="3" fill="#E1E4E8"/></g>
<g class="pop" opacity="0" style="animation: tag0 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"><rect x="114" y="240" width="173" height="34" rx="17" fill="#2A9D8F"/><text x="200" y="263" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">positive only</text></g>
<g opacity="0" style="animation: ab1 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"><rect x="120" y="20" width="160" height="104" rx="8" fill="#ffffff" stroke="#C5CAD1" stroke-width="2"/><text x="136" y="48" font-size="19" font-weight="bold">Abstract</text><rect x="136" y="62" width="115" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="75" width="102" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="88" width="122" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="101" width="77" height="6" rx="3" fill="#E1E4E8"/></g>
<g class="pop" opacity="0" style="animation: tag1 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"><rect x="114" y="240" width="173" height="34" rx="17" fill="#2A9D8F"/><text x="200" y="263" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">positive only</text></g>
<g opacity="0" style="animation: ab2 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"><rect x="120" y="20" width="160" height="104" rx="8" fill="#ffffff" stroke="#C5CAD1" stroke-width="2"/><text x="136" y="48" font-size="19" font-weight="bold">Abstract</text><rect x="136" y="62" width="115" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="75" width="102" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="88" width="122" height="6" rx="3" fill="#E1E4E8"/><rect x="136" y="101" width="77" height="6" rx="3" fill="#E1E4E8"/></g>
<g class="pop" opacity="0" style="animation: tag2 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"><rect x="97" y="240" width="206" height="34" rx="17" fill="#9A9A9A"/><text x="200" y="263" font-size="20" font-weight="bold" text-anchor="middle" fill="#ffffff">mixed / negative</text></g>
</g>
<g style="animation: phaseB 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both">
<line x1="78" y1="70" x2="78" y2="330" stroke="#1d1d1f" stroke-width="2"/>
<line x1="78" y1="330" x2="366" y2="330" stroke="#1d1d1f" stroke-width="2"/>
<text x="62" y="205.0" font-size="21" font-style="italic" text-anchor="middle" transform="rotate(-90 62 205.0)">positive results</text>
<text x="90" y="358" font-size="20" text-anchor="middle">1990</text>
<text x="209" y="358" font-size="20" text-anchor="middle">2005</text>
<text x="344" y="358" font-size="20" text-anchor="middle">2022</text>
<line x1="209.1" y1="80" x2="209.1" y2="330" stroke="#9A9A9A" stroke-width="2" stroke-dasharray="5 5" style="animation: mark 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
<polyline class="draw" pathLength="1" points="90.0,164.0 97.9,156.6 105.9,165.0 113.8,159.2 121.8,165.4 129.7,163.8 137.6,156.3 145.6,164.2 153.5,159.8 161.4,161.7 169.4,161.7 177.3,161.3 185.2,164.3 193.2,157.9 201.1,165.4 209.1,163.9 217.0,170.7 224.9,173.0 232.9,176.2 240.8,176.0 248.8,185.9 256.7,193.2 264.6,196.5 272.6,193.8 280.5,207.8 288.4,206.9 296.4,214.0 304.3,215.9 312.2,223.8 320.2,225.0 328.1,231.6 336.1,234.8 344.0,236.9" fill="none" stroke="#2A9D8F" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" style="animation: trend 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both"/>
</g>
<text class="cap" x="200" y="454" opacity="0" style="animation: capA 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both">SciBERT classifies abstracts</text>
<text class="cap" x="200" y="454" style="animation: capB 10.5s cubic-bezier(.45,0,.2,1) 0s infinite both">fewer positive results after 2005</text>
</svg>
