<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="100%" height="100%" role="img" aria-labelledby="title desc">
<title id="title">Swinging Lexical Network, animated</title>
<desc id="desc">Target t (yellow) and distractor d (blue) with their co-activated competitors (green). With a single effective competitor, naming is facilitated; when a large cohort of competitors stands out, naming shows interference.</desc>
<style>
text { font-family: "Latin Modern Roman", "CMU Serif", Georgia, "Times New Roman", serif; fill: #1d1d1f; }
.cap { font-size: 24px; font-style: italic; fill: #6b6b6b; text-anchor: middle; }
.node { transform-box: fill-box; transform-origin: center; }
@keyframes node { 0%, 38% { transform: scale(.22); opacity: .5 } 48% { transform: scale(1); opacity: 1 } 88% { transform: scale(1); opacity: 1 } 98% { transform: scale(.22); opacity: .5 } 100% { transform: scale(.22); opacity: .5 } }
@keyframes lines { 0%, 40% { opacity: 0 } 48% { opacity: 1 } 88% { opacity: 1 } 96% { opacity: 0 } 100% { opacity: 0 } }
@keyframes cline { 0%, 38% { stroke: #3A3A3A; stroke-width: 3.4px } 46% { stroke: #9A9A9A; stroke-width: 1.6px } 88% { stroke: #9A9A9A; stroke-width: 1.6px } 96% { stroke: #3A3A3A; stroke-width: 3.4px } 100% { stroke: #3A3A3A; stroke-width: 3.4px } }
@keyframes fac { 0%, 36% { opacity: 1 } 40% { opacity: 0 } 92% { opacity: 0 } 97% { opacity: 1 } 100% { opacity: 1 } }
@keyframes int { 0%, 44% { opacity: 0 } 48% { opacity: 1 } 86% { opacity: 1 } 90% { opacity: 0 } 100% { opacity: 0 } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect width="400" height="480" fill="#ffffff"/>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.32s infinite both"><line x1="110" y1="128" x2="56" y2="348"/><line x1="290" y1="128" x2="56" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.24s infinite both"><line x1="110" y1="128" x2="92" y2="348"/><line x1="290" y1="128" x2="92" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.16s infinite both"><line x1="110" y1="128" x2="128" y2="348"/><line x1="290" y1="128" x2="128" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.08s infinite both"><line x1="110" y1="128" x2="164" y2="348"/><line x1="290" y1="128" x2="164" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: cline 8s cubic-bezier(.45,0,.2,1) 0.00s infinite both"><line x1="110" y1="128" x2="200" y2="348"/><line x1="290" y1="128" x2="200" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.08s infinite both"><line x1="110" y1="128" x2="236" y2="348"/><line x1="290" y1="128" x2="236" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.16s infinite both"><line x1="110" y1="128" x2="272" y2="348"/><line x1="290" y1="128" x2="272" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.24s infinite both"><line x1="110" y1="128" x2="308" y2="348"/><line x1="290" y1="128" x2="308" y2="348"/></g>
<g stroke="#9A9A9A" stroke-width="1.6" style="animation: lines 8s cubic-bezier(.45,0,.2,1) 0.32s infinite both"><line x1="110" y1="128" x2="344" y2="348"/><line x1="290" y1="128" x2="344" y2="348"/></g>
<circle cx="110" cy="128" r="40" fill="#FDE725" stroke="#1d1d1f" stroke-width="2.5"/><text x="110" y="138" font-size="32" font-style="italic" text-anchor="middle">t</text>
<circle cx="290" cy="128" r="40" fill="#3B4CC0" stroke="#1d1d1f" stroke-width="2.5"/><text x="290" y="138" font-size="32" font-style="italic" text-anchor="middle" fill="#ffffff">d</text>
<circle cx="56" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.32s infinite both"/>
<circle cx="92" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.24s infinite both"/>
<circle cx="128" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.16s infinite both"/>
<circle cx="164" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.08s infinite both"/>
<circle cx="200" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2"/>
<circle cx="236" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.08s infinite both"/>
<circle cx="272" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.16s infinite both"/>
<circle cx="308" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.24s infinite both"/>
<circle cx="344" cy="348" r="15" fill="#5CB74E" stroke="#1d1d1f" stroke-width="2" class="node" style="animation: node 8s cubic-bezier(.45,0,.2,1) 0.32s infinite both"/>
<text class="cap" x="200" y="454" opacity="0" style="animation: fac 8s cubic-bezier(.45,0,.2,1) 0.00s infinite both">facilitation</text>
<text class="cap" x="200" y="454" style="animation: int 8s cubic-bezier(.45,0,.2,1) 0.00s infinite both">interference</text>
</svg>
