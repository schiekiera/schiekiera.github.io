<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" width="400" height="480" role="img" aria-labelledby="title desc">
<title id="title">Forced choice, animated</title>
<desc id="desc">Three forced-choice trials in turn (cat, dog, rat): the input word appears, then four candidate words one after another; the language model picks the two most related candidates, which move into the output row.</desc>
