<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cross-Model Consensus</title>
<!--
  Animated cross-model consensus baseline S^X_m (redesign of the "Cross-Model Consensus Baseline" slide,
  talks_and_posters/2026-05-behavioral_clones/presentation.tex; definition: paper eq. "xconsensus").

    1. the eight models; every layer of every model gives a similarity matrix S_l
    2. a target model m is picked; its own matrices are left out
    3. the matrices of all other models and layers flow into the average -> S^X_m sharpens step by step
    4. S^X_m is compared with the target's own hidden-state geometry (RSA), like S^FC and S^FA
    5. the target moves on: every model gets its own consensus, never including itself

  The heatmaps are illustrative toy data (6 words: 3 animals, 3 vehicles), not results.

  Open this file in a browser. Controls:
    space / click   pause / resume
    left / right    step back / forward 0.25 s (handy while paused)
    r               restart from the beginning
    buttons (top right)  pause / resume, restart
  When embedded in a page, the loop starts once it scrolls into view and pauses while off screen.
  (Generated by publish_to_blog.py from the file in context/visualizations; edit that one.)

  URL options:
    ?t=9              freeze at second 9 of the timeline (no animation)
    ?speed=0.5        play at half the normal speed
    ?caption=0        hide the caption line
    ?bg=transparent   transparent instead of white background
-->
<style>
  :root { --bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg  { width: 100vw; height: 100vh; display: block; }
  .sans  { font-family: "Fira Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .serif { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; }
  .cap   { font-family: "Fira Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #333; white-space: pre; }
  #ctl { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px;
         opacity: .55; transition: opacity .2s; }
  #ctl[hidden] { display: none; }
  #ctl:hover, #ctl:focus-within, #ctl.paused { opacity: 1; }
  #ctl button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
                border: 1px solid #C5CAD1; border-radius: 50%; background: rgba(255,255,255,.92);
                color: #333; cursor: pointer; }
  #ctl button:hover { background: #F3F4F6; }
  #ctl button:focus-visible { outline: 2px solid #3B4CC0; outline-offset: 2px; }
  #ctl svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  #fig { cursor: pointer; }
</style>
</head>
<body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Animated cross-model consensus: eight language models each give one similarity matrix per layer; for a target model, the matrices of all other models are averaged into the consensus S X m, which is compared with the target's own hidden-state similarity; the target then moves on to other models."></svg>
<div id="ctl" hidden>
  <button id="btn-restart" type="button" aria-label="Restart animation" title="Restart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5V.5L4.75 3.5 8 6.5V4a4 4 0 1 1-4 4H2.5A5.5 5.5 0 1 0 8 2.5z"/></svg></button>
  <button id="btn-play" type="button" aria-label="Pause animation" title="Pause"></button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. DATA
   ===================================================================== */
const MODELS = [                                   // the eight models of the study
  { short: 'Falcon3-10B',  name: 'Falcon3-10B-Instruct' },
  { short: 'Gemma-2-9B',   name: 'gemma-2-9b-it' },
  { short: 'Llama-3.1-8B', name: 'Llama-3.1-8B-Instruct' },
  { short: 'Mistral-7B',   name: 'Mistral-7B-Instruct-v0.2' },
  { short: 'Mistral-Nemo', name: 'Mistral-Nemo-Instruct-2407' },
  { short: 'Phi-4',        name: 'phi-4' },
  { short: 'Qwen2.5-7B',   name: 'Qwen2.5-7B-Instruct' },
  { short: 'rnj-1',        name: 'rnj-1-instruct' },
];
const TARGETS = [1, 4, 6];        // which model is the target m, in turn (index into MODELS)
const LAYERS_SHOWN = 3;           // matrices drawn per model (stand-ins for all of its layers)
const NW = 6;                     // toy vocabulary: 3 animals + 3 vehicles
const SEED = 11;                  // random seed of the toy data
const C = {
  target: '#0072B2',              // target model m (Okabe-Ito blue)
  cons:   '#E69F00',              // consensus of the other models (Okabe-Ito orange)
  ink: '#1d1d1f', slate: '#525860', chip: '#F3F4F6', chipStroke: '#C5CAD1', opFill: '#FFF8EC',
};

/* =====================================================================
   2. TIMELINE  (timeline seconds; played at PLAYBACK speed, see section 3)
   ===================================================================== */
const T = {
  models: 0.0,                      // the eight model chips
  decks:  1.3,                      // each model's layer matrices fold out
  select: 3.3,                      // the first target model m is picked
  flow:   4.3,                      // averaging box + lines from the other models
  avg:    5.4, avgStagger: 0.07,    // their matrices fly into the average; S^X_m builds up
  cmp:    8.4,                      // the target's own S_l comes down; RSA with S^X_m
  rot:    [11.6, 14.0],             // the target moves on (one entry per further target)
  fadeOut: 17.4,
  loop:   18.4,
};

const CAPTIONS = [
  [T.models, T.decks,   ['Eight instruction-tuned LLMs']],
  [T.decks,  T.select,  ['Every layer ', {i: 'ℓ'}, ' of every model gives a similarity matrix ', {b: 'S', sub: 'ℓ'}]],
  [T.select, T.avg,     ['Pick a target model ', {i: 'm'}, ': its own matrices are left out']],
  [T.avg,    T.cmp,     ['Averaging all other models and layers gives the consensus ', {b: 'S', sup: 'X', sub: 'm', subIt: true}]],
  [T.cmp,    T.rot[0],  [{b: 'S', sup: 'X', sub: 'm', subIt: true}, ' is a reference geometry for ', {i: 'm'}, ', like ', {b: 'S', sup: 'FC'}, ' and ', {b: 'S', sup: 'FA'}]],
  [T.rot[0], T.fadeOut, ['Every model gets its own consensus, never including itself']],
];

/* =====================================================================
   3. SETTINGS FROM THE URL
   ===================================================================== */
const params       = new URLSearchParams(location.search);
const FREEZE       = params.has('t') ? parseFloat(params.get('t')) : null;
const PLAYBACK     = 0.8;          // overall playback rate: 1 = timeline seconds, < 1 = slower
const SPEED        = PLAYBACK * parseFloat(params.get('speed') || '1');
const SHOW_CAPTION = params.get('caption') !== '0';
if (params.get('bg') === 'transparent') document.documentElement.style.setProperty('--bg', 'transparent');

/* =====================================================================
   4. TOY DATA: one similarity matrix per model and layer
      word vectors = shared structure (two clusters) + model quirk + layer noise + layer anisotropy
   ===================================================================== */
function mulberry32(a) {
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
                 t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const rnd = mulberry32(SEED);
const gauss = () => Math.sqrt(-2 * Math.log(1 - rnd())) * Math.cos(2 * Math.PI * rnd());
const DIM = 8;
const vec = s => Array.from({ length: DIM }, () => s * gauss());
const add = (...vs) => vs[0].map((_, i) => vs.reduce((a, v) => a + v[i], 0));
const cosine = (a, b) => {
  const d = a.reduce((s, v, i) => s + v * b[i], 0);
  return d / (Math.hypot(...a) * Math.hypot(...b));
};
const clusters = [vec(1), vec(1)];
const common = vec(1);
const base = Array.from({ length: NW }, (_, w) => add(clusters[w < NW / 2 ? 0 : 1], vec(0.45)));
const LAYER_ANISO = [0.9, 0.3, 0.6];
const S = MODELS.map(() => {
  const quirk = base.map(() => vec(0.5));
  return Array.from({ length: LAYERS_SHOWN }, (_, k) => {
    const vs = base.map((b, w) => add(b, quirk[w], vec(0.35), common.map(c => c * LAYER_ANISO[k % LAYER_ANISO.length])));
    return vs.map(a => vs.map(b => cosine(a, b)));
  });
});
const meanOf = mats => mats[0].map((row, i) => row.map((_, j) => mats.reduce((s, M) => s + M[i][j], 0) / mats.length));
const lerpM = (A, B, p) => A.map((row, i) => row.map((v, j) => v + (B[i][j] - v) * p));
const others = m => S.flatMap((layers, i) => (i === m ? [] : layers.map((_, k) => [i, k])));
const CONS = TARGETS.map(m => meanOf(others(m).map(([i, k]) => S[i][k])));

/* colour scale: viridis over the range of all off-diagonal values */
const allVals = [...S.flat(), ...CONS].flatMap(M => M.flatMap((row, i) => row.filter((_, j) => j !== i)));
const LO = Math.min(...allVals), HI = Math.max(...allVals);
const VIRIDIS = ['#440154', '#482475', '#414487', '#355f8d', '#2a788e', '#21918c',
                 '#22a884', '#44bf70', '#7ad151', '#bddf26', '#fde725'];
function viridis(v) {
  const p = Math.max(0, Math.min(1, (v - LO) / (HI - LO))) * 10;
  const i = Math.min(9, Math.floor(p)), f = p - i;
  const a = parseInt(VIRIDIS[i].slice(1), 16), b = parseInt(VIRIDIS[i + 1].slice(1), 16);
  const ch = s => Math.round(((a >> s) & 255) * (1 - f) + ((b >> s) & 255) * f);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

/* =====================================================================
   5. GEOMETRY  (cm, y up -> SVG units, y down)
   ===================================================================== */
const U = 100, PT = 3.5146;
const X = x => +(x * U).toFixed(2);
const Y = y => +(-y * U).toFixed(2);
const NM = MODELS.length;
const chipX = i => 8 + (i - (NM - 1) / 2) * 1.94;            // chip / deck centres
const CHIP = { y: 8.3, w: 1.75, h: 0.48 };
const MINI = 0.9, FAN = 0.12, DECK_TOP = 7.85;               // layer matrices under each chip
const deckXY = (i, k) => ({ x: chipX(i) - 0.57 + FAN * k, y: DECK_TOP - MINI - FAN * k });   // lower-left corner
const DECK_BOTTOM = DECK_TOP - MINI - FAN * (LAYERS_SHOWN - 1);
const OP = { x0: 5.4, x1: 10.6, y0: 4.45, y1: 5.25 };        // averaging box
const BIG = 2.0;
const SLOT_T = { x: 4.6, y: 1.25 };                          // target's S^hid (lower-left corner)
const SLOT_X = { x: 9.4, y: 1.25 };                          // consensus S^X_m
const flowTo = i => 8 + (i - (NM - 1) / 2) * 0.3;            // where each line meets the averaging box
const FS = { chip: 17, tag: 19, op: 28, label: 30, name: 17, cap: 28 };
const VB = { x: 0, y: -940, w: 1600, h: 940 };
const CAP_Y = 0.35;
if (!SHOW_CAPTION) { VB.h = 880; }

/* =====================================================================
   6. HELPERS
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const ramp = (t, t0, dur, ease = easeInOut) => ease(clamp((t - t0) / dur));
const bump = (t, a, b) => ramp(t, a - 0.1, 0.1) * (1 - ramp(t, b, 0.3));
const mixColor = (a, b, p) => {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((A >> s) & 255) * (1 - p) + ((B >> s) & 255) * p);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};

const actors = [];
const on = fn => actors.push(fn);
const fadeIn = (node, t0, dur = 0.4) => on(t => node.setAttribute('opacity', ramp(t, t0, dur)));

const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('fig');
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function rectU(parent, x0, y0, x1, y1, attrs = {}) {
  return el('rect', { x: X(x0), y: Y(y1), width: X(x1 - x0), height: X(y1 - y0), ...attrs }, parent);
}

/* Heatmap drawn in a unit square; place(g, x, y, size) puts its lower-left corner at (x, y). */
function heatmap(parent, M) {
  const g = el('g', {}, parent), n = M.length;
  const cells = M.map((row, i) => row.map((v, j) =>
    el('rect', { x: j / n, y: i / n, width: 1 / n + 0.003, height: 1 / n + 0.003, fill: viridis(v) }, g)));
  el('rect', { x: 0, y: 0, width: 1, height: 1, fill: 'none', stroke: '#2b2b2b', 'stroke-width': 1.2,
               'vector-effect': 'non-scaling-stroke' }, g);
  const set = A => A.forEach((row, i) => row.forEach((v, j) => cells[i][j].setAttribute('fill', viridis(v))));
  return { g, set };
}
const place = (g, x, y, size) => g.setAttribute('transform', `translate(${X(x)} ${Y(y + size)}) scale(${size * U})`);

/* Rich text: strings, {i} italic, {b} bold, {t} plain, with optional {sup}, {sub} (stacked when both). */
function rich(textEl, parts, fs) {
  let shift = 0, padX = 0;
  const span = (s, attrs = {}, newShift = 0) => {
    const dy = newShift - shift; shift = newShift;
    if (dy) attrs.dy = dy;
    if (padX) { attrs.dx = padX; padX = 0; }
    const ts = el('tspan', attrs, textEl); ts.textContent = s; return ts;
  };
  for (const p of parts) {
    if (typeof p === 'string') { span(p); continue; }
    if (p.i) span(p.i, { 'font-style': 'italic' });
    else if (p.b) span(p.b, { 'font-weight': 'bold' });
    else span(p.t, p.big ? { 'font-size': 1.4 * fs } : {});
    const small = (s, it) => ({ 'font-size': 0.7 * fs, 'font-weight': 'normal',
                                'font-style': it || s === 'ℓ' ? 'italic' : 'normal' });
    let supW = 0;
    if (p.sup) supW = span(p.sup, small(p.sup, p.supIt), -0.38 * fs).getComputedTextLength();
    if (p.sub) {
      const s = span(p.sub, small(p.sub, p.subIt), 0.22 * fs);
      if (supW) { const subW = s.getComputedTextLength(); s.setAttribute('dx', -supW); padX = Math.max(0, supW - subW); }
    }
  }
  if (shift) span('​', {}, 0);
  return textEl;
}
/* Label at (x, y); 'middle' / 'end' are aligned on the drawn glyphs. */
function label(parent, x, y, parts, fs, anchor = 'start', attrs = {}) {
  const t = rich(el('text', { x: X(x), y: Y(y), 'font-size': fs, class: 'serif', fill: C.ink, ...attrs }, parent), parts, fs);
  if (anchor !== 'start') {
    const bb = t.getBBox();
    t.setAttribute('x', X(x) - (anchor === 'end' ? bb.x + bb.width - X(x) : bb.x + bb.width / 2 - X(x)));
  }
  return t;
}
/* Arrow (Stealth-like head) that draws itself. */
function arrow(parent, pts, t0, dur = 0.45, { lw = 1, head = 5, color = C.ink } = {}) {
  const L = head * PT, W = 0.75 * L;
  const P = pts.map(([x, y]) => [X(x), Y(y)]);
  const [ax, ay] = P[P.length - 2], [bx, by] = P[P.length - 1];
  const ang = Math.atan2(by - ay, bx - ax);
  const end = [bx - Math.cos(ang) * L * 0.6, by - Math.sin(ang) * L * 0.6];
  const d = 'M ' + P.slice(0, -1).map(p => p.join(' ')).join(' L ') + ' L ' + end.join(' ');
  const shaft = el('path', { d, fill: 'none', stroke: color, 'stroke-width': lw * PT, pathLength: 1, 'stroke-dasharray': '1 2' }, parent);
  const tip = el('path', { d: `M 0 0 L ${-L} ${-W / 2} L ${-0.7 * L} 0 L ${-L} ${W / 2} Z`, fill: color,
                           transform: `translate(${bx} ${by}) rotate(${ang * 180 / Math.PI})` }, parent);
  on(t => {
    const p = ramp(t, t0, dur, easeOut);
    shaft.setAttribute('stroke-dashoffset', 1 - p);
    shaft.setAttribute('opacity', p > 0 ? 1 : 0);
    tip.setAttribute('opacity', clamp((p - 0.85) / 0.15));
  });
}
function popIn(group, cx, cy, t0, dur = 0.3) {
  on(t => {
    const p = clamp((t - t0) / dur), s = p <= 0 ? 0.6 : 0.6 + 0.4 * easeOutBack(p);
    group.setAttribute('opacity', easeOut(p));
    group.setAttribute('transform', `translate(${X(cx)} ${Y(cy)}) scale(${s}) translate(${-X(cx)} ${-Y(cy)})`);
  });
}

/* Which model is the target: weight 0..1 per model (smooth hand-overs), and the marker position. */
function targetW(i, t) {
  let w = 0;
  TARGETS.forEach((m, k) => {
    if (m !== i) return;
    const inn = k === 0 ? ramp(t, T.select, 0.5) : ramp(t, T.rot[k - 1], 0.6);
    const out = k < T.rot.length ? ramp(t, T.rot[k], 0.6) : 0;
    w = Math.max(w, inn * (1 - out));
  });
  return w;
}
const targetX = t => T.rot.reduce((x, r, k) => lerp(x, chipX(TARGETS[k + 1]), ramp(t, r, 0.6)), chipX(TARGETS[0]));

/* =====================================================================
   7. BUILD THE FIGURE
   ===================================================================== */
const gFig   = el('g');
const gLines = el('g', {}, gFig);
const gDecks = el('g', {}, gFig);
const gChips = el('g', {}, gFig);
const gNodes = el('g', {}, gFig);
const gFly   = el('g', {}, gFig);
const gCap   = el('g', {}, gFig);

/* ---- layer matrices of every model (fold out from under the chips) ---- */
const deckFrames = MODELS.map((_, i) => {
  S[i].forEach((M, k) => {
    const hm = heatmap(gDecks, M), p = deckXY(i, k), t0 = T.decks + 0.06 * i + 0.12 * k;
    on(t => { const q = ramp(t, t0, 0.5); place(hm.g, p.x, p.y + 0.5 * (1 - q), MINI); hm.g.setAttribute('opacity', q); });
  });
  return rectU(gDecks, chipX(i) - 0.68, DECK_BOTTOM - 0.1, chipX(i) + 0.68, DECK_TOP + 0.1,
               { fill: 'none', stroke: C.target, 'stroke-width': 3.5, rx: 8, opacity: 0 });
});
on(t => deckFrames.forEach((f, i) => f.setAttribute('opacity', targetW(i, t))));

/* ---- model chips (the target turns blue) ---- */
const chips = MODELS.map((mod, i) => {
  const g = el('g', {}, gChips);
  const r = rectU(g, chipX(i) - CHIP.w / 2, CHIP.y - CHIP.h / 2, chipX(i) + CHIP.w / 2, CHIP.y + CHIP.h / 2, { rx: 7, 'stroke-width': 1.6 });
  const tx = el('text', { x: X(chipX(i)), y: Y(CHIP.y) + 0.35 * FS.chip, 'font-size': FS.chip, 'font-weight': 600,
                          'text-anchor': 'middle', class: 'sans' }, g);
  tx.textContent = mod.short;
  popIn(g, chipX(i), CHIP.y, T.models + 0.08 * i);
  return { r, tx };
});
on(t => chips.forEach((c, i) => {
  const w = targetW(i, t);
  c.r.setAttribute('fill', mixColor(C.chip, C.target, w));
  c.r.setAttribute('stroke', mixColor(C.chipStroke, C.target, w));
  c.tx.setAttribute('fill', mixColor(C.slate, '#ffffff', w));
}));

/* ---- "target m" marker above the chip ---- */
{
  const g = el('g', {}, gNodes);
  const t = el('text', { x: 0, y: Y(8.78), 'font-size': FS.tag, 'font-weight': 600, 'text-anchor': 'middle', class: 'sans', fill: C.target }, g);
  t.textContent = 'target ';
  el('tspan', { 'font-style': 'italic', class: 'serif', 'font-weight': 'normal' }, t).textContent = 'm';
  on(tt => { g.setAttribute('transform', `translate(${X(targetX(tt))} 0)`); g.setAttribute('opacity', ramp(tt, T.select, 0.4)); });
}

/* ---- lines from the other models into the averaging box (none from the target) ---- */
const flows = MODELS.map((_, i) => {
  const from = [chipX(i), DECK_BOTTOM - 0.12], to = [flowTo(i), OP.y1];
  const path = el('path', { d: `M ${X(from[0])} ${Y(from[1])} L ${X(to[0])} ${Y(to[1])}`, fill: 'none', stroke: C.cons,
                            'stroke-width': 2.2, 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 2' }, gLines);
  on(t => {
    path.setAttribute('stroke-dashoffset', 1 - ramp(t, T.flow + 0.04 * i, 0.5, easeOut));
    path.setAttribute('opacity', (t >= T.flow ? 0.9 : 0) * (1 - targetW(i, t)));
  });
  return { from, to };
});

/* ---- averaging box with the formula ---- */
const opGlow = rectU(gNodes, OP.x0 - 0.05, OP.y0 - 0.05, OP.x1 + 0.05, OP.y1 + 0.05, { fill: 'none', stroke: C.cons, 'stroke-width': 7, rx: 11, opacity: 0 });
{
  const g = el('g', {}, gNodes);
  rectU(g, OP.x0, OP.y0, OP.x1, OP.y1, { fill: C.opFill, stroke: C.cons, 'stroke-width': 2.5, rx: 8 });
  label(g, (OP.x0 + OP.x1) / 2, (OP.y0 + OP.y1) / 2 - 0.1,
        [{ b: 'S', sup: 'X', sub: 'm', subIt: true }, ' = ', { t: '1' }, '/', { i: 'Z' }, '  ',
         { t: '∑', big: true, sub: 'm′≠m', subIt: true }, ' ', { t: '∑', big: true, sub: 'ℓ' }, ' ',
         { b: 'S', sup: 'm′', supIt: true, sub: 'ℓ' }], FS.op, 'middle');
  fadeIn(g, T.flow - 0.2, 0.4);
}

/* ---- consensus S^X_m: builds up as the matrices arrive, then follows the target ---- */
const contrib = others(TARGETS[0]);
const arrivals = [];
const RUN = [null];                                    // RUN[n] = mean of the first n contributions
contrib.forEach((_, n) => RUN.push(meanOf(contrib.slice(0, n + 1).map(([i, k]) => S[i][k]))));
const cons = heatmap(gNodes, CONS[0]);
place(cons.g, SLOT_X.x, SLOT_X.y, BIG);
{
  const frame = rectU(gNodes, SLOT_X.x - 0.07, SLOT_X.y - 0.07, SLOT_X.x + BIG + 0.07, SLOT_X.y + BIG + 0.07,
                      { fill: 'none', stroke: C.cons, 'stroke-width': 4.5, rx: 6 });
  const lbl = label(gNodes, SLOT_X.x, SLOT_X.y + BIG + 0.2, [{ b: 'S', sup: 'X', sub: 'm', subIt: true }], FS.label);
  fadeIn(frame, T.avg, 0.4); fadeIn(lbl, T.avg, 0.4);
  arrow(gLines, [[SLOT_X.x + 1.0, OP.y0], [SLOT_X.x + 1.0, SLOT_X.y + BIG + 0.1]], T.avg, 0.4, { color: C.cons });
}
// flights: every layer matrix of every other model shrinks into the averaging box
contrib.forEach(([i, k], n) => {
  const hm = heatmap(gFly, S[i][k]);
  const p0 = deckXY(i, k), t0 = T.avg + n * T.avgStagger, dur = 0.75;
  const to = { x: flowTo(i), y: (OP.y0 + OP.y1) / 2 };
  arrivals.push(t0 + dur);
  on(t => {
    const p = ramp(t, t0, dur), size = lerp(MINI, 0.22, p);
    place(hm.g, lerp(p0.x + MINI / 2, to.x, p) - size / 2, lerp(p0.y + MINI / 2, to.y, p) - size / 2, size);
    hm.g.setAttribute('opacity', t < t0 ? 0 : 1 - ramp(t, t0 + 0.55 * dur, 0.45 * dur));
  });
});
on(t => {
  const n = arrivals.filter(a => a <= t).length;
  let M = null;
  if (n > 0) M = lerpM(RUN[Math.max(1, n - 1)], RUN[n], clamp((t - arrivals[n - 1]) / 0.2));
  T.rot.forEach((r, k) => { const p = ramp(t, r + 0.75, 0.8); if (p > 0) M = lerpM(CONS[k], CONS[k + 1], p); });
  cons.g.setAttribute('opacity', n > 0 ? 1 : 0);
  if (M) cons.set(M);
  // the averaging box glows while matrices arrive
  const g1 = bump(t, arrivals[0] - 0.1, arrivals[arrivals.length - 1]);
  const g2 = Math.max(0, ...T.rot.map(r => bump(t, r + 0.55, r + 0.95)));
  opGlow.setAttribute('opacity', 0.45 * Math.max(g1, g2));
});

/* ---- the target's own hidden-state geometry S^hid_{m,l}, compared with S^X_m ---- */
{
  const landing = [];
  TARGETS.forEach((m, k) => {
    const hm = heatmap(gFly, S[m][1]);
    const p0 = deckXY(m, 1), t0 = k === 0 ? T.cmp : T.rot[k - 1] + 0.2, dur = 0.8;
    landing.push(t0 + dur);
    const next = k < T.rot.length ? T.rot[k] + 0.2 + dur : Infinity;
    on(t => {
      const p = ramp(t, t0, dur);
      place(hm.g, lerp(p0.x, SLOT_T.x, p), lerp(p0.y, SLOT_T.y, p), lerp(MINI, BIG, p));
      hm.g.setAttribute('opacity', (t >= t0 ? 1 : 0) * (1 - ramp(t, next - 0.25, 0.25)));
    });
    const name = el('text', { x: X(SLOT_T.x + BIG / 2), y: Y(SLOT_T.y - 0.32), 'font-size': FS.name, 'text-anchor': 'middle',
                              class: 'sans', fill: C.target }, gNodes);
    name.textContent = MODELS[m].name;
    const nextStart = k < T.rot.length ? T.rot[k] + 0.2 : Infinity;      // the old name leaves before the new one comes
    on(t => name.setAttribute('opacity', ramp(t, t0 + dur - 0.1, 0.3) * (1 - ramp(t, nextStart, 0.25))));
  });
  const frame = rectU(gNodes, SLOT_T.x - 0.07, SLOT_T.y - 0.07, SLOT_T.x + BIG + 0.07, SLOT_T.y + BIG + 0.07,
                      { fill: 'none', stroke: C.target, 'stroke-width': 4.5, rx: 6 });
  const lbl = label(gNodes, SLOT_T.x, SLOT_T.y + BIG + 0.2, [{ b: 'S', sup: 'hid', sub: 'm,ℓ', subIt: true }], FS.label);
  fadeIn(frame, landing[0] - 0.2, 0.4); fadeIn(lbl, landing[0] - 0.2, 0.4);
  // RSA between the two
  const y = SLOT_T.y + BIG / 2, mid = 8;
  arrow(gLines, [[mid, y], [SLOT_T.x + BIG + 0.18, y]], landing[0] + 0.1, 0.45);
  arrow(gLines, [[mid, y], [SLOT_X.x - 0.18, y]], landing[0] + 0.1, 0.45);
  const r = label(gNodes, mid, y + 0.25, [{ i: 'r' }, '(', { b: 'S', sup: 'hid', sub: 'm,ℓ', subIt: true }, ', ',
                                           { b: 'S', sup: 'X', sub: 'm', subIt: true }, ')'], 26, 'middle');
  fadeIn(r, landing[0] + 0.35, 0.4);
}

/* ---- when the target moves on: pulses along the lines into the average ---- */
T.rot.forEach((r, k) => {
  const m = TARGETS[k + 1];
  MODELS.forEach((_, i) => {
    if (i === m) return;
    const d = el('circle', { r: 7, fill: C.cons, stroke: '#fff', 'stroke-width': 1.5, opacity: 0 }, gFly);
    const s = r + 0.3 + 0.02 * i, dur = 0.45, f = flows[i];
    on(t => {
      const p = (t - s) / dur;
      if (p < 0 || p > 1) { d.setAttribute('opacity', 0); return; }
      d.setAttribute('cx', X(lerp(f.from[0], f.to[0], easeInOut(p))));
      d.setAttribute('cy', Y(lerp(f.from[1], f.to[1], easeInOut(p))));
      d.setAttribute('opacity', 1);
    });
  });
});

/* ---- caption ---- */
if (SHOW_CAPTION) {
  CAPTIONS.forEach(([a, b, parts]) => {
    const txt = label(gCap, 8, CAP_Y, parts, FS.cap, 'middle', { class: 'cap' });
    on(t => txt.setAttribute('opacity', ramp(t, a, 0.3) * (1 - ramp(t, b - 0.3, 0.3))));
  });
}

on(t => gFig.setAttribute('opacity', 1 - ramp(t, T.fadeOut, 0.7)));

/* =====================================================================
   8. PLAYBACK
   ===================================================================== */
const render = t => { for (const f of actors) f(t); };
window.renderAt = render;
window.LOOP_SECONDS = T.loop;            // in timeline seconds
window.PLAYBACK = PLAYBACK;            // real-time length = LOOP_SECONDS / PLAYBACK

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (FREEZE !== null || reduceMotion) {
  render(FREEZE !== null ? FREEZE : T.fadeOut - 0.01);
  return;
}
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.5.5 0 0 0 .77.42l8.5-5.5a.5.5 0 0 0 0-.84l-8.5-5.5A.5.5 0 0 0 4 2.5z"/></svg>';
const ctl = document.getElementById('ctl');
const btnPlay = document.getElementById('btn-play');
const btnRestart = document.getElementById('btn-restart');
let paused = false, visible = true, elapsed = 0, last = null, dirty = true;
const wrap = t => ((t % T.loop) + T.loop) % T.loop;
const setPaused = p => {
  paused = p;
  btnPlay.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
  btnPlay.setAttribute('aria-label', p ? 'Play animation' : 'Pause animation');
  btnPlay.title = p ? 'Play' : 'Pause';
  ctl.classList.toggle('paused', p);
};
const togglePause = () => setPaused(!paused);
const seek = dt => { elapsed += dt; dirty = true; };
const restart = () => { elapsed = 0; dirty = true; };
function frame(now) {
  const dt = last === null ? 0 : Math.min(0.1, (now - last) / 1000);   // no jump after a background tab
  last = now;
  if (visible && !paused) { elapsed += dt * SPEED; dirty = true; }
  if (dirty) { render(wrap(elapsed)); dirty = false; }
  requestAnimationFrame(frame);
}
// Play only while at least 30 % of the figure is on screen. Inside an <iframe>, the observer
// measures against the top-level page viewport, so the loop starts when the reader scrolls to it.
if ('IntersectionObserver' in window) {
  visible = false;
  new IntersectionObserver(entries => {
    for (const e of entries) visible = e.isIntersecting && e.intersectionRatio >= 0.3;
  }, { threshold: [0, 0.3] }).observe(document.getElementById('fig'));
}
btnPlay.addEventListener('click', togglePause);
btnRestart.addEventListener('click', restart);
ctl.addEventListener('click', e => e.stopPropagation());          // buttons do not also toggle via the page
document.addEventListener('click', togglePause);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.key === 'Enter')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'ArrowRight') seek(0.25);
  else if (e.key === 'ArrowLeft') seek(-0.25);
  else if (e.key === 'r' || e.key === 'R') restart();
});
setPaused(false);
ctl.hidden = false;
requestAnimationFrame(frame);
})();
</script>
