<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conceptual RSA Loop</title>
<!--
  Animated, looping version of the conceptual overview figure (two paths to the same geometry).
  Source: talks_and_posters/2026-05-behavioral_clones/plots/00_conceptual/
          conceptual_pipeline.tex + input/conceptual_points.csv  (same layout, vectors, colours)

  Every word of the vocabulary goes through the language model twice: Path A reads out a
  hidden-state vector, Path B records a behavioral vector. Cosine similarity between the
  vectors gives S^hid_l and S^beh, and RSA correlates the two.
  This version adds a final step below: the lower triangles of both matrices are stacked
  into two vectors, which are compared element by element (Pearson r).

  Open this file in a browser. Controls:
    space / click   pause / resume
    left / right    step back / forward 0.25 s (handy while paused)
    r               restart from the beginning
    buttons (top right)  pause / resume, restart
  When embedded in a page, the loop starts once it scrolls into view and pauses while off screen.
  (Generated by publish_to_blog.py from the file in context/visualizations; edit that one.)

  URL options (append to the file URL, e.g. conceptual_loop.html?t=12):
    ?t=12             freeze at second 12 (no animation)
    ?speed=0.5        play at half speed
    ?caption=0        hide the caption line
    ?bg=transparent   transparent instead of white background
    ?sync=name        share one clock with the other frames on the page that use the same name
-->
<style>
  :root { --bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg  { width: 100vw; height: 100vh; display: block; }
  .serif { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; }
  .mono  { font-family: "Courier New", Courier, monospace; }
  .cap   { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; fill: #333; white-space: pre; }
  #ctl { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px;
         opacity: .55; transition: opacity .2s; }
  #ctl[hidden] { display: none; }
  #ctl:hover, #ctl:focus-within, #ctl.paused { opacity: 1; }
  #ctl button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
                border: 1px solid #C5CAD1; border-radius: 50%; background: rgba(255,255,255,.92);
                color: #333; cursor: pointer; }
  #ctl button:hover { background: #F3F4F6; }
  #ctl button:focus-visible { outline: 2px solid #3B4CC0; outline-offset: 2px; }
  #ctl svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  #fig { cursor: pointer; }
</style>
</head>
<body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Animated conceptual overview: the vocabulary cat, dog, rat, fox goes through a language model; path A extracts hidden-state vectors, path B records behavioral vectors; cosine similarity gives two similarity matrices, which RSA correlates; their lower triangles are stacked into two vectors and compared element by element."></svg>
<div id="ctl" hidden>
  <button id="btn-restart" type="button" aria-label="Restart animation" title="Restart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5V.5L4.75 3.5 8 6.5V4a4 4 0 1 1-4 4H2.5A5.5 5.5 0 1 0 8 2.5z"/></svg></button>
  <button id="btn-play" type="button" aria-label="Pause animation" title="Pause"></button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. DATA  (from input/conceptual_points.csv; change to change the example)
   ===================================================================== */
const WORDS  = ['cat', 'dog', 'rat', 'fox'];          // vocabulary V (also the row/column order of the matrices)
const COLORS = { cat: '#CC79A7', dog: '#E69F00', rat: '#56B4E9', fox: '#009E73' };   // Okabe-Ito
const VEC_HID = { cat: [0.35, 0.70], dog: [0.80, 0.30], rat: [0.15, 0.70], fox: [0.60, 0.55] };  // panel L
const VEC_BEH = { cat: [0.60, 0.60], dog: [0.80, 0.45], rat: [0.80, 0.10], fox: [0.40, 0.80] };  // panel R
const VIRIDIS_RANGE = [0.2, 1];                        // similarity mapped to the viridis colour scale

/* =====================================================================
   2. TIMELINE  (seconds)
   ===================================================================== */
const T = {
  vocab: 0.0,                       // vocabulary box + cards
  lm: 1.1,                          // language-model box
  pathA: 2.1, runsA: 3.5,           // hidden-state extraction box + panel; one run per word
  pathB: 6.7, runsB: 8.1,           // behavioral experiment box + panel; one run per word
  runStagger: 0.6,
  mats: 11.4, rows: 12.1, rowStagger: 0.6,   // similarity matrices, filled row by row
  rsa: 14.7,                        // comparison arrow + r(.,.)
  tril: 15.6,                       // lower triangles light up; two empty vectors appear below
  flyA: 16.1, flyB: 17.1, flyStagger: 0.12,   // lower-triangle entries fly into the vectors
  compare: 18.7, cmpStagger: 0.35,  // element-by-element comparison
  result: 21.0,                     // brace + r(.,.) next to the vectors
  fadeOut: 24.0,
  loop: 25.0,
};

const M = (b, sup, sub) => ({ b, sup, sub });       // bold matrix name with super-/subscript
const CAPTIONS = [
  [T.vocab, T.pathA, ['One vocabulary ', {cal: 'V'}, ', one language model']],
  [T.pathA, T.pathB, [{bold: 'Path A'}, ' (internal): a hidden state ', {i: 'h', sub: 'ℓ'}, '(', {i: 'w'}, ') for every word']],
  [T.pathB, T.mats,  [{bold: 'Path B'}, ' (external): behavior ', {i: 'b', sub: 'w', subIt: true}, ' for every word']],
  [T.mats,  T.rsa,   ['Cosine between word vectors gives ', M('S', 'hid', 'ℓ'), ' and ', M('S', 'beh')]],
  [T.rsa,     T.tril,    ['RSA correlates the pairwise similarities of ', M('S', 'hid', '\u2113'), ' and ', M('S', 'beh')]],
  [T.tril,    T.compare, ['The lower triangles are stacked into vectors']],
  [T.compare, T.fadeOut, ['The two vectors are compared element by element (Pearson ', {i: 'r'}, ')']],
];

/* =====================================================================
   3. SETTINGS FROM THE URL
   ===================================================================== */
const params       = new URLSearchParams(location.search);
const FREEZE       = params.has('t') ? parseFloat(params.get('t')) : null;
const PLAYBACK     = 0.8;          // overall playback rate: 1 = timeline seconds, < 1 = slower
const SPEED        = PLAYBACK * parseFloat(params.get('speed') || '1');
const SHOW_CAPTION = params.get('caption') !== '0';
if (params.get('bg') === 'transparent') document.documentElement.style.setProperty('--bg', 'transparent');

/* =====================================================================
   4. GEOMETRY  (TikZ grid units of 0.4 cm, y up -> SVG units, y down)
   ===================================================================== */
const U  = 40, PT = 3.5146;
const X  = x => +(x * U).toFixed(2);
const Y  = y => +(-y * U).toFixed(2);

const N = WORDS.length;
const GAP = 9;
const matLcx = N / 2, matRcx = N + GAP + N / 2, figCx = (2 * N + GAP) / 2;
const panelBy = N + 1.6, panelH = 4.0, panelTy = panelBy + panelH, panelW = 4;
const loopBy = panelTy + 1.7, loopH = 2.6, loopTy = loopBy + loopH, loopW = 7.4;
const lmBy = loopTy + 1.4, lmH = 1.7, lmTy = lmBy + lmH, lmMidY = lmBy + lmH / 2;
const vocabBy = lmTy + 2.0;
const vSq = 1.35, vGap = 0.4, vPad = 0.3;
const vocabW = N * vSq + (N - 1) * vGap + 2 * vPad, vocabH = vSq + 2 * vPad;
const vocabLx = figCx - vocabW / 2, vocabTy = vocabBy + vocabH;
const lmLx = vocabLx, lmW = vocabW;
const VEC_SCALE = 1.2;
const PANELS = { A: { x: matLcx - panelW / 2, cx: matLcx, vec: VEC_HID, name: 'Hidden-State Extraction' },
                 B: { x: matRcx - panelW / 2, cx: matRcx, vec: VEC_BEH, name: 'Behavioral Experiment' } };
const MATX = { A: 0, B: N + GAP };
const cardX = k => vocabLx + vPad + k * (vSq + vGap);
const NPAIR = N * (N - 1) / 2;                           // entries in the lower triangle
const VEC = { x0: figCx - NPAIR / 2, yA: -2.3, yB: -4.1 };  // the two vectors (lower-left corners)

const INK = '#000', CARD_INK = '#525860', CARD_SHADOW = 'rgb(204,207,210)';
const HILITE = '#3B4CC0';
const FS = { label: 35, vocab: 28, lm: 32, head: 25, code: 20, cap: 30 };

const CAP_Y = Y(VEC.yB - 0.6) + 55;
const VB = { x: X(-2.3), y: Y(vocabTy + 1.6), w: X(21.6) };
VB.h = (SHOW_CAPTION ? CAP_Y + 25 : Y(VEC.yB - 0.9)) - VB.y;

/* Derived: cosine similarity matrices in vocabulary order */
const cos2 = (a, b) => (a[0] * b[0] + a[1] * b[1]) / (Math.hypot(...a) * Math.hypot(...b));
const SIM = {
  A: WORDS.map(a => WORDS.map(b => cos2(VEC_HID[a], VEC_HID[b]))),
  B: WORDS.map(a => WORDS.map(b => cos2(VEC_BEH[a], VEC_BEH[b]))),
};
const VIRIDIS = ['#440154', '#482475', '#414487', '#355f8d', '#2a788e', '#21918c',
                 '#22a884', '#44bf70', '#7ad151', '#bddf26', '#fde725'];
function viridis(v) {
  const p = Math.max(0, Math.min(1, (v - VIRIDIS_RANGE[0]) / (VIRIDIS_RANGE[1] - VIRIDIS_RANGE[0]))) * 10;
  const i = Math.min(9, Math.floor(p)), f = p - i;
  const a = parseInt(VIRIDIS[i].slice(1), 16), b = parseInt(VIRIDIS[i + 1].slice(1), 16);
  const ch = s => Math.round(((a >> s) & 255) * (1 - f) + ((b >> s) & 255) * f);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
}

/* =====================================================================
   5. ANIMATION HELPERS
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const easeInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const ramp = (t, t0, dur, ease = easeInOut) => ease(clamp((t - t0) / dur));
const bump = (t, a, b) => ramp(t, a - 0.08, 0.08) * (1 - ramp(t, b, 0.3));

const actors = [];
const on = fn => actors.push(fn);
const fadeIn = (node, t0, dur = 0.4) => on(t => node.setAttribute('opacity', ramp(t, t0, dur)));

function along(pts, p) {
  const seg = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]));
  let d = clamp(p) * seg.reduce((a, b) => a + b, 0);
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {
      const f = seg[i] ? Math.min(1, d / seg[i]) : 0;
      return [pts[i][0] + f * (pts[i + 1][0] - pts[i][0]), pts[i][1] + f * (pts[i + 1][1] - pts[i][1])];
    }
    d -= seg[i];
  }
  return pts[pts.length - 1];
}
function fracAt(pts, k) {
  const seg = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]));
  return seg.slice(0, k).reduce((a, b) => a + b, 0) / seg.reduce((a, b) => a + b, 0);
}

/* =====================================================================
   6. SVG HELPERS
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('fig');
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function rectU(parent, x0, y0, x1, y1, attrs = {}) {
  return el('rect', { x: X(x0), y: Y(y1), width: X(x1 - x0), height: X(y1 - y0), ...attrs }, parent);
}
/* Appends rich text to an SVG <text>: strings, {i} italic, {b}/{bold} bold, {cal} calligraphic,
   {mono}, and super-/subscripts ({sup}, {sub}; both together are stacked). */
function rich(textEl, parts, fs) {
  let shift = 0, padX = 0;                       // current baseline offset (+ = down); pending x advance
  const span = (s, attrs = {}, newShift = 0) => {
    const dy = newShift - shift; shift = newShift;
    if (dy) attrs.dy = dy;
    if (padX) { attrs.dx = padX; padX = 0; }
    const ts = el('tspan', attrs, textEl); ts.textContent = s; return ts;
  };
  for (const p of parts) {
    if (typeof p === 'string') { span(p); continue; }
    if (p.mono)     span(p.mono, { class: 'mono' });
    else if (p.cal) span('𝒱', { class: 'serif' });                   // calligraphic V
    else if (p.i)   span(p.i, { 'font-style': 'italic' });
    else            span(p.b || p.bold, { 'font-weight': 'bold' });
    const small = (s, italic) => ({ 'font-size': 0.7 * fs, 'font-weight': 'normal',
                                    'font-style': italic || s === 'ℓ' ? 'italic' : 'normal' });
    let supW = 0;
    if (p.sup) supW = span(p.sup, small(p.sup), -0.38 * fs).getComputedTextLength();
    if (p.sub) {
      const s = span(p.sub, small(p.sub, p.subIt), 0.22 * fs);
      if (supW) {                                // stack the subscript under the superscript
        const subW = s.getComputedTextLength();
        s.setAttribute('dx', -supW);
        padX = Math.max(0, supW - subW);
      }
    }
  }
  return textEl;
}
/* Label at (x, y). 'middle' and 'end' are aligned on the drawn glyphs (getBBox), so stacked
   super-/subscripts such as S^hid_l are measured with their full width. */
function label(parent, x, y, parts, fs, anchor = 'start', cls = 'serif') {
  const t = rich(el('text', { x: X(x), y: Y(y), 'font-size': fs, class: cls, fill: INK }, parent), parts, fs);
  if (anchor !== 'start') {
    const bb = t.getBBox();
    const shift = anchor === 'end' ? bb.x + bb.width - X(x) : bb.x + bb.width / 2 - X(x);
    t.setAttribute('x', X(x) - shift);
  }
  return t;
}
/* Arrow with a Stealth-like head that draws itself from start to end. */
function arrow(parent, pts, t0, dur = 0.45, { lw = 1, head = 5, color = INK, op = null } = {}) {
  const L = head * PT, W = 0.75 * L;
  const P = pts.map(([x, y]) => [X(x), Y(y)]);
  const [ax, ay] = P[P.length - 2], [bx, by] = P[P.length - 1];
  const ang = Math.atan2(by - ay, bx - ax);
  const end = [bx - Math.cos(ang) * L * 0.6, by - Math.sin(ang) * L * 0.6];
  const d = 'M ' + P.slice(0, -1).map(p => p.join(' ')).join(' L ') + ' L ' + end.join(' ');
  const g = el('g', {}, parent);
  const shaft = el('path', { d, fill: 'none', stroke: color, 'stroke-width': lw * PT,
                             pathLength: 1, 'stroke-dasharray': '1 2' }, g);
  const tip = el('path', { d: `M 0 0 L ${-L} ${-W / 2} L ${-0.7 * L} 0 L ${-L} ${W / 2} Z`, fill: color,
                           transform: `translate(${bx} ${by}) rotate(${ang * 180 / Math.PI})` }, g);
  on(t => {
    const p = ramp(t, t0, dur, easeOut);
    shaft.setAttribute('stroke-dashoffset', 1 - p);
    shaft.setAttribute('opacity', p > 0 ? 1 : 0);
    tip.setAttribute('opacity', clamp((p - 0.85) / 0.15));
    if (op) g.setAttribute('opacity', op(t));
  });
  return g;
}
const shorten = ([a, b], s) => {          // shorten a segment by s at both ends
  const dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy);
  return [[a[0] + dx / l * s, a[1] + dy / l * s], [b[0] - dx / l * s, b[1] - dy / l * s]];
};

/* =====================================================================
   7. BUILD THE FIGURE
   ===================================================================== */
const gFig   = el('g');
const gLines = el('g', {}, gFig);
const gNodes = el('g', {}, gFig);
const gHi    = el('g', {}, gFig);
const gDots  = el('g', {}, gFig);
const gCap   = el('g', {}, gFig);

/* ---- Vocabulary V ---- */
const cards = WORDS.map((w, k) => {
  const x = cardX(k), y = vocabBy + vPad;
  const g = el('g', {}, gNodes);
  rectU(g, x + 0.12 * vSq, y - 0.12 * vSq, x + 0.12 * vSq + vSq, y - 0.12 * vSq + vSq, { fill: CARD_SHADOW });
  const face = el('g', {}, g);
  rectU(face, x, y, x + vSq, y + vSq, { fill: COLORS[w], stroke: CARD_INK, 'stroke-width': 0.9 * PT });
  const glow = rectU(face, x, y, x + vSq, y + vSq, { fill: 'none', stroke: '#000', 'stroke-width': 5, opacity: 0 });
  el('text', { x: X(x + vSq / 2), y: Y(y + vSq / 2) + 0.3 * FS.vocab, 'font-size': FS.vocab,
               'text-anchor': 'middle', class: 'serif', fill: CARD_INK }, face).textContent = w;
  const t0 = T.vocab + 0.25 + 0.12 * k;
  on(t => {                                      // pop in
    const p = clamp((t - t0) / 0.3), s = p <= 0 ? 0.6 : 0.6 + 0.4 * easeOutBack(p);
    const cx = X(x + vSq / 2), cy = Y(y + vSq / 2);
    g.setAttribute('opacity', easeOut(p));
    g.setAttribute('transform', `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
  });
  return { face, glow, cx: x + vSq / 2 };
});
{
  const box = rectU(gNodes, vocabLx, vocabBy, vocabLx + vocabW, vocabTy, { fill: 'none', stroke: INK, 'stroke-width': PT });
  fadeIn(box, T.vocab, 0.4);
  const v = label(gNodes, figCx, vocabTy + 0.45, [{ cal: 'V' }], FS.label, 'middle');
  fadeIn(v, T.vocab + 0.3);
}

/* ---- Language model ---- */
const lm = el('g', {}, gNodes);
rectU(lm, lmLx, lmBy, lmLx + lmW, lmTy, { fill: '#fff', stroke: INK, 'stroke-width': PT });
el('text', { x: X(figCx), y: Y(lmMidY) + 0.34 * FS.lm, 'font-size': FS.lm, 'font-weight': 'bold',
             'text-anchor': 'middle', class: 'serif', fill: INK }, lm).textContent = 'Language Model';
const lmGlow = rectU(lm, lmLx, lmBy, lmLx + lmW, lmTy, { fill: 'none', 'stroke-width': 6, opacity: 0 });
fadeIn(lm, T.lm + 0.25);
arrow(gLines, [[figCx, vocabBy], [figCx, lmTy]], T.lm, 0.4);

/* ---- The two paths: loop box + vector panel ---- */
function buildPath(key, tPath) {
  const P = PANELS[key], left = key === 'A';
  const lx = P.cx - loopW / 2;
  // loop box with pseudo-code
  const g = el('g', {}, gNodes);
  rectU(g, lx, loopBy, lx + loopW, loopTy, { fill: '#fff', stroke: INK, 'stroke-width': PT });
  el('text', { x: X(P.cx), y: Y(loopTy - 0.75), 'font-size': FS.head, 'font-weight': 'bold',
               'text-anchor': 'middle', class: 'serif', fill: INK }, g).textContent = P.name;
  label(g, lx + 0.35, loopTy - 1.5, [{ mono: 'for ' }, { i: 'w' }, ' ∈ ', { cal: 'V' }, { mono: ':' }], FS.code);
  label(g, lx + 0.95, loopTy - 2.15, left
    ? [{ i: 'h', sub: 'ℓ' }, '(', { i: 'w' }, ') ← ', { mono: 'encode', sub: 'ℓ' }, '(', { i: 'w' }, ')']
    : [{ i: 'b', sub: 'w', subIt: true }, ' ← ', { mono: 'behavior' }, '(', { i: 'w' }, ')'], FS.code);
  const glow = rectU(g, lx, loopBy, lx + loopW, loopTy, { fill: 'none', 'stroke-width': 6, opacity: 0 });
  fadeIn(g, tPath + 0.3);
  const elbow = [[left ? lmLx : lmLx + lmW, lmMidY], [P.cx, lmMidY], [P.cx, loopTy]];
  arrow(gLines, elbow, tPath, 0.5);
  arrow(gLines, [[P.cx, loopBy], [P.cx, panelTy]], tPath + 0.7, 0.35);

  // vector panel: border, grid, axes, label
  const gp = el('g', {}, gNodes);
  for (let i = 1; i < 10; i++) {
    const s = i * 0.4;
    el('path', { d: `M ${X(P.x + s)} ${Y(panelBy)} V ${Y(panelTy)} M ${X(P.x)} ${Y(panelBy + s)} H ${X(P.x + panelW)}`,
                 stroke: '#e6e6e6', 'stroke-width': 0.3 * PT }, gp);
  }
  rectU(gp, P.x, panelBy, P.x + panelW, panelTy, { fill: 'none', stroke: INK, 'stroke-width': PT });
  label(gp, P.x, panelTy + 0.45, [left ? { b: 'H', sub: 'ℓ' } : { b: 'B' }], FS.label);
  fadeIn(gp, tPath + 0.9);
  arrow(gp, [[P.x, panelBy], [P.x + panelW, panelBy]], tPath + 0.9, 0.01, { lw: 0.7, head: 3 });
  arrow(gp, [[P.x, panelBy], [P.x, panelTy]], tPath + 0.9, 0.01, { lw: 0.7, head: 3 });
  return { glow, elbow };
}
const paths = { A: buildPath('A', T.pathA), B: buildPath('B', T.pathB) };

/* ---- Runs: each word travels V -> LM -> loop box -> panel, and becomes a vector ---- */
const vectors = { A: [], B: [] };          // arrow groups, for dimming during the matrix phase
const focusRow = t => {                    // which row is being filled (for dimming), or null
  const i = Math.floor((t - T.rows) / T.rowStagger);
  return t >= T.rows && i < N ? i : null;
};
const DOT_DELAY = 0.1, DOT_DUR = 0.8;     // inside a run: when the dot leaves the card, how long it travels
const runs = [];                           // one entry per (path, word)
['A', 'B'].forEach(key => {
  const P = PANELS[key], tRuns = key === 'A' ? T.runsA : T.runsB;
  WORDS.forEach((w, k) => {
    // route: card -> V box bottom -> LM top -> LM centre -> LM side -> corner -> loop top -> loop bottom -> panel
    const route = [[cards[k].cx, vocabBy + vPad], [figCx, vocabBy], [figCx, lmTy], [figCx, lmMidY],
                   ...paths[key].elbow, [P.cx, loopBy], [P.cx, panelTy]];
    const t0 = tRuns + k * T.runStagger + DOT_DELAY;
    runs.push({ key, k, w, route, t0,
                lm:   [t0 + fracAt(route, 2) * DOT_DUR, t0 + fracAt(route, 4) * DOT_DUR],
                loop: [t0 + fracAt(route, 6) * DOT_DUR, t0 + fracAt(route, 7) * DOT_DUR] });
    // the word's vector grows from the panel origin when the dot arrives
    const v = P.vec[w];
    const tip = [P.x + VEC_SCALE * v[0] * panelW, panelBy + VEC_SCALE * v[1] * panelH];
    vectors[key][k] = arrow(gNodes, [[P.x, panelBy], tip], t0 + DOT_DUR - 0.05, 0.4,
      { lw: 1, head: 4, color: COLORS[w], op: t => { const f = focusRow(t); return f === null || f === k ? 1 : 0.25; } });
  });
});
const dot = el('circle', { r: 0.28 * U, stroke: CARD_INK, 'stroke-width': 2, opacity: 0 }, gDots);
on(t => {
  // the dot of the active run (runs of one path overlap slightly; the latest one wins)
  dot.setAttribute('opacity', 0);
  runs.forEach(r => {
    const p = (t - r.t0) / DOT_DUR;
    if (p < 0 || p > 1) return;
    const [x, y] = along(r.route, p);
    dot.setAttribute('cx', X(x)); dot.setAttribute('cy', Y(y));
    dot.setAttribute('fill', COLORS[r.w]);
    dot.setAttribute('opacity', p > 0.92 ? (1 - p) / 0.08 : 1);
  });
  // boxes glow in the word's colour while the dot is inside
  const glow = (target, win) => {
    let a = 0, col = '#000';
    runs.forEach(r => { const g = win(r); if (g > a) { a = g; col = COLORS[r.w]; } });
    target.setAttribute('opacity', a); target.setAttribute('stroke', col);
  };
  glow(lmGlow, r => bump(t, ...r.lm));
  ['A', 'B'].forEach(key => glow(paths[key].glow, r => (r.key === key ? bump(t, ...r.loop) : 0)));
  // the card lifts as its word sets off
  cards.forEach((c, k) => {
    const lift = Math.max(0, ...runs.filter(r => r.k === k).map(r => bump(t, r.t0 - DOT_DELAY, r.t0 + 0.15)));
    c.face.setAttribute('transform', `translate(0 ${-0.3 * U * lift})`);
    c.glow.setAttribute('opacity', lift);
  });
});

/* ---- Similarity matrices ---- */
const cells = { A: [], B: [] }, cellHi = { A: [], B: [] }, rowHi = { A: [], B: [] };
['A', 'B'].forEach(key => {
  const x0 = MATX[key];
  const g = el('g', {}, gNodes);
  for (let i = 0; i < N; i++) {
    cells[key][i] = [];
    cellHi[key][i] = [];
    for (let j = 0; j < N; j++) {
      const r = rectU(g, x0 + j, N - 1 - i, x0 + j + 1, N - i, { fill: viridis(SIM[key][i][j]), opacity: 0 });
      cells[key][i][j] = r;
      cellHi[key][i][j] = rectU(gHi, x0 + j + 0.08, N - 1 - i + 0.08, x0 + j + 0.92, N - i - 0.08,
                                { fill: 'none', stroke: '#fff', 'stroke-width': 3.5, opacity: 0 });
    }
    rowHi[key][i] = rectU(gHi, x0 - 0.06, N - 1 - i - 0.06, x0 + N + 0.06, N - i + 0.06,
                          { fill: 'none', stroke: COLORS[WORDS[i]], 'stroke-width': 5, opacity: 0 });
  }
  rectU(g, x0, 0, x0 + N, N, { fill: 'none', stroke: INK, 'stroke-width': PT });
  label(g, x0, N + 0.45, [key === 'A' ? M('S', 'hid', 'ℓ') : M('S', 'beh')], FS.label);
  fadeIn(g, T.mats + 0.25);
  arrow(gLines, shorten([[PANELS[key].cx, panelBy], [PANELS[key].cx, N]], 0.3), T.mats, 0.35, { lw: 0.8, head: 4 });
  // row i fills while word i's vectors are in focus
  for (let i = 0; i < N; i++) for (let j = 0; j < N; j++)
    fadeIn(cells[key][i][j], T.rows + i * T.rowStagger + 0.06 * j, 0.25);
  on(t => rowHi[key].forEach((e, i) => {
    const s = T.rows + i * T.rowStagger;
    e.setAttribute('opacity', bump(t, s, s + T.rowStagger - 0.2));
  }));
});

/* ---- RSA: comparison arrow; then the lower triangles become two vectors, compared element by element ---- */
{
  const mid = [figCx, N / 2];
  arrow(gLines, [mid, [N + 0.3, N / 2]], T.rsa, 0.5);
  arrow(gLines, [mid, [N + GAP - 0.3, N / 2]], T.rsa, 0.5);
  const rTop = label(gNodes, figCx, N / 2 + 0.45,
                     [{ i: 'r' }, '(', M('S', 'hid', 'ℓ'), ', ', M('S', 'beh'), ')'], FS.label, 'middle');
  fadeIn(rTop, T.rsa + 0.3);

  const tril = [];                                     // lower-triangle entries (i > j), row by row
  for (let i = 1; i < N; i++) for (let j = 0; j < i; j++) tril.push([i, j]);
  const vy = { A: VEC.yA, B: VEC.yB };
  const flyEnd = T.flyB + NPAIR * T.flyStagger + 0.7;

  // 1. the lower triangles light up in both matrices
  on(t => {
    const a = bump(t, T.tril, flyEnd);
    ['A', 'B'].forEach(key => cellHi[key].forEach((row, i) =>
      row.forEach((e, j) => e.setAttribute('opacity', i > j ? a : 0))));
  });

  // 2. two empty vectors appear below; above each slot, the word pair of that entry
  const gVec = el('g', {}, gNodes);
  ['A', 'B'].forEach(key => {
    for (let k = 0; k < NPAIR; k++)
      rectU(gVec, VEC.x0 + k, vy[key], VEC.x0 + k + 1, vy[key] + 1, { fill: '#f4f4f4', stroke: '#d4d4d4', 'stroke-width': 1.5 });
    label(gVec, VEC.x0 - 0.35, vy[key] + 0.3, [key === 'A' ? M('S', 'hid', 'ℓ') : M('S', 'beh')], FS.label, 'end');
  });
  tril.forEach(([i, j], k) => [j, i].forEach((w, m) =>
    rectU(gVec, VEC.x0 + k + 0.2 + 0.32 * m, VEC.yA + 1.15, VEC.x0 + k + 0.48 + 0.32 * m, VEC.yA + 1.43,
          { fill: COLORS[WORDS[w]], stroke: CARD_INK, 'stroke-width': 1 })));
  fadeIn(gVec, T.tril + 0.2, 0.4);

  // 3. copies of the entries fly down into the vectors and stay there
  const gCopies = el('g', {}, gDots);
  ['A', 'B'].forEach(key => tril.forEach(([i, j], k) => {
    const fx = MATX[key] + j, fy = N - 1 - i, tx = VEC.x0 + k, ty = vy[key];
    const g = el('g', { opacity: 0 }, gCopies);
    rectU(g, fx, fy, fx + 1, fy + 1, { fill: viridis(SIM[key][i][j]) });
    const t0 = (key === 'A' ? T.flyA : T.flyB) + k * T.flyStagger;
    on(t => {
      const p = ramp(t, t0, 0.7);
      g.setAttribute('opacity', t >= t0 ? 1 : 0);
      g.setAttribute('transform', `translate(${(tx - fx) * U * p} ${-(ty - fy) * U * p})`);
    });
  }));
  ['A', 'B'].forEach(key => fadeIn(rectU(gDots, VEC.x0, vy[key], VEC.x0 + NPAIR, vy[key] + 1,
                                         { fill: 'none', stroke: INK, 'stroke-width': PT }), T.tril + 0.2));

  // 4. element-by-element comparison: one connector per pair of entries, left to right
  const gCmp = el('g', {}, gDots);
  tril.forEach((_, k) => {
    const x = VEC.x0 + k + 0.5, s = T.compare + k * T.cmpStagger;
    const line = el('path', { d: `M ${X(x)} ${Y(VEC.yA - 0.06)} V ${Y(VEC.yB + 1.06)}`, stroke: '#555', 'stroke-width': 2.5,
                              'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 2', opacity: 0 }, gLines);
    const boxes = [VEC.yA, VEC.yB].map(y => rectU(gCmp, VEC.x0 + k + 0.08, y + 0.08, VEC.x0 + k + 0.92, y + 0.92,
                                                  { fill: 'none', stroke: '#fff', 'stroke-width': 3.5, opacity: 0 }));
    on(t => {
      line.setAttribute('stroke-dashoffset', 1 - ramp(t, s, 0.3, easeOut));
      line.setAttribute('opacity', t >= s ? 1 : 0);
      boxes.forEach(b => b.setAttribute('opacity', bump(t, s, s + T.cmpStagger)));
    });
  });

  // 5. brace + r(.,.): this is what the RSA arrow above stands for
  const bx = VEC.x0 + NPAIR + 0.25, yt = VEC.yA + 1, yb = VEC.yB, ym = (yt + yb) / 2, bw = 0.3;
  const brace = el('path', { d: `M ${X(bx)} ${Y(yt)} Q ${X(bx + bw)} ${Y(yt)} ${X(bx + bw)} ${Y(yt - 0.35)} V ${Y(ym + 0.25)}`
      + ` Q ${X(bx + bw)} ${Y(ym)} ${X(bx + 2 * bw)} ${Y(ym)} Q ${X(bx + bw)} ${Y(ym)} ${X(bx + bw)} ${Y(ym - 0.25)}`
      + ` V ${Y(yb + 0.35)} Q ${X(bx + bw)} ${Y(yb)} ${X(bx)} ${Y(yb)}`,
      fill: 'none', stroke: INK, 'stroke-width': PT, 'stroke-linejoin': 'round' }, gNodes);
  fadeIn(brace, T.result, 0.4);
  const rBot = label(gNodes, bx + 2 * bw + 0.3, ym - 0.3,
                     [{ i: 'r' }, '(', M('S', 'hid', 'ℓ'), ', ', M('S', 'beh'), ')'], FS.label);
  fadeIn(rBot, T.result + 0.2, 0.4);
}

/* ---- Caption ---- */
if (SHOW_CAPTION) {
  CAPTIONS.forEach(([a, b, parts]) => {
    const txt = el('text', { x: X(figCx), y: CAP_Y, 'font-size': FS.cap, 'text-anchor': 'middle', class: 'cap' }, gCap);
    rich(txt, parts, FS.cap);
    on(t => txt.setAttribute('opacity', ramp(t, a, 0.3) * (1 - ramp(t, b - 0.3, 0.3))));
  });
}

on(t => gFig.setAttribute('opacity', 1 - ramp(t, T.fadeOut, 0.7)));

/* =====================================================================
   8. PLAYBACK
   ===================================================================== */
const render = t => { for (const f of actors) f(t); };
window.renderAt = render;
window.LOOP_SECONDS = T.loop;            // in timeline seconds
window.PLAYBACK = PLAYBACK;            // real-time length = LOOP_SECONDS / PLAYBACK

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (FREEZE !== null || reduceMotion) {
  render(FREEZE !== null ? FREEZE : T.fadeOut - 0.01);
  return;
}
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.5.5 0 0 0 .77.42l8.5-5.5a.5.5 0 0 0 0-.84l-8.5-5.5A.5.5 0 0 0 4 2.5z"/></svg>';
const ctl = document.getElementById('ctl');
const btnPlay = document.getElementById('btn-play');
const btnRestart = document.getElementById('btn-restart');
const wrap = t => ((t % T.loop) + T.loop) % T.loop;

// The clock runs only while a frame that uses it is on screen. Normally that is just this frame.
// With ?sync=<name>, every frame on the page that passes the same name shares one clock (kept on the
// parent window): they play, pause and restart together, and the clock runs while any of them is on
// screen. The page can set `linked = false` on the group (e.g. while the frames are stacked on a
// phone) to let each frame run on its own clock again.
let inView = true, group = null;
const me = {
  get visible() {
    if (!inView || !group) return inView;
    // In a group, a frame also counts as off screen while it is hidden (display: none) or was taken
    // off the page (pages that re-insert an <iframe> leave its first copy behind in the group).
    try { const f = window.frameElement; return !!f && f.isConnected && f.getClientRects().length > 0; }
    catch (e) { return false; }
  },
};
const own = { elapsed: 0, paused: false, last: null, members: [me] };
const SYNC = params.get('sync');
if (SYNC && window.parent !== window) {
  try {
    const reg = window.parent.__loopSync || (window.parent.__loopSync = {});
    group = reg[SYNC] || (reg[SYNC] = { linked: true, elapsed: 0, paused: false, last: null, members: [] });
    group.members.push(me);
  } catch (e) { group = null; }                    // parent page on another origin: play on our own
}
const clock = () => (group && group.linked !== false ? group : own);
const setPaused = p => { clock().paused = p; };
const togglePause = () => setPaused(!clock().paused);
const seek = dt => { clock().elapsed += dt; };
const restart = () => { clock().elapsed = 0; };
const showPaused = p => {
  btnPlay.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
  btnPlay.setAttribute('aria-label', p ? 'Play animation' : 'Pause animation');
  btnPlay.title = p ? 'Play' : 'Pause';
  ctl.classList.toggle('paused', p);
};
let shownT = null, shownPaused = null;
function frame(now) {
  const c = clock();
  // Wall-clock time on the same scale in every frame, so a shared clock advances once per tick
  // however many frames read it; capped so the loop does not jump after a background tab.
  const wall = (performance.timeOrigin || 0) + now;
  const dt = c.last === null ? 0 : Math.min(0.1, Math.max(0, (wall - c.last) / 1000));
  c.last = c.last === null ? wall : Math.max(c.last, wall);
  if (!c.paused && c.members.some(m => m.visible)) c.elapsed += dt * SPEED;
  const t = wrap(c.elapsed);
  if (t !== shownT) { render(t); shownT = t; }
  if (c.paused !== shownPaused) { showPaused(c.paused); shownPaused = c.paused; }
  requestAnimationFrame(frame);
}
// On screen = at least 30 % of the figure in view. Inside an <iframe>, the observer measures
// against the top-level page viewport, so the loop starts when the reader scrolls to it.
if ('IntersectionObserver' in window) {
  inView = false;
  new IntersectionObserver(entries => {
    for (const e of entries) inView = e.isIntersecting && e.intersectionRatio >= 0.3;
  }, { threshold: [0, 0.3] }).observe(document.getElementById('fig'));
}
btnPlay.addEventListener('click', togglePause);
btnRestart.addEventListener('click', restart);
ctl.addEventListener('click', e => e.stopPropagation());          // buttons do not also toggle via the page
document.addEventListener('click', togglePause);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.key === 'Enter')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'ArrowRight') seek(0.25);
  else if (e.key === 'ArrowLeft') seek(-0.25);
  else if (e.key === 'r' || e.key === 'R') restart();
});
ctl.hidden = false;
requestAnimationFrame(frame);
})();
</script>
</body>
