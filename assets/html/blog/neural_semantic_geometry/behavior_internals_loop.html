<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Behavior and Internal States</title>
<!--
  Animated opening figure: behavior as a window onto internal states.
  After the first figure of the talk (presentation.tex, "Behavior as a Measurement Instrument"):
    Human            one trial (cue in, responses out); the inner activations stay blurred, so they
                     can only be inferred from the behavior (dashed arrow, "?")
    Language model   the same trial; the hidden layers light up and can be read out, so behavior and
                     internal state can be compared directly (solid two-way arrow, check mark)

  Open this file in a browser. Controls:
    space / click   pause / resume
    left / right    step back / forward 0.25 s (handy while paused)
    r               restart from the beginning
    buttons (top right)  pause / resume, restart
  When embedded in a page, the loop starts once it scrolls into view and pauses while off screen.
  (Generated by publish_to_blog.py from the file in context/visualizations; edit that one.)

  URL options (append to the file URL, e.g. behavior_internals_loop.html?t=12):
    ?t=12             freeze at second 12 (no animation)
    ?speed=0.5        play at half speed
    ?caption=0        hide the caption line
    ?bg=transparent   transparent instead of white background
    ?sync=name        share one clock with the other frames on the page that use the same name
-->
<style>
  :root { --bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg  { width: 100vw; height: 100vh; display: block; }
  .serif { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; }
  .sans  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .cap   { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; fill: #333; white-space: pre; }
  #ctl { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px;
         opacity: .55; transition: opacity .2s; }
  #ctl[hidden] { display: none; }
  #ctl:hover, #ctl:focus-within, #ctl.paused { opacity: 1; }
  #ctl button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
                border: 1px solid #C5CAD1; border-radius: 50%; background: rgba(255,255,255,.92);
                color: #333; cursor: pointer; }
  #ctl button:hover { background: #F3F4F6; }
  #ctl button:focus-visible { outline: 2px solid #3B4CC0; outline-offset: 2px; }
  #ctl svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  #fig { cursor: pointer; }
</style>
</head>
<body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Animated figure in two panels. Human: a person sees the word dog and answers cat, fur and pet; their inner activations stay blurred and can only be inferred from the answers. Language model: the same trial; its hidden layers light up layer by layer and can be read out, so its behavior and its hidden states can be compared directly."></svg>
<div id="ctl" hidden>
  <button id="btn-restart" type="button" aria-label="Restart animation" title="Restart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5V.5L4.75 3.5 8 6.5V4a4 4 0 1 1-4 4H2.5A5.5 5.5 0 1 0 8 2.5z"/></svg></button>
  <button id="btn-play" type="button" aria-label="Pause animation" title="Pause"></button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. DATA
   ===================================================================== */
const CUE = 'dog';
const RESPONSES = ['cat', 'fur', 'pet'];
const WORD_COLORS = { dog: '#E69F00', cat: '#CC79A7', fur: '#F0E442', pet: '#999999' };

const C = {
  ink: '#1d1d1f', text: '#3a3a3c', muted: '#6b6b6b',
  card: '#FBFBFC', cardStroke: '#E3E5E8',
  latent: '#8A8F98', latentTint: '#F1F2F4',          // human inner state: grey, dashed
  hidden: '#0072B2', hiddenTint: '#EAF3FA',          // model hidden states: blue
  behav: '#D55E00', behavTint: '#FCF0E8',            // behavior: vermillion
  good: '#2E9E6A',
};

/* =====================================================================
   2. TIMELINE  (seconds)
   ===================================================================== */
const H0 = 0.6;                        // human trial starts
const L0 = 5.6;                        // model trial starts
const T = {
  frame: 0.0,
  // per trial, relative to H0 / L0
  cue: 0.0, cueArrow: 0.4, agent: 0.8, think: 1.0, resp: 1.6, respGap: 0.4, link: 3.0, badge: 3.5,
  layerGap: 0.35,
  finale: 10.8,
  fadeOut: 15.2,
  loop: 16.2,
};

const CAPTIONS = [
  [0.0,      L0,        'Humans: we see the behavior; the inner states can only be inferred'],
  [L0,       T.finale,  'Language models: behavior and hidden states are both observable'],
  [T.finale, T.fadeOut, 'So we can test how much behavior reveals about internal states'],
];

/* =====================================================================
   3. SETTINGS FROM THE URL
   ===================================================================== */
const params       = new URLSearchParams(location.search);
const FREEZE       = params.has('t') ? parseFloat(params.get('t')) : null;
const PLAYBACK     = 0.8;          // overall playback rate: 1 = timeline seconds, < 1 = slower
const SPEED        = PLAYBACK * parseFloat(params.get('speed') || '1');
const SHOW_CAPTION = params.get('caption') !== '0';
if (params.get('bg') === 'transparent') document.documentElement.style.setProperty('--bg', 'transparent');

/* =====================================================================
   4. GEOMETRY  (SVG units)
   ===================================================================== */
const W = 1040;
const CAP_Y = 634;
const VB = { x: 0, y: 0, w: W, h: SHOW_CAPTION ? 662 : 606 };
const PANEL_W = 496, PANELS = [16, 528];               // left edges of the two cards
const CARD = { top: 12, bottom: 596 };
const A = { top: 84, bottom: 318, inset: 28 };         // tier A: inner states
const B = { top: 392, bottom: 584, inset: 28 };        // tier B: behavior
const CHIP = { w: 72, h: 34 };
const ROW_Y = 508;                                     // trial strip: cue -> agent -> responses
const RESP_Y = [464, 508, 552];
const at = Lx => ({ cue: Lx + 96, agent: Lx + 230, resp: Lx + 384, link: Lx + 384,
                    a0: Lx + A.inset, a1: Lx + PANEL_W - A.inset });

/* =====================================================================
   5. ANIMATION HELPERS
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const ramp = (t, t0, dur, ease = easeInOut) => ease(clamp((t - t0) / dur));
const bump = (t, t0, dur) => { const p = clamp((t - t0) / dur); return Math.sin(Math.PI * p); };   // 0 -> 1 -> 0

const actors = [];
const on = fn => actors.push(fn);
const fadeIn = (node, t0, dur = 0.4) => on(t => node.setAttribute('opacity', ramp(t, t0, dur)));

function mulberry32(a) {                 // small seeded random, so the networks look the same every time
  return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a);
                 t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
}
const mix = (a, b, p) => {
  const A_ = parseInt(a.slice(1), 16), B_ = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((A_ >> s) & 255) * (1 - p) + ((B_ >> s) & 255) * p);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};

/* =====================================================================
   6. SVG HELPERS
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('fig');
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);
function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function text(parent, x, y, str, attrs = {}) {
  const e = el('text', { x, y, ...attrs }, parent);
  e.textContent = str;
  return e;
}
const defs = el('defs');
{
  const blur = el('filter', { id: 'fog', x: '-20%', y: '-20%', width: '140%', height: '140%' }, defs);
  el('feGaussianBlur', { stdDeviation: 2.6 }, blur);
  const soft = el('filter', { id: 'soft', x: '-50%', y: '-50%', width: '200%', height: '200%' }, defs);
  el('feGaussianBlur', { stdDeviation: 14 }, soft);
  const sh = el('filter', { id: 'lift', x: '-20%', y: '-20%', width: '140%', height: '160%' }, defs);
  el('feDropShadow', { dx: 0, dy: 3, stdDeviation: 4, 'flood-color': '#000', 'flood-opacity': 0.10 }, sh);
}

/* Pops a group in around (cx, cy) with a small overshoot. */
function popIn(g, cx, cy, t0, dur = 0.35, tOut = null) {
  on(t => {
    const p = clamp((t - t0) / dur);
    const s = p <= 0 ? 0.6 : 0.6 + 0.4 * easeOutBack(p);
    g.setAttribute('opacity', easeOut(p));
    g.setAttribute('transform', `translate(${cx} ${cy}) scale(${s}) translate(${-cx} ${-cy})`);
  });
}
/* A straight arrow that grows from (x1, y1) to (x2, y2); optional dashes and a second head. */
function growArrow(parent, x1, y1, x2, y2, { color = C.ink, width = 2.5, dash = null, both = false,
                                              t0 = 0, dur = 0.45, head = 11 } = {}) {
  const g = el('g', {}, parent);
  const line = el('line', { x1, y1, x2: x1, y2: y1, stroke: color, 'stroke-width': width,
                            'stroke-linecap': dash ? 'butt' : 'round', ...(dash ? { 'stroke-dasharray': dash } : {}) }, g);
  const ang = Math.atan2(y2 - y1, x2 - x1);
  const headPath = `M 0 0 L ${-head} ${-head * 0.55} Q ${-head * 0.78} 0 ${-head} ${head * 0.55} Z`;
  const hEnd = el('path', { d: headPath, fill: color }, g);
  const hStart = both ? el('path', { d: headPath, fill: color }, g) : null;
  const deg = ang * 180 / Math.PI;
  on(t => {
    const p = ramp(t, t0, dur, easeOut);
    const ex = lerp(x1, x2, p), ey = lerp(y1, y2, p);
    const back = head * 0.7;                                   // keep the shaft under the head
    line.setAttribute('x2', ex - Math.cos(ang) * back * p);
    line.setAttribute('y2', ey - Math.sin(ang) * back * p);
    hEnd.setAttribute('transform', `translate(${ex} ${ey}) rotate(${deg})`);
    g.setAttribute('opacity', p > 0 ? 1 : 0);
    if (hStart) {
      line.setAttribute('x1', x1 + Math.cos(ang) * back * p);
      line.setAttribute('y1', y1 + Math.sin(ang) * back * p);
      hStart.setAttribute('transform', `translate(${x1} ${y1}) rotate(${deg + 180})`);
      hStart.setAttribute('opacity', clamp((p - 0.6) / 0.3));
    }
  });
  return g;
}
/* Word tile like in the other figures: tinted rounded box, serif word. */
function chip(parent, cx, cy, word) {
  const g = el('g', {}, parent);
  el('rect', { x: cx - CHIP.w / 2, y: cy - CHIP.h / 2, width: CHIP.w, height: CHIP.h, rx: 7,
               fill: mix('#ffffff', WORD_COLORS[word] || '#cccccc', 0.62), stroke: C.ink, 'stroke-width': 1.8 }, g);
  text(g, cx, cy + 7.5, word, { 'font-size': 22, 'text-anchor': 'middle', class: 'serif', fill: C.ink });
  return g;
}
/* Small status pill, right-aligned at x. */
function pill(parent, xRight, y, label, color, tint) {
  const g = el('g', {}, parent);
  const r = el('rect', { y: y - 17, height: 25, rx: 12.5, fill: tint, stroke: color, 'stroke-width': 1.4 }, g);
  const tx = text(g, 0, y + 1, label, { 'font-size': 15, 'font-weight': 600, 'text-anchor': 'middle',
                                        class: 'sans', fill: color, 'letter-spacing': '0.02em' });
  const w = tx.getComputedTextLength() + 26;
  r.setAttribute('x', xRight - w); r.setAttribute('width', w);
  tx.setAttribute('x', xRight - w / 2);
  return g;
}

/* =====================================================================
   7. BUILD
   ===================================================================== */
const gFig = el('g');

function panel(i) {
  const Lx = PANELS[i], P = at(Lx), human = i === 0;
  const O = human ? H0 : L0;                         // this panel's trial start
  const g = el('g', {}, gFig);
  const cx = Lx + PANEL_W / 2;

  // card, title
  el('rect', { x: Lx, y: CARD.top, width: PANEL_W, height: CARD.bottom - CARD.top, rx: 22,
               fill: C.card, stroke: C.cardStroke, 'stroke-width': 1.5 }, g);
  text(g, cx, 58, human ? 'Human' : 'Language model',
       { 'font-size': 29, 'font-weight': 700, 'text-anchor': 'middle', class: 'sans', fill: C.ink });

  // tier A: inner states
  const aCol = human ? C.latent : C.hidden, aTint = human ? C.latentTint : C.hiddenTint;
  el('rect', { x: P.a0, y: A.top, width: P.a1 - P.a0, height: A.bottom - A.top, rx: 16, fill: aTint,
               stroke: aCol, 'stroke-width': 1.8, ...(human ? { 'stroke-dasharray': '7 6' } : {}) }, g);
  text(g, P.a0 + 20, A.top + 32, human ? 'Inner activations' : 'Hidden-state activations',
       { 'font-size': 20, 'font-weight': 700, class: 'sans', fill: human ? '#5b616b' : C.hidden });
  pill(g, P.a1 - 18, A.top + 30, human ? 'latent' : 'extractable', aCol, '#ffffff');

  // tier B: behavior
  el('rect', { x: Lx + B.inset, y: B.top, width: PANEL_W - 2 * B.inset, height: B.bottom - B.top, rx: 16,
               fill: C.behavTint, stroke: C.behav, 'stroke-opacity': 0.55, 'stroke-width': 1.8 }, g);
  text(g, Lx + B.inset + 20, B.top + 32, 'Behavior',
       { 'font-size': 20, 'font-weight': 700, class: 'sans', fill: C.behav });
  pill(g, Lx + PANEL_W - B.inset - 18, B.top + 30, 'observable', C.behav, '#ffffff');

  // ---- inner network ----
  const net = el('g', {}, g);
  const nodes = [], edges = [];
  const rnd = mulberry32(human ? 7 : 11);
  if (human) {
    // an irregular network, seen through fog
    for (let k = 0; k < 17; k++)
      nodes.push({ x: lerp(P.a0 + 46, P.a1 - 46, rnd()), y: lerp(A.top + 62, A.bottom - 24, rnd()), r: 8 + 4 * rnd() });
    nodes.forEach((n, k) => {
      const near = nodes.map((m, j) => [Math.hypot(m.x - n.x, m.y - n.y), j]).filter(([, j]) => j !== k)
                        .sort((a, b) => a[0] - b[0]).slice(0, 2);
      near.forEach(([, j]) => { if (!edges.some(e => (e[0] === j && e[1] === k))) edges.push([k, j]); });
    });
  } else {
    // four layers, bottom (input) to top
    const rows = [A.bottom - 26, A.bottom - 70, A.bottom - 114, A.bottom - 158], per = 8;
    rows.forEach((y, l) => { for (let k = 0; k < per; k++)
      nodes.push({ x: lerp(P.a0 + 52, P.a1 - 52, k / (per - 1)), y, r: 10, layer: l, act: 0.25 + 0.75 * rnd() }); });
    nodes.forEach((n, a) => nodes.forEach((m, b) => {
      if (m.layer === n.layer + 1 && Math.abs((a % 8) - (b % 8)) <= 1) edges.push([a, b]);
    }));
  }
  const gEdges = el('g', {}, net), gNodes = el('g', {}, net);
  const edgeEls = edges.map(([a, b]) => el('line', { x1: nodes[a].x, y1: nodes[a].y, x2: nodes[b].x, y2: nodes[b].y,
                                                      stroke: human ? '#A9AEB6' : '#9DBBD0', 'stroke-width': 1.6 }, gEdges));
  const nodeEls = nodes.map(n => el('circle', { cx: n.x, cy: n.y, r: n.r, fill: '#ffffff',
                                                stroke: human ? C.latent : C.hidden, 'stroke-width': 2 }, gNodes));
  if (human) {
    net.setAttribute('filter', 'url(#fog)');
    net.setAttribute('opacity', 0.9);
    // drifting fog banks over the network
    const fog = el('g', { filter: 'url(#soft)' }, g);
    const banks = [0, 1, 2].map(k => el('ellipse', { rx: 110, ry: 40, fill: '#ffffff', opacity: 0.45 }, fog));
    on(t => banks.forEach((b, k) => {
      const ph = t / T.loop * 2 * Math.PI + k * 2.1;
      b.setAttribute('cx', (P.a0 + P.a1) / 2 + Math.sin(ph) * 120 + (k - 1) * 70);
      b.setAttribute('cy', A.top + 120 + k * 52 + Math.cos(ph * 1.3) * 10);
    }));
    // while the person thinks, nodes glow at random
    const glows = nodes.map(() => [O + T.think + 1.6 * rnd(), O + T.think + 0.6 + 1.6 * rnd()]);
    on(t => nodeEls.forEach((e, k) => {
      const a = Math.max(...glows[k].map(t0 => bump(t, t0, 0.7)));
      e.setAttribute('fill', mix('#ffffff', '#5b616b', 0.85 * a));
      e.setAttribute('r', nodes[k].r * (1 + 0.35 * a));
    }));
  } else {
    // the layers light up one after the other, from the input upwards, and stay lit
    on(t => {
      nodeEls.forEach((e, k) => {
        const n = nodes[k];
        const p = ramp(t, O + T.think + T.layerGap * n.layer, 0.3, easeOut);
        e.setAttribute('fill', mix('#ffffff', C.hidden, n.act * p));
        e.setAttribute('r', n.r * (1 + 0.25 * bump(t, O + T.think + T.layerGap * n.layer, 0.45)));
      });
      edgeEls.forEach((e, k) => {
        const l = nodes[edges[k][0]].layer;
        const p = ramp(t, O + T.think + T.layerGap * (l + 0.6), 0.3);
        e.setAttribute('stroke', mix('#C8D9E6', C.hidden, 0.75 * p));
      });
    });
  }

  // ---- the trial: cue -> agent -> responses ----
  const cueG = chip(g, P.cue, ROW_Y, CUE);
  popIn(cueG, P.cue, ROW_Y, O + T.cue);
  growArrow(g, P.cue + CHIP.w / 2 + 8, ROW_Y, P.agent - 46, ROW_Y, { t0: O + T.cueArrow, dur: 0.35 });

  const agent = el('g', {}, g);
  if (human) {                                         // a person: head and shoulders
    const ax = P.agent, ay = ROW_Y;
    el('circle', { cx: ax, cy: ay - 20, r: 19, fill: '#4A4F57' }, agent);
    el('path', { d: `M ${ax - 37} ${ay + 38} Q ${ax - 37} ${ay + 4} ${ax} ${ay + 4} Q ${ax + 37} ${ay + 4} ${ax + 37} ${ay + 38} Z`,
                 fill: '#4A4F57' }, agent);
  } else {                                             // a model: a chip with pins
    const ax = P.agent, ay = ROW_Y, s = 33;
    for (let k = -1; k <= 1; k++) {
      for (const [dx, dy, w, h] of [[-s - 9, k * 16 - 2, 9, 4], [s, k * 16 - 2, 9, 4], [k * 16 - 2, -s - 9, 4, 9], [k * 16 - 2, s, 4, 9]])
        el('rect', { x: ax + dx, y: ay + dy, width: w, height: h, rx: 1.5, fill: C.hidden }, agent);
    }
    el('rect', { x: ax - s, y: ay - s, width: 2 * s, height: 2 * s, rx: 10, fill: '#ffffff', stroke: C.hidden, 'stroke-width': 2.4 }, agent);
    text(agent, ax, ay + 7, 'LLM', { 'font-size': 20, 'font-weight': 700, 'text-anchor': 'middle', class: 'sans', fill: C.hidden });
  }
  on(t => {
    const s = 1 + 0.08 * bump(t, O + T.agent, 0.5);
    agent.setAttribute('transform', `translate(${P.agent} ${ROW_Y}) scale(${s}) translate(${-P.agent} ${-ROW_Y})`);
  });

  RESPONSES.forEach((w, k) => {
    const t0 = O + T.resp + T.respGap * k;
    growArrow(g, P.agent + 46, ROW_Y + (RESP_Y[k] - ROW_Y) * 0.25, P.resp - CHIP.w / 2 - 8, RESP_Y[k],
              { t0, dur: 0.3, width: 2, head: 9 });
    const c = chip(g, P.resp, RESP_Y[k], w);
    popIn(c, P.resp, RESP_Y[k], t0 + 0.2);
  });

  // ---- the link between behavior and inner states ----
  const y0 = B.top - 6, y1 = A.bottom + 8;
  if (human) {
    growArrow(g, P.link, y0, P.link, y1, { color: C.latent, width: 2.6, dash: '7 6', t0: O + T.link, dur: 0.6, head: 13 });
  } else {
    growArrow(g, P.link, y0, P.link, y1, { color: C.hidden, width: 3, both: true, t0: O + T.link, dur: 0.6, head: 13 });
  }
  const lab = text(g, P.link - 18, (y0 + y1) / 2 + 7, human ? 'inferred' : 'compared',
                   { 'font-size': 20, 'font-style': 'italic', 'text-anchor': 'end', class: 'sans',
                     fill: human ? C.latent : C.hidden });
  fadeIn(lab, O + T.link + 0.3);

  // badge on the corner of tier A: "?" for the human, a check mark for the model
  const bx = P.a1, by = A.top, badge = el('g', {}, g);
  el('circle', { cx: bx, cy: by, r: 19, fill: '#ffffff', stroke: human ? C.latent : C.good, 'stroke-width': 2.4 }, badge);
  if (human) text(badge, bx, by + 8, '?', { 'font-size': 24, 'font-weight': 700, 'text-anchor': 'middle', class: 'sans', fill: C.latent });
  else el('path', { d: `M ${bx - 8} ${by + 1} L ${bx - 2} ${by + 7} L ${bx + 9} ${by - 6}`, fill: 'none', stroke: C.good,
                    'stroke-width': 3.4, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, badge);
  popIn(badge, bx, by, O + T.badge, 0.4);

  // finale: the link pulses once more
  const halo = el('rect', { x: P.link - 16, y: y1 - 6, width: 32, height: y0 - y1 + 12, rx: 16,
                            fill: human ? C.latent : C.hidden, opacity: 0 }, g);
  g.insertBefore(halo, g.children[1]);
  on(t => halo.setAttribute('opacity', 0.16 * bump(t, T.finale + 0.2 + (human ? 0 : 0.5), 1.0)));
}
panel(0);
panel(1);

/* ---- Caption ---- */
if (SHOW_CAPTION) {
  CAPTIONS.forEach(([a, b, str]) => {
    const tx = text(gFig, W / 2, CAP_Y + 10, str, { 'font-size': 26, 'text-anchor': 'middle', class: 'cap' });
    on(t => tx.setAttribute('opacity', ramp(t, a, 0.35) * (1 - ramp(t, b - 0.3, 0.3))));
  });
}

on(t => gFig.setAttribute('opacity', 1 - ramp(t, T.fadeOut, 0.7)));

/* =====================================================================
   8. PLAYBACK
   ===================================================================== */
const render = t => { for (const f of actors) f(t); };
window.renderAt = render;
window.LOOP_SECONDS = T.loop;            // in timeline seconds
window.PLAYBACK = PLAYBACK;            // real-time length = LOOP_SECONDS / PLAYBACK

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
