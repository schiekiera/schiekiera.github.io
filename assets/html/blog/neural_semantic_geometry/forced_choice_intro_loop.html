<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forced Choice Intro</title>
<!--
  Alternative Forced Choice (FC) loop that starts from ONE example trial:
    1. a chat-style prompt bubble that types itself line by line; the key word of each line
       is highlighted while the matching part of the trial appears
    2. one input word, four candidates, the model's two picks
    3. the example zooms out and becomes the first column of the full figure;
       the other input words appear next to it, then B^FC and S^FC as in forced_choice_loop.html
  Source: talks_and_posters/2026-05-behavioral_clones/plots/01_behavior/forced_choice/forced_choice_steps.tex

  Open this file in a browser. Controls:
    space / click   pause / resume
    left / right    step back / forward 0.25 s (handy while paused)
    r               restart from the beginning
    buttons (top right)  pause / resume, restart
  When embedded in a page, the loop starts once it scrolls into view and pauses while off screen.
  (Generated by publish_to_blog.py from the file in context/visualizations; edit that one.)

  URL options (append to the file URL, e.g. forced_choice_intro_loop.html?t=8):
    ?t=8              freeze at second 8 (no animation)
    ?speed=0.5        play at half speed
    ?caption=0        hide the caption line
    ?bg=transparent   transparent instead of white background
    ?sync=name        share one clock with the other frames on the page that use the same name
-->
<style>
  :root { --bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg  { width: 100vw; height: 100vh; display: block; }
  .serif { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; }
  .mono  { font-family: "Courier New", Courier, monospace; font-weight: bold; }
  .sans  { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .cap   { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; fill: #333; white-space: pre; }
  #ctl { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px;
         opacity: .55; transition: opacity .2s; }
  #ctl[hidden] { display: none; }
  #ctl:hover, #ctl:focus-within, #ctl.paused { opacity: 1; }
  #ctl button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
                border: 1px solid #C5CAD1; border-radius: 50%; background: rgba(255,255,255,.92);
                color: #333; cursor: pointer; }
  #ctl button:hover { background: #F3F4F6; }
  #ctl button:focus-visible { outline: 2px solid #3B4CC0; outline-offset: 2px; }
  #ctl svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  #fig { cursor: pointer; }
</style>
</head>
<body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Animated forced choice paradigm: one example trial (prompt, input word cat, four candidates, two picks) zooms out into the full figure with input words cat, dog and rat, the input-output matrix B FC and the cosine similarity matrix S FC."></svg>
<div id="ctl" hidden>
  <button id="btn-restart" type="button" aria-label="Restart animation" title="Restart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5V.5L4.75 3.5 8 6.5V4a4 4 0 1 1-4 4H2.5A5.5 5.5 0 1 0 8 2.5z"/></svg></button>
  <button id="btn-play" type="button" aria-label="Pause animation" title="Pause"></button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. DATA  (change these to change the example)
   ===================================================================== */
const PROMPT_LINES = [                          // intro prompt, typed line by line; `key` gets highlighted
  { text: 'You will be given one input word', key: 'input' },      // -> the input word appears
  { text: 'and 4 candidate words.',           key: 'candidate' },  // -> the four candidates appear
  { text: 'Output the 2 most related.',       key: 'Output' },     // -> the model's two picks
];
const INPUTS  = ['cat', 'dog', 'rat'];          // input words i (the first one is the intro example)
const SUBS    = ['1', '2', 'n'];                // subscripts shown on i, c, o
const CANDS   = ['fur', 'wuf', 'lab', 'mew'];   // candidate grid: top-left, top-right, bottom-left, bottom-right
const PICKS   = [['fur', 'mew'],                // two words the model picks for cat
                 ['fur', 'wuf'],                //                            dog
                 ['fur', 'lab']];               //                            rat
const BCOLS   = ['fur', 'wuf', 'lab', 'mew'];   // column order of B^FC

const COLORS = {
  cat: '#CC79A7', dog: '#E69F00', rat: '#56B4E9',
  mew: '#009E73', fur: '#F0E442', wuf: '#0072B2', lab: '#D55E00',
};

/* =====================================================================
   2. TIMELINE  (seconds)
      Kept in step with free_association_intro_loop.html (same loop length, same morph / B / S moments):
      the blog shows the two loops side by side on one shared clock.
   ===================================================================== */
const T = {
  prompt:   0.0,                    // empty prompt bubble (blinking caret)
  line1:    0.3, exInput: 1.7,      // type line 1; highlight "input" + the input word appears
  line2:    3.0, exCands: 4.0,      // type line 2; highlight "candidate" + the four candidates appear
  line3:    5.4, exPicks: 6.5,      // type line 3; highlight "Output" + the model's two picks
  morph:    8.8, morphDur: 1.4,     // the single trial zooms out into column 1
  expand:   10.2,                   // prompt arrows + the other input words and candidates
  picks:    11.7, pickStagger: 0.4, // picks for the other input words
  bFrame:   13.6,                   // B^FC frame + headers
  bRows:    14.6, bRowStagger: 0.9, // picks fly into B^FC, row by row
  sFrame:   17.6,                   // S^FC frame + headers
  sPairs:   18.4, sPairStagger: 0.7,
  fadeOut:  24.9,
  loop:     25.9,
};
const TYPE_SPEED = 0.035;           // seconds per typed character
const LINE_START = [T.line1, T.line2, T.line3];

const CAPTIONS = [
  [T.prompt,  T.line2,   ['A forced-choice trial: one input word ', {it: 'i'}]],
  [T.line2,   T.line3,   ['Four candidate words ', {it: 'c'}, ' (sixteen in the study)']],
  [T.line3,   T.morph,   ['The model picks two output words ', {it: 'o'}]],
  [T.morph,   T.bFrame,  ['The same trial runs for every input word']],
  [T.bFrame,  T.sFrame,  ['Picks fill the input–output matrix ', {bold: 'B', sup: 'FC'}]],
  [T.sFrame,  T.fadeOut, ['Cosine between rows of ', {bold: 'B', sup: 'FC'}, ' gives ', {bold: 'S', sup: 'FC'}]],
];

/* =====================================================================
   3. SETTINGS FROM THE URL
   ===================================================================== */
const params       = new URLSearchParams(location.search);
const FREEZE       = params.has('t') ? parseFloat(params.get('t')) : null;
const PLAYBACK     = 0.8;          // overall playback rate: 1 = timeline seconds, < 1 = slower
const SPEED        = PLAYBACK * parseFloat(params.get('speed') || '1');
const SHOW_CAPTION = params.get('caption') !== '0';
if (params.get('bg') === 'transparent') document.documentElement.style.setProperty('--bg', 'transparent');

/* =====================================================================
   4. GEOMETRY  (TikZ centimetres, y pointing up -> SVG units, y down)
   ===================================================================== */
const U  = 100, PT = 3.5146;
const X  = x => +(x * U).toFixed(2);
const Y  = y => +(-y * U).toFixed(2);

const S = 0.50, G = 0.10, PAD = 0.12;
const CW = 2 * S + G;
const XSEP = 2.3, XOFF = 0.3, YIN = 1.84, YPROMPT = 3.2;
const PY = -(S + 2 * PAD + 0.5);
const MS = 0.50, MG = 0.15, PADM = 0.12;
const YMAT = -2.8, XSTART = -1.0;
const YSMAT = YMAT - 3 * (MS + MG) - 1.60;
const XSTARTS = 0.55 - (4 * MS + 3 * MG) / 2;
const XMID = 0.55;

const candX  = k => (k - 1) * XSEP;
const inputX = k => (k - 1) * XSEP + XOFF;
const candPos = (k, w) => {
  const i = CANDS.indexOf(w);
  return { x: candX(k) + (i % 2) * (S + G), y: (1 - Math.floor(i / 2)) * (S + G) };
};

/* Single-trial intro layout: a chat-style prompt bubble above an enlarged copy of column 1, centred. */
const EX_SCALE = 1.75;                       // how much bigger the single example is drawn
const BUBBLE = { top: 2.9, font: 34, lineH: 0.5, padX: 0.34, padY: 0.26, r: 0.24, tailW: 0.42, tailH: 0.22,
                 fill: '#F3F4F6', stroke: '#C5CAD1', text: '#222222' };   // sizes in cm, font in SVG units
const bubbleH = n => 2 * BUBBLE.padY + n * BUBBLE.lineH;              // bubble height with n lines
const EX_GAP = 0.7;                          // bubble tail -> input word (cm)
const COL_CX = inputX(0) + S / 2;            // centre x of column 1 in the final figure
const COL_TOP = YIN + S + PAD;               // top of the input box of column 1
const EX_INPUT_TOP = BUBBLE.top - bubbleH(PROMPT_LINES.length) - BUBBLE.tailH - EX_GAP;

const INK = '#111111';
const HILITE = '#3B4CC0';
const LW_BOX = 0.9 * PT, LW_CELL = 0.6 * PT, RX = 1 * PT;
const FS_WORD = 18, FS_LABEL = 28, FS_VALUE = 32, FS_PROMPT = 24.6, FS_CAP = 25;

const sBottomY = YSMAT - 3 * (MS + MG) - PADM;
const CAP_Y = Y(sBottomY) + 72;
const VB = { x: X(XMID) - 320, y: -385, w: 640 };
VB.h = (SHOW_CAPTION ? CAP_Y + 30 : Y(sBottomY) + 25) - VB.y;

const B = PICKS.map(pk => BCOLS.map(w => (pk.includes(w) ? 1 : 0)));
const cosine = (a, b) => {
  const dot = a.reduce((s, v, i) => s + v * b[i], 0);
  const na = Math.hypot(...a), nb = Math.hypot(...b);
  return na && nb ? dot / (na * nb) : 0;
};
const SIM = B.map(a => B.map(b => cosine(a, b)));
const fmt = v => (Math.abs(v - 1) < 1e-9 ? '1' : Math.abs(v) < 1e-9 ? '0'
                 : v.toFixed(2).replace(/0+$/, '').replace(/^0/, ''));
const grey = (v, lo) => {
  const p = Math.max(0, Math.min(1, (v - lo) / (1 - lo)));
  const g = Math.round(255 * (1 - 0.2 * p));
  return `rgb(${g},${g},${g})`;
};

/* =====================================================================
   5. ANIMATION HELPERS
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeOutBack = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const ramp = (t, t0, dur, ease = easeInOut) => ease(clamp((t - t0) / dur));

const actors = [];
const on = fn => actors.push(fn);
const fadeIn = (node, t0, dur = 0.4) => on(t => node.setAttribute('opacity', ramp(t, t0, dur)));

/* =====================================================================
   6. SVG HELPERS
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('fig');
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function rectCm(parent, x0, y0, x1, y1, attrs = {}) {
  return el('rect', { x: X(x0), y: Y(y1), width: X(x1 - x0), height: X(y1 - y0), ...attrs }, parent);
}
const boxStyle = { fill: 'none', stroke: INK, 'stroke-width': LW_BOX, rx: RX };

function square(parent, x, y, size, word, alpha, { solid = false } = {}) {
  const g = el('g', {}, parent);
  if (solid) rectCm(g, x, y, x + size, y + size, { fill: '#fff' });
  const fill = rectCm(g, x, y, x + size, y + size, { fill: COLORS[word] || '#e6e6e6', 'fill-opacity': alpha });
  rectCm(g, x, y, x + size, y + size, { fill: 'none', stroke: INK, 'stroke-width': LW_CELL });
  const txt = el('text', { x: X(x + size / 2), y: Y(y + size / 2) + 0.27 * FS_WORD,
                           'font-size': FS_WORD, 'text-anchor': 'middle', class: 'serif', fill: INK }, g);
  txt.textContent = word;
  return { g, fill };
}
/* Math label like i_1; returns the subscript <tspan> so it can be faded in separately. */
function mathLabel(parent, x, y, base, sub) {
  const t = el('text', { x: X(x), y: Y(y), 'font-size': FS_LABEL, class: 'serif', fill: INK }, parent);
  el('tspan', { 'font-style': 'italic' }, t).textContent = base;
  const s = el('tspan', { 'font-size': FS_LABEL * 0.72, dy: FS_LABEL * 0.22,
                          'font-style': /\d/.test(sub) ? 'normal' : 'italic' }, t);
  s.textContent = sub;
  return s;
}
function matrixLabel(parent, x, y, letter, sup, fs = FS_VALUE) {
  const t = el('text', { x: X(x), y: Y(y), 'font-size': fs, class: 'serif', fill: INK }, parent);
  el('tspan', { 'font-weight': 'bold' }, t).textContent = letter;
  el('tspan', { 'font-size': fs * 0.68, dy: -fs * 0.38 }, t).textContent = sup;
}
/* Arrow with a TikZ-"Latex"-like head that draws itself; optional op(t) = group opacity. */
function arrow(parent, pts, lw, t0, dur = 0.45, op = null) {
  const lwU = lw * PT;
  const L = (3 + 4.5 * lw) * PT, W = 0.75 * L;
  const P = pts.map(([x, y]) => [X(x), Y(y)]);
  const [ax, ay] = P[P.length - 2], [bx, by] = P[P.length - 1];
  const ang = Math.atan2(by - ay, bx - ax);
  const end = [bx - Math.cos(ang) * L * 0.85, by - Math.sin(ang) * L * 0.85];
  const d = 'M ' + P.slice(0, -1).map(p => p.join(' ')).join(' L ') + ' L ' + end.join(' ');
  const g = el('g', {}, parent);
  const shaft = el('path', { d, fill: 'none', stroke: INK, 'stroke-width': lwU,
                             'stroke-linejoin': 'miter', pathLength: 1, 'stroke-dasharray': '1 2' }, g);
  const head = el('path', { d: `M 0 0 L ${-L} ${-W / 2} Q ${-0.82 * L} 0 ${-L} ${W / 2} Z`, fill: INK,
                            transform: `translate(${bx} ${by}) rotate(${ang * 180 / Math.PI})` }, g);
  on(t => {
    const p = ramp(t, t0, dur, easeOut);
    shaft.setAttribute('stroke-dashoffset', 1 - p);
    shaft.setAttribute('opacity', p > 0 ? 1 : 0);
    head.setAttribute('opacity', clamp((p - 0.85) / 0.15));
    if (op) g.setAttribute('opacity', op(t));
  });
}
function fly(group, fx, fy, tx, ty, t0, dur) {
  on(t => {
    const p = ramp(t, t0, dur);
    group.setAttribute('transform', `translate(${(tx - fx) * U * p} ${-(ty - fy) * U * p})`);
  });
}
function popIn(group, cx, cy, t0, dur = 0.3) {
  on(t => {
    const p = clamp((t - t0) / dur);
    const s = p <= 0 ? 0.6 : 0.6 + 0.4 * easeOutBack(p);
    group.setAttribute('opacity', easeOut(p));
    group.setAttribute('transform',
      `translate(${X(cx)} ${Y(cy)}) scale(${s}) translate(${-X(cx)} ${-Y(cy)})`);
  });
}

/* =====================================================================
   7. BUILD THE FIGURE
   ===================================================================== */
const gFig   = el('g');
const gLines = el('g', {}, gFig);
const gNodes = el('g', {}, gFig);
const gCol   = el('g', {}, gFig);              // column 1: the single example, zoomed during the intro
const gHi    = el('g', {}, gFig);
const gFly   = el('g', {}, gFig);
const gCap   = el('g', {}, gFig);
const COL1   = { lines: el('g', {}, gCol), nodes: el('g', {}, gCol), fly: el('g', {}, gCol) };
const REST   = { lines: gLines, nodes: gNodes, fly: gFly };

// column 1 zooms from the enlarged, centred example into its place in the figure
on(t => {
  const p = ramp(t, T.morph, T.morphDur);
  const s = lerp(EX_SCALE, 1, p);
  const tx = lerp(X(XMID) - EX_SCALE * X(COL_CX), 0, p);
  const ty = lerp(Y(EX_INPUT_TOP) - EX_SCALE * Y(COL_TOP), 0, p);
  gCol.setAttribute('transform', `translate(${tx} ${ty}) scale(${s})`);
});
// column-1 subscripts (i_1, c_1, o_1) appear once the example has become column 1
const subAppear = sub => on(t => sub.setAttribute('fill-opacity', ramp(t, T.morph + T.morphDur - 0.3, 0.4)));

const MARKS = [[T.exInput, [INPUTS[0]]], [T.exCands, CANDS], [T.exPicks, PICKS[0]]];   // [sweep time, colours]
/* ---- The intro prompt: a chat-style bubble that types itself line by line.
        Each line's key word gets a highlighter sweep while the matching part of the trial appears.
        When the trial zooms out, the bubble turns into the plain PROMPT box of the full figure. ---- */
const mixColor = (a, b, p) => {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((A >> s) & 255) * (1 - p) + ((B >> s) & 255) * p);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};
function bubblePath(b, r, tw, th) {          // rounded box with a speech-bubble tail at the bottom centre
  const R = r * U, cx = (b.x0 + b.x1) / 2;
  return `M ${X(b.x0 + r)} ${Y(b.y1)} H ${X(b.x1 - r)} A ${R} ${R} 0 0 1 ${X(b.x1)} ${Y(b.y1 - r)}`
       + ` V ${Y(b.y0 + r)} A ${R} ${R} 0 0 1 ${X(b.x1 - r)} ${Y(b.y0)}`
       + ` H ${X(cx + tw / 2)} L ${X(cx)} ${Y(b.y0 - th)} L ${X(cx - tw / 2)} ${Y(b.y0)}`
       + ` H ${X(b.x0 + r)} A ${R} ${R} 0 0 1 ${X(b.x0)} ${Y(b.y0 + r)}`
       + ` V ${Y(b.y1 - r)} A ${R} ${R} 0 0 1 ${X(b.x0 + r)} ${Y(b.y1)} Z`;
}
{
  const defs = el('defs', {}, svg);
  const filt = el('filter', { id: 'bubbleShadow', x: '-20%', y: '-30%', width: '140%', height: '170%' }, defs);
  const shadow = el('feDropShadow', { dx: 0, dy: 4, stdDeviation: 6, 'flood-color': '#000', 'flood-opacity': 0.13 }, filt);

  const g = el('g', {}, gNodes);
  const bubble = el('path', { filter: 'url(#bubbleShadow)', 'stroke-linejoin': 'round' }, g);
  const gMarks = el('g', {}, g), gText = el('g', {}, g);
  const head = el('text', { x: X(XMID), y: Y(YPROMPT) + 0.34 * FS_PROMPT, 'font-size': FS_PROMPT,
                            'text-anchor': 'middle', class: 'mono', fill: INK, opacity: 0 }, g);
  head.textContent = 'PROMPT';

  // the prompt lines, measured once with their full text (cm)
  const lines = PROMPT_LINES.map(L => {
    const e = el('text', { 'font-size': BUBBLE.font, class: 'sans', fill: BUBBLE.text }, gText);
    e.textContent = L.text;
    return e;
  });
  const prefix = lines.map(e => Array.from({ length: e.textContent.length + 1 },
                                           (_, n) => (n ? e.getSubStringLength(0, n) : 0) / U));
  const textW = Math.max(...prefix.map(p => p[p.length - 1]));
  const bx0 = XMID - textW / 2 - BUBBLE.padX, bx1 = XMID + textW / 2 + BUBBLE.padX;
  const textX = bx0 + BUBBLE.padX;
  const baseline = i => BUBBLE.top - BUBBLE.padY - BUBBLE.lineH * i - 0.36;
  lines.forEach((e, i) => { e.setAttribute('x', X(textX)); e.setAttribute('y', Y(baseline(i))); });

  // highlighter marks behind the key words (several colours -> gradient)
  const marks = PROMPT_LINES.map((L, i) => {
    const idx = L.text.indexOf(L.key);
    const mx = textX + prefix[i][idx] - 0.04;
    const mw = prefix[i][idx + L.key.length] - prefix[i][idx] + 0.08;
    const cols = MARKS[i][1].map(w => COLORS[w]);
    let fill = cols[0];
    if (cols.length > 1) {
      const grad = el('linearGradient', { id: `mark${i}`, gradientUnits: 'userSpaceOnUse',
                                          x1: X(mx), x2: X(mx + mw), y1: 0, y2: 0 }, defs);
      cols.forEach((c, j) => el('stop', { offset: j / (cols.length - 1), 'stop-color': c }, grad));
      fill = `url(#mark${i})`;
    }
    const r = rectCm(gMarks, mx, baseline(i) - 0.09, mx, baseline(i) + 0.29, { fill, 'fill-opacity': 0.5, rx: 5 });
    return { r, mw, t0: MARKS[i][0] };
  });

  const caret = el('rect', { width: 3, height: 0.36 * U, fill: BUBBLE.text }, g);
  const FIN = { x0: XMID - 1.9, x1: XMID + 1.9, y0: YPROMPT - 0.31, y1: YPROMPT + 0.31 };
  const shown = lines.map(() => -1);

  // intro arrow: bubble tail -> input word (its start follows the growing bubble)
  const aG = el('g', {}, gLines);
  const aL = (3 + 4.5 * 1.2) * PT, aW = 0.75 * aL;
  const aShaft = el('path', { fill: 'none', stroke: INK, 'stroke-width': 1.2 * PT }, aG);
  const aHead = el('path', { d: `M 0 0 L ${-aL} ${-aW / 2} Q ${-0.82 * aL} 0 ${-aL} ${aW / 2} Z`, fill: INK,
                             transform: `translate(${X(XMID)} ${Y(EX_INPUT_TOP)}) rotate(90)` }, aG);

  on(t => {
    const p = ramp(t, T.morph, T.morphDur);
    // the bubble grows by one line just before each line is typed ...
    const n = Math.max(1, LINE_START.reduce((a, s) => a + ramp(t, s - 0.25, 0.25), 0));
    const exY0 = BUBBLE.top - bubbleH(n);
    // ... and turns into the PROMPT box when the trial zooms out
    const b = { x0: lerp(bx0, FIN.x0, p), x1: lerp(bx1, FIN.x1, p),
                y0: lerp(exY0, FIN.y0, p), y1: lerp(BUBBLE.top, FIN.y1, p) };
    const tail = 1 - ramp(t, T.morph, 0.5);
    bubble.setAttribute('d', bubblePath(b, lerp(BUBBLE.r, RX / U, p), BUBBLE.tailW * tail, BUBBLE.tailH * tail));
    bubble.setAttribute('fill', mixColor(BUBBLE.fill, '#ffffff', p));
    bubble.setAttribute('stroke', mixColor(BUBBLE.stroke, INK, p));
    bubble.setAttribute('stroke-width', lerp(1.6, LW_BOX, p));
    shadow.setAttribute('flood-opacity', 0.13 * (1 - p));
    g.setAttribute('opacity', ramp(t, T.prompt, 0.35));
    head.setAttribute('opacity', ramp(t, T.morph + T.morphDur - 0.45, 0.45));

    // typing + blinking caret
    const textOp = 1 - ramp(t, T.morph, 0.3);
    gText.setAttribute('opacity', textOp);
    gMarks.setAttribute('opacity', textOp);
    let cl = 0, cn = 0;
    lines.forEach((e, i) => {
      const len = PROMPT_LINES[i].text.length;
      const k = clamp(Math.floor((t - LINE_START[i]) / TYPE_SPEED), 0, len);
      if (k !== shown[i]) { e.textContent = PROMPT_LINES[i].text.slice(0, k); shown[i] = k; }
      if (t >= LINE_START[i]) { cl = i; cn = k; }
    });
    const typing = t >= LINE_START[cl] && cn < PROMPT_LINES[cl].text.length;
    const blinkOn = typing || Math.floor(t * 2.4) % 2 === 0;
    caret.setAttribute('x', X(textX + prefix[cl][cn]) + 2);
    caret.setAttribute('y', Y(baseline(cl) + 0.28));
    caret.setAttribute('opacity', t < T.morph && blinkOn ? 1 : 0);

    // highlighter sweeps
    marks.forEach(m => m.r.setAttribute('width', X(m.mw * ramp(t, m.t0, 0.45, easeOut))));

    // intro arrow
    const yStart = exY0 - BUBBLE.tailH, yEnd = EX_INPUT_TOP + 0.85 * aL / U;
    const pa = ramp(t, T.exInput, 0.35, easeOut);
    aShaft.setAttribute('d', `M ${X(XMID)} ${Y(yStart)} V ${Y(lerp(yStart, yEnd, pa))}`);
    aHead.setAttribute('opacity', clamp((pa - 0.85) / 0.15));
    aG.setAttribute('opacity', (pa > 0 ? 1 : 0) * (1 - ramp(t, T.morph, 0.25)));
  });
}

/* ---- Builders for one trial column ---- */
function buildInput(k, L, tShow, pop) {
  const x = inputX(k), top = YIN + S + PAD;
  const g = el('g', {}, L.nodes);
  rectCm(g, x - PAD, YIN - PAD, x + S + PAD, top, boxStyle);
  square(g, x, YIN, S, INPUTS[k], 0.7);
  const sub = mathLabel(g, x - PAD - 0.13 + 0.035, top + 0.17, 'i', SUBS[k]);
  if (pop) popIn(g, x + S / 2, YIN + S / 2, tShow, 0.4); else fadeIn(g, tShow);
  return [sub];
}
const candSquares = [];
function buildCands(k, L, tArrow, tBox, tWords) {
  const x = candX(k);
  const g = el('g', {}, L.nodes);
  rectCm(g, x - PAD, -PAD, x + CW + PAD, CW + PAD, boxStyle);
  const sub = mathLabel(g, x - PAD + 0.035, CW + PAD + 0.17, 'c', SUBS[k]);
  candSquares[k] = {};
  CANDS.forEach((w, j) => {
    const p = candPos(k, w);
    const sq = square(g, p.x, p.y, S, w, 0.2);
    candSquares[k][w] = sq;
    if (tWords !== null) popIn(sq.g, p.x + S / 2, p.y + S / 2, tWords + 0.15 * j);
  });
  fadeIn(g, tBox);
  arrow(L.lines, [[x + CW / 2, YIN - PAD], [x + CW / 2, CW + PAD]], 0.9, tArrow, 0.35);
  return [sub];
}
function buildPicks(k, L, t0) {
  const x = candX(k);
  const g = el('g', {}, L.nodes);
  rectCm(g, x - PAD, PY - PAD, x + CW + PAD, PY + S + PAD, boxStyle);
  const sub = mathLabel(g, x - PAD + 0.035, PY + S + PAD + 0.17, 'o', SUBS[k]);
  fadeIn(g, t0 + 0.25, 0.35);
  arrow(L.lines, [[x + CW / 2, -PAD], [x + CW / 2, PY + S + PAD]], 0.9, t0 + 0.2, 0.35);
  PICKS[k].forEach((w, j) => {
    const sq = candSquares[k][w];
    on(t => sq.fill.setAttribute('fill-opacity',
      0.2 + 0.5 * ramp(t, t0, 0.3) - 0.3 * ramp(t, t0 + 0.45, 0.4)));
    const from = candPos(k, w), to = { x: x + j * (S + G), y: PY };
    const copy = square(L.fly, from.x, from.y, S, w, 0.7, { solid: true });
    const tl = t0 + 0.3 + 0.08 * j;
    on(t => copy.g.setAttribute('opacity', t >= tl ? 1 : 0));
    fly(copy.g, from.x, from.y, to.x, to.y, tl, 0.7);
  });
  return [sub];
}

/* ---- Column 1 = the single example trial ---- */
[
  ...buildInput(0, COL1, T.exInput + 0.15, true),
  ...buildCands(0, COL1, T.exCands, T.exCands + 0.2, T.exCands + 0.4),
  ...buildPicks(0, COL1, T.exPicks),
].forEach(subAppear);

/* ---- The other columns + the final prompt arrows ---- */
INPUTS.forEach((_, k) => {
  const cx = inputX(k) + S / 2, top = YIN + S + PAD;
  const pts = k === 1 ? [[cx, YPROMPT - 0.31], [cx, top]]
            : [[k === 0 ? XMID - 1.9 : XMID + 1.9, YPROMPT], [cx, YPROMPT], [cx, top]];
  arrow(gLines, pts, 0.6, T.expand);
  if (k === 0) return;
  buildInput(k, REST, T.expand + 0.3 + 0.1 * k, false);
  buildCands(k, REST, T.expand + 0.7 + 0.05 * k, T.expand + 0.9 + 0.1 * k, null);
  buildPicks(k, REST, T.picks + (k - 1) * T.pickStagger);
});

/* ---- B^FC ---- */
const bCell = (r, c) => ({ x: XSTART + (c + 1) * (MS + MG), y: YMAT - (r + 1) * (MS + MG) });
const bRight = XSTART + 4 * (MS + MG) + MS + PADM, bTop = YMAT + MS + PADM;
const bBottom = YMAT - 3 * (MS + MG) - PADM;
{
  const g = el('g', {}, gNodes);
  rectCm(g, XSTART - PADM, bBottom, bRight, bTop, boxStyle);
  matrixLabel(g, XSTART - 0.07 + 0.035, YMAT + MS + PADM - 0.5 + 0.035, 'B', 'FC');
  BCOLS.forEach((w, c) => square(g, XSTART + (c + 1) * (MS + MG), YMAT, MS, w, 0.7));
  INPUTS.forEach((w, r) => square(g, XSTART, YMAT - (r + 1) * (MS + MG), MS, w, 0.7));
  fadeIn(g, T.bFrame + 0.35, 0.45);

  const bTargets = [[XSTART - PADM, bTop], [XMID, bTop], [bRight, bTop]];
  INPUTS.forEach((_, k) =>
    arrow(gLines, [[candX(k) + CW / 2, PY - PADM], bTargets[k]], 0.8, T.bFrame + 0.05 * k, 0.5));

  B.forEach((row, r) => row.forEach((v, c) => {
    const { x, y } = bCell(r, c);
    const fill = rectCm(g, x, y, x + MS, y + MS, { fill: grey(v, 0), opacity: 0 });
    rectCm(g, x, y, x + MS, y + MS, { fill: 'none', stroke: INK, 'stroke-width': LW_CELL });
    const txt = el('text', { x: X(x + MS / 2), y: Y(y + MS / 2) + 0.35 * FS_VALUE, 'font-size': FS_VALUE,
                             'text-anchor': 'middle', class: 'serif', fill: INK, opacity: 0 }, g);
    txt.textContent = String(v);
    const t0 = T.bRows + r * T.bRowStagger;
    const tShow = v ? t0 + 0.1 * PICKS[r].indexOf(BCOLS[c]) + 0.65 : t0 + 0.85;
    fadeIn(fill, tShow, 0.3);
    fadeIn(txt, tShow, 0.3);
  }));
}
PICKS.forEach((pk, r) => {
  const t0 = T.bRows + r * T.bRowStagger;
  pk.forEach((w, j) => {
    const from = { x: candX(r) + j * (S + G), y: PY };
    const to = bCell(r, BCOLS.indexOf(w));
    const copy = square(gFly, from.x, from.y, S, w, 0.7, { solid: true });
    const tl = t0 + 0.1 * j, dur = 0.75;
    on(t => copy.g.setAttribute('opacity', t < tl ? 0 : 1 - ramp(t, tl + dur - 0.1, 0.3)));
    fly(copy.g, from.x, from.y, to.x, to.y, tl, dur);
  });
});

/* ---- S^FC ---- */
const sCell = (r, c) => ({ x: XSTARTS + (c + 1) * (MS + MG), y: YSMAT - (r + 1) * (MS + MG) });
const sTop = YSMAT + MS + PADM;
const pairs = [];
INPUTS.forEach((_, i) => INPUTS.forEach((__, j) => { if (j >= i) pairs.push([i, j]); }));
const pairStart = m => T.sPairs + m * T.sPairStagger;
{
  const g = el('g', {}, gNodes);
  rectCm(g, XSTARTS - PADM, sBottomY, XSTARTS + 3 * (MS + MG) + MS + PADM, sTop, boxStyle);
  matrixLabel(g, XSTARTS - 0.07 + 0.035, YSMAT + MS + PADM - 0.5 + 0.035, 'S', 'FC');
  INPUTS.forEach((w, c) => square(g, XSTARTS + (c + 1) * (MS + MG), YSMAT, MS, w, 0.7));
  INPUTS.forEach((w, r) => square(g, XSTARTS, YSMAT - (r + 1) * (MS + MG), MS, w, 0.7));
  fadeIn(g, T.sFrame + 0.3, 0.45);
  const xCenterB = XSTART + (4 * (MS + MG) + MS) / 2;
  arrow(gLines, [[xCenterB, bBottom], [XMID, sTop]], 0.8, T.sFrame, 0.4);

  SIM.forEach((row, r) => row.forEach((v, c) => {
    const { x, y } = sCell(r, c);
    const fill = rectCm(g, x, y, x + MS, y + MS, { fill: grey(v, 0.45), opacity: 0 });
    rectCm(g, x, y, x + MS, y + MS, { fill: 'none', stroke: INK, 'stroke-width': LW_CELL });
    const txt = el('text', { x: X(x + MS / 2), y: Y(y + MS / 2) + 0.35 * FS_VALUE, 'font-size': FS_VALUE,
                             'text-anchor': 'middle', class: 'serif', fill: INK, opacity: 0 }, g);
    txt.textContent = fmt(v);
    const m = pairs.findIndex(([i, j]) => i === Math.min(r, c) && j === Math.max(r, c));
    fadeIn(fill, pairStart(m) + 0.2, 0.25);
    fadeIn(txt, pairStart(m) + 0.2, 0.25);
  }));
}
{
  const o = 0.05, w = 3.5;
  const rowHi = INPUTS.map((_, r) => {
    const y = YMAT - (r + 1) * (MS + MG);
    return rectCm(gHi, XSTART - o, y - o, XSTART + 4 * (MS + MG) + MS + o, y + MS + o,
                  { fill: 'none', stroke: HILITE, 'stroke-width': w, rx: 5, opacity: 0 });
  });
  const cellHi = INPUTS.map((_, r) => INPUTS.map((__, c) => {
    const { x, y } = sCell(r, c);
    return rectCm(gHi, x - o, y - o, x + MS + o, y + MS + o,
                  { fill: 'none', stroke: HILITE, 'stroke-width': w, rx: 5, opacity: 0 });
  }));
  const win = (t, t0) => ramp(t, t0, 0.15) * (1 - ramp(t, t0 + 0.55, 0.15));
  on(t => {
    const rowA = INPUTS.map(() => 0);
    const cellA = INPUTS.map(() => INPUTS.map(() => 0));
    pairs.forEach(([i, j], m) => {
      const a = win(t, pairStart(m));
      rowA[i] = Math.max(rowA[i], a); rowA[j] = Math.max(rowA[j], a);
      cellA[i][j] = Math.max(cellA[i][j], a); cellA[j][i] = Math.max(cellA[j][i], a);
    });
    rowHi.forEach((e, r) => e.setAttribute('opacity', rowA[r]));
    cellHi.forEach((row, r) => row.forEach((e, c) => e.setAttribute('opacity', cellA[r][c])));
  });
}

/* ---- Caption ---- */
if (SHOW_CAPTION) {
  CAPTIONS.forEach(([a, b, parts]) => {
    const txt = el('text', { x: X(XMID), y: CAP_Y, 'font-size': FS_CAP, 'text-anchor': 'middle', class: 'cap' }, gCap);
    let back = 0;
    const add = (s, attrs = {}) => {
      if (back) { attrs.dy = (attrs.dy || 0) + back; back = 0; }
      el('tspan', attrs, txt).textContent = s;
    };
    for (const p of parts) {
      if (typeof p === 'string') add(p);
      else if (p.it) add(p.it, { 'font-style': 'italic' });
      else if (p.bold) {
        add(p.bold, { 'font-weight': 'bold' });
        add(p.sup, { 'font-size': FS_CAP * 0.7, dy: -FS_CAP * 0.38 });
        back = FS_CAP * 0.38;
      }
    }
    on(t => txt.setAttribute('opacity', ramp(t, a, 0.3) * (1 - ramp(t, b - 0.3, 0.3))));
  });
}

on(t => gFig.setAttribute('opacity', 1 - ramp(t, T.fadeOut, 0.7)));

/* =====================================================================
   8. PLAYBACK
   ===================================================================== */
const render = t => { for (const f of actors) f(t); };
window.renderAt = render;
window.LOOP_SECONDS = T.loop;            // in timeline seconds
window.PLAYBACK = PLAYBACK;            // real-time length = LOOP_SECONDS / PLAYBACK

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (FREEZE !== null || reduceMotion) {
  render(FREEZE !== null ? FREEZE : T.fadeOut - 0.01);
  return;
}
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.5.5 0 0 0 .77.42l8.5-5.5a.5.5 0 0 0 0-.84l-8.5-5.5A.5.5 0 0 0 4 2.5z"/></svg>';
const ctl = document.getElementById('ctl');
const btnPlay = document.getElementById('btn-play');
const btnRestart = document.getElementById('btn-restart');
const wrap = t => ((t % T.loop) + T.loop) % T.loop;

// The clock runs only while a frame that uses it is on screen. Normally that is just this frame.
// With ?sync=<name>, every frame on the page that passes the same name shares one clock (kept on the
// parent window): they play, pause and restart together, and the clock runs while any of them is on
// screen. The page can set `linked = false` on the group (e.g. while the frames are stacked on a
// phone) to let each frame run on its own clock again.
let inView = true, group = null;
const me = {
  get visible() {
    if (!inView || !group) return inView;
    // In a group, a frame also counts as off screen while it is hidden (display: none) or was taken
    // off the page (pages that re-insert an <iframe> leave its first copy behind in the group).
    try { const f = window.frameElement; return !!f && f.isConnected && f.getClientRects().length > 0; }
    catch (e) { return false; }
  },
};
const own = { elapsed: 0, paused: false, last: null, members: [me] };
const SYNC = params.get('sync');
if (SYNC && window.parent !== window) {
  try {
    const reg = window.parent.__loopSync || (window.parent.__loopSync = {});
    group = reg[SYNC] || (reg[SYNC] = { linked: true, elapsed: 0, paused: false, last: null, members: [] });
    group.members.push(me);
  } catch (e) { group = null; }                    // parent page on another origin: play on our own
}
const clock = () => (group && group.linked !== false ? group : own);
const setPaused = p => { clock().paused = p; };
const togglePause = () => setPaused(!clock().paused);
const seek = dt => { clock().elapsed += dt; };
const restart = () => { clock().elapsed = 0; };
const showPaused = p => {
  btnPlay.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
  btnPlay.setAttribute('aria-label', p ? 'Play animation' : 'Pause animation');
  btnPlay.title = p ? 'Play' : 'Pause';
  ctl.classList.toggle('paused', p);
};
let shownT = null, shownPaused = null;
function frame(now) {
  const c = clock();
  // Wall-clock time on the same scale in every frame, so a shared clock advances once per tick
  // however many frames read it; capped so the loop does not jump after a background tab.
  const wall = (performance.timeOrigin || 0) + now;
  const dt = c.last === null ? 0 : Math.min(0.1, Math.max(0, (wall - c.last) / 1000));
  c.last = c.last === null ? wall : Math.max(c.last, wall);
  if (!c.paused && c.members.some(m => m.visible)) c.elapsed += dt * SPEED;
  const t = wrap(c.elapsed);
  if (t !== shownT) { render(t); shownT = t; }
  if (c.paused !== shownPaused) { showPaused(c.paused); shownPaused = c.paused; }
  requestAnimationFrame(frame);
}
// On screen = at least 30 % of the figure in view. Inside an <iframe>, the observer measures
// against the top-level page viewport, so the loop starts when the reader scrolls to it.
if ('IntersectionObserver' in window) {
  inView = false;
  new IntersectionObserver(entries => {
    for (const e of entries) inView = e.isIntersecting && e.intersectionRatio >= 0.3;
  }, { threshold: [0, 0.3] }).observe(document.getElementById('fig'));
}
btnPlay.addEventListener('click', togglePause);
btnRestart.addEventListener('click', restart);
ctl.addEventListener('click', e => e.stopPropagation());          // buttons do not also toggle via the page
document.addEventListener('click', togglePause);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.key === 'Enter')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'ArrowRight') seek(0.25);
  else if (e.key === 'ArrowLeft') seek(-0.25);
  else if (e.key === 'r' || e.key === 'R') restart();
});
ctl.hidden = false;
requestAnimationFrame(frame);
})();
</script>
</body>
