<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hidden State Intro</title>
<!--
  Alternative hidden-state loop that starts with a chat-style intro:
    1. a chat window; "What is the meaning of cat?" is typed into a message bubble
    2. the sentence is tokenized: boxes form around the tokens, spread apart, and the
       message bubble becomes the context box; "cat" becomes the cue card
    3. the token row zooms into its place and the hidden-state figure runs as in hidden_states_loop.html
  Source: talks_and_posters/2026-05-behavioral_clones/plots/02_hidden-states/meaning_pipeline/meaning_pipeline.tex

  Open this file in a browser. Controls:
    space / click   pause / resume
    left / right    step back / forward 0.25 s (handy while paused)
    r               restart from the beginning
    buttons (top right)  pause / resume, restart
  When embedded in a page, the loop starts once it scrolls into view and pauses while off screen.
  (Generated by publish_to_blog.py from the file in context/visualizations; edit that one.)

  URL options (append to the file URL, e.g. hidden_states_intro_loop.html?t=3.5):
    ?t=3.5            freeze at second 3.5 of the timeline (no animation)
    ?speed=0.5        play at half the normal speed
    ?caption=0        hide the caption line
    ?bg=transparent   transparent instead of white background
-->
<style>
  :root { --bg: #ffffff; }
  html, body { margin: 0; height: 100%; background: var(--bg); }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  svg  { width: 100vw; height: 100vh; display: block; }
  .sans  { font-family: "Fira Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; }
  .serif { font-family: "Latin Modern Roman", "CMU Serif", "Times New Roman", Times, serif; }
  .cap   { font-family: "Fira Sans", "Helvetica Neue", Helvetica, Arial, sans-serif; fill: #333; white-space: pre; }
  #ctl { position: fixed; top: 8px; right: 8px; display: flex; gap: 6px;
         opacity: .55; transition: opacity .2s; }
  #ctl[hidden] { display: none; }
  #ctl:hover, #ctl:focus-within, #ctl.paused { opacity: 1; }
  #ctl button { width: 30px; height: 30px; padding: 0; display: grid; place-items: center;
                border: 1px solid #C5CAD1; border-radius: 50%; background: rgba(255,255,255,.92);
                color: #333; cursor: pointer; }
  #ctl button:hover { background: #F3F4F6; }
  #ctl button:focus-visible { outline: 2px solid #3B4CC0; outline-offset: 2px; }
  #ctl svg { width: 14px; height: 14px; display: block; fill: currentColor; }
  #fig { cursor: pointer; }
</style>
</head>
<body>
<svg id="fig" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Animated hidden-state extraction: the question 'What is the meaning of cat?' is typed in a chat window, split into tokens, and fed through the embedding layer and one transformer layer; the hidden states of cat, dog and rat fill matrix H, and their cosine similarities fill S hid."></svg>
<div id="ctl" hidden>
  <button id="btn-restart" type="button" aria-label="Restart animation" title="Restart"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 2.5V.5L4.75 3.5 8 6.5V4a4 4 0 1 1-4 4H2.5A5.5 5.5 0 1 0 8 2.5z"/></svg></button>
  <button id="btn-play" type="button" aria-label="Pause animation" title="Pause"></button>
</div>

<script>
(() => {
'use strict';

/* =====================================================================
   1. DATA  (change these to change the example)
   ===================================================================== */
const CUES = ['cat', 'dog', 'rat'];                 // cue words w (rows of H and S); the first is in the chat
const PROMPT_TEXT = 'What is the meaning of cat';   // typed into the chat bubble
const TOKENS = [                                    // how the prompt is tokenized; `cue` marks w
  { text: 'What', tint: 5 }, { text: 'is', tint: 10 }, { text: 'the', tint: 30 },
  { text: 'mean', tint: 50 }, { text: 'ing', tint: 70 }, { text: 'of', tint: 90 },
  { text: 'cat', cue: true },                                   // tint = % of yellow in the token box
];
const ATTENTION = [0.06, 0.04, 0.07, 0.30, 0.33, 0.20];   // attention of the cue to each context token (illustrative)
const H = [[0.9, 0.1, 0.8, 0.2],                    // layer-l hidden state of cat (4 dims shown)
           [0.2, 0.9, 0.3, 0.7],                    //                         dog
           [0.6, 0.5, 0.4, 0.9]];                   //                         rat

const COLORS = { cat: '#CC79A7', dog: '#E69F00', rat: '#56B4E9' };   // Okabe-Ito
const C = {
  ink: '#525860',     // mainInk: token borders + flow arrows
  yellow: '#FFC107',  // warningYellow: context tokens
  emb: '#F1BABA', attn: '#FBDCBC', mlp: '#BED8EF', hid: '#CCC4E4',   // transformer boxes (45 % tints)
  dim: '#17A2B8',     // accentTeal: H column headers
};
const CHAT = {        // chat-window look of the intro
  window: '#FFFFFF', windowStroke: '#DADDE2', dots: '#D3D6DB',
  bubble: '#F3F4F6', bubbleStroke: '#C5CAD1',
};

/* =====================================================================
   2. TIMELINE  (timeline seconds; the page plays them at PLAYBACK speed, see section 8)
   ===================================================================== */
const T = {
  prompt:   0.0,                    // chat window with an empty message bubble
  type:     0.4,                    // the question is typed ...
  mark:     1.9,                    // ... and the cue word is highlighted
  tokenize: 2.9, tokDur: 0.9,       // split into tokens; the bubble becomes the context box
  zoom:     4.2, zoomDur: 1.4,      // the token row moves into its place in the figure
  deck:     5.6,                    // dog and rat line up behind cat; context label
  emb:      6.4,                    // embedding layer
  layer:    7.3,                    // self-attention, MLP, residual add, hidden state
  hFrame:   9.7,                    // H^l frame + headers
  run:      10.6, runDur: 2.6,      // one pass through the pipeline per cue word
  sFrame:   18.6,                   // S^hid frame + headers
  sPairs:   19.5, sPairStagger: 0.6,
  fadeOut:  25.1,
  loop:     26.1,
};
T.ctxBoxOff = T.run + 0.25;          // the context box border fades out just before the first attention arcs
const TYPE_SPEED = 0.045;           // timeline seconds per typed character

const CAPTIONS = [
  [T.prompt,   T.tokenize, ['The meaning prompt asks about one cue word ', {it: 'w'}]],
  [T.tokenize, T.emb,      ['The prompt is split into tokens']],
  [T.emb,      T.layer,    ['The tokens enter the embedding layer']],
  [T.layer,    T.run,      ['In every layer ', {it: 'ℓ'}, ', self-attention and an MLP update the residual stream']],
  [T.run,      T.sFrame,   ['Each cue word’s hidden state at layer ', {it: 'ℓ'}, ' fills one row of ', {bold: 'H', sup: 'ℓ'}]],
  [T.sFrame,   T.fadeOut,  ['Cosine between rows of ', {bold: 'H', sup: 'ℓ'}, ' gives ', {bold: 'S', sup: 'hid'}]],
];

/* =====================================================================
   3. SETTINGS FROM THE URL
   ===================================================================== */
const params       = new URLSearchParams(location.search);
const FREEZE       = params.has('t') ? parseFloat(params.get('t')) : null;
const PLAYBACK     = 0.8;          // overall playback rate: 1 = timeline seconds, < 1 = slower
const SPEED        = PLAYBACK * parseFloat(params.get('speed') || '1');
const SHOW_CAPTION = params.get('caption') !== '0';
if (params.get('bg') === 'transparent') document.documentElement.style.setProperty('--bg', 'transparent');

/* =====================================================================
   4. GEOMETRY  (TikZ centimetres, y up -> SVG units, y down)
   ===================================================================== */
const U  = 100, PT = 3.5146;
const X  = x => +(x * U).toFixed(2);
const Y  = y => +(-y * U).toFixed(2);

const TOK = 1.0;                                       // token boxes (cm)
const CUE_I = TOKENS.findIndex(k => k.cue);            // the cue is the last token, at x = 0
const tokX = TOKENS.map((_, i) => (i < CUE_I ? -1.8 - 1.1 * (CUE_I - 1 - i) : 0));
const CTX = { x0: tokX[0] - TOK / 2 - 0.3, x1: tokX[CUE_I - 1] + TOK / 2 + 0.3, y0: -0.75, y1: 0.75 };   // context box
const ROW_CX = (CTX.x0 + TOK / 2) / 2;                 // centre of the whole prompt row (context + cue)
const cardPos = idx => ({ x: 0.75 * idx, y: 0.5 * idx });   // 0 = in the prompt, 1-2 = waiting behind

const EMB  = { x0: -2.6, x1: 2.6, y0: -2.3, y1: -1.3 };
const ATTN = { x0: -8.6, x1: -4.4, y0: -3.225, y1: -2.375 };
const MLP  = { x0: -8.6, x1: -4.4, y0: -4.575, y1: -3.725 };
const ADD  = { x: 0, y: -5.275, r: 0.3 };
const HID  = { x0: -2.6, x1: 2.6, y0: -7.9, y1: -6.9 };
const VDOTS_Y = -9.0;
const BX = -6.5;

const MS = 0.50, MG = 0.15, PADM = 0.12;
const NDIM = H[0].length;
const HY = (HID.y0 + HID.y1) / 2;
const HM = { x: 4.1, y: HY + 0.725 };
const SM = { x: 8.6, y: HY + 0.725 };
const hRight = HM.x + NDIM * (MS + MG) + MS + PADM;
const sLeft = SM.x - PADM, sRight = SM.x + CUES.length * (MS + MG) + MS + PADM;
const matBottom = HM.y - CUES.length * (MS + MG) - PADM;

const LW = 0.9 * PT, LW_BOX = 0.8 * PT, LW_CELL = 0.6 * PT;
const FS_TOK = 30, FS_BOX = 32, FS_CTX = 36, FS_WORD = 18, FS_VALUE = 32, FS_CAP = 40;
const HILITE = '#3B4CC0';

const CAP_Y = Y(VDOTS_Y) + 115;
const VB = { x: -890, y: -215, w: 2040 };
VB.h = (SHOW_CAPTION ? CAP_Y + 45 : Y(VDOTS_Y) + 70) - VB.y;

/* Intro: the chat window is drawn in figure coordinates around the token row,
   then shown enlarged in the middle of the view (EX_SCALE) until the zoom. */
const EX_SCALE = 1.7;
const BUB = { padX: 0.28, h: 0.84, r: 0.24, tailW: 0.22, tailH: 0.2 };   // message bubble (cm)
const VIEW_C = { x: VB.x + VB.w / 2, y: VB.y + VB.h * 0.42 };            // where the intro is centred (SVG units)

/* Derived */
const cosine = (a, b) => {
  const dot = a.reduce((s, v, i) => s + v * b[i], 0);
  return dot / (Math.hypot(...a) * Math.hypot(...b));
};
const SIM = H.map(a => H.map(b => Math.round(cosine(a, b) * 10) / 10));
const fmt = v => (v >= 0.995 ? '1' : v.toFixed(1).replace(/^0/, ''));
const grey = (v, lo) => {
  const p = Math.max(0, Math.min(1, (v - lo) / (1 - lo)));
  const g = Math.round(255 * (1 - 0.2 * p));
  return `rgb(${g},${g},${g})`;
};
const tint = (hex, pct) => {
  const n = parseInt(hex.slice(1), 16), f = pct / 100;
  const ch = s => Math.round(((n >> s) & 255) * f + 255 * (1 - f));
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};
const mixColor = (a, b, p) => {
  const A = parseInt(a.slice(1), 16), B = parseInt(b.slice(1), 16);
  const ch = s => Math.round(((A >> s) & 255) * (1 - p) + ((B >> s) & 255) * p);
  return `rgb(${ch(16)},${ch(8)},${ch(0)})`;
};

/* =====================================================================
   5. ANIMATION HELPERS
   ===================================================================== */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const easeInOut = x => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
const easeOut = x => 1 - Math.pow(1 - x, 3);
const ramp = (t, t0, dur, ease = easeInOut) => ease(clamp((t - t0) / dur));
const bump = (t, a, b) => ramp(t, a - 0.08, 0.08) * (1 - ramp(t, b, 0.3));

const actors = [];
const on = fn => actors.push(fn);
const fadeIn = (node, t0, dur = 0.4) => on(t => node.setAttribute('opacity', ramp(t, t0, dur)));

function along(pts, p) {
  const seg = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]));
  let d = clamp(p) * seg.reduce((a, b) => a + b, 0);
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {
      const f = seg[i] ? Math.min(1, d / seg[i]) : 0;
      return [pts[i][0] + f * (pts[i + 1][0] - pts[i][0]), pts[i][1] + f * (pts[i + 1][1] - pts[i][1])];
    }
    d -= seg[i];
  }
  return pts[pts.length - 1];
}
function fracAt(pts, k) {
  const seg = pts.slice(1).map((q, i) => Math.hypot(q[0] - pts[i][0], q[1] - pts[i][1]));
  const tot = seg.reduce((a, b) => a + b, 0);
  return seg.slice(0, k).reduce((a, b) => a + b, 0) / tot;
}

/* =====================================================================
   6. SVG HELPERS
   ===================================================================== */
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('fig');
svg.setAttribute('viewBox', `${VB.x} ${VB.y} ${VB.w} ${VB.h}`);

function el(tag, attrs = {}, parent = svg) {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  parent.appendChild(e);
  return e;
}
function rectCm(parent, x0, y0, x1, y1, attrs = {}) {
  return el('rect', { x: X(x0), y: Y(y1), width: X(x1 - x0), height: X(y1 - y0), ...attrs }, parent);
}
function text(parent, x, y, str, attrs = {}) {
  const t = el('text', { x: X(x), y: Y(y), 'text-anchor': 'middle', ...attrs }, parent);
  if (str !== null) t.textContent = str;
  return t;
}
function setRect(r, x0, y0, x1, y1) {
  r.setAttribute('x', X(x0)); r.setAttribute('y', Y(y1));
  r.setAttribute('width', X(x1 - x0)); r.setAttribute('height', X(y1 - y0));
}
/* Rounded box with a chat tail at the bottom; the tail is centred at x = tx (cm). */
function bubblePath(b, r, tw, th, tx) {
  const R = r * U;
  return `M ${X(b.x0 + r)} ${Y(b.y1)} H ${X(b.x1 - r)} A ${R} ${R} 0 0 1 ${X(b.x1)} ${Y(b.y1 - r)}`
       + ` V ${Y(b.y0 + r)} A ${R} ${R} 0 0 1 ${X(b.x1 - r)} ${Y(b.y0)}`
       + ` H ${X(tx + tw / 2)} L ${X(tx + tw / 2 + 0.06 * (th > 0 ? 1 : 0))} ${Y(b.y0 - th)} L ${X(tx - tw / 2)} ${Y(b.y0)}`
       + ` H ${X(b.x0 + r)} A ${R} ${R} 0 0 1 ${X(b.x0)} ${Y(b.y0 + r)}`
       + ` V ${Y(b.y1 - r)} A ${R} ${R} 0 0 1 ${X(b.x0 + r)} ${Y(b.y1)} Z`;
}
function modelBox(parent, b, fill, label) {
  const g = el('g', {}, parent);
  rectCm(g, b.x0, b.y0, b.x1, b.y1, { fill, stroke: '#000', 'stroke-width': LW_BOX, rx: 3 * PT });
  const t = text(g, (b.x0 + b.x1) / 2, (b.y0 + b.y1) / 2, null,
                 { 'font-size': FS_BOX, class: 'sans', fill: '#000' });
  t.setAttribute('y', Y((b.y0 + b.y1) / 2) + 0.35 * FS_BOX);
  const [main, ell] = label.split('|');
  el('tspan', {}, t).textContent = main;
  if (ell) el('tspan', { 'font-style': 'italic' }, t).textContent = ell;
  const glow = rectCm(g, b.x0, b.y0, b.x1, b.y1, { fill: 'none', 'stroke-width': 7, rx: 3 * PT, opacity: 0 });
  return { g, glow };
}
function square(parent, x, y, size, word, color, alpha) {
  const g = el('g', {}, parent);
  rectCm(g, x, y, x + size, y + size, { fill: color, 'fill-opacity': alpha });
  rectCm(g, x, y, x + size, y + size, { fill: 'none', stroke: '#000', 'stroke-width': LW_CELL });
  const t = el('text', { x: X(x + size / 2), y: Y(y + size / 2) + 0.27 * FS_WORD, 'font-size': FS_WORD,
                         'text-anchor': 'middle', class: 'serif', fill: '#000' }, g);
  t.textContent = word;
  return { g, t };
}
function matrixLabel(parent, x, y, letter, sup) {
  const t = el('text', { x: X(x), y: Y(y), 'font-size': FS_VALUE, class: 'serif', fill: '#000' }, parent);
  el('tspan', { 'font-weight': 'bold' }, t).textContent = letter;
  el('tspan', { 'font-size': FS_VALUE * 0.68, dy: -FS_VALUE * 0.38, 'font-style': sup === 'ℓ' ? 'italic' : 'normal' }, t)
    .textContent = sup;
}
function arrow(parent, pts, t0, dur = 0.45, lw = 0.9) {
  const L = (3 + 4.5 * lw) * PT, W = 0.75 * L;
  const P = pts.map(([x, y]) => [X(x), Y(y)]);
  const [ax, ay] = P[P.length - 2], [bx, by] = P[P.length - 1];
  const ang = Math.atan2(by - ay, bx - ax);
  const end = [bx - Math.cos(ang) * L * 0.85, by - Math.sin(ang) * L * 0.85];
  const d = 'M ' + P.slice(0, -1).map(p => p.join(' ')).join(' L ') + ' L ' + end.join(' ');
  const shaft = el('path', { d, fill: 'none', stroke: C.ink, 'stroke-width': lw * PT,
                             'stroke-linejoin': 'round', pathLength: 1, 'stroke-dasharray': '1 2' }, parent);
  const head = el('path', { d: `M 0 0 L ${-L} ${-W / 2} Q ${-0.82 * L} 0 ${-L} ${W / 2} Z`, fill: C.ink,
                            transform: `translate(${bx} ${by}) rotate(${ang * 180 / Math.PI})` }, parent);
  on(t => {
    const p = ramp(t, t0, dur, easeOut);
    shaft.setAttribute('stroke-dashoffset', 1 - p);
    shaft.setAttribute('opacity', p > 0 ? 1 : 0);
    head.setAttribute('opacity', clamp((p - 0.85) / 0.15));
  });
}

/* =====================================================================
   7. BUILD THE FIGURE
   ===================================================================== */
const gFig   = el('g');
const gLines = el('g', {}, gFig);
const gNodes = el('g', {}, gFig);
const gRow   = el('g', {}, gFig);                 // the prompt row (zoomed during the intro)
const gRowBg = el('g', {}, gRow), gRowTok = el('g', {}, gRow), gCards = el('g', {}, gRow);
const gAttn  = el('g', {}, gFig);                 // attention arcs (on top of the token row)
const gHi    = el('g', {}, gFig);
const gDots  = el('g', {}, gFig);
const gCap   = el('g', {}, gFig);

// the prompt row is shown enlarged in the middle of the view, then zooms into place
let FOCUS = { x: ROW_CX, y: 0 };                 // set below to the centre of the chat window
on(t => {
  const p = ramp(t, T.zoom, T.zoomDur);
  const s = lerp(EX_SCALE, 1, p);
  const tx = lerp(VIEW_C.x - EX_SCALE * X(FOCUS.x), 0, p);
  const ty = lerp(VIEW_C.y - EX_SCALE * Y(FOCUS.y), 0, p);
  gRow.setAttribute('transform', `translate(${tx} ${ty}) scale(${s})`);
});

/* ---- Intro: chat window -> typed question -> tokens -> context box ---- */
const CARD_SWAP = T.tokenize + T.tokDur;         // the cue token is replaced by the (identical) cue card
{
  const defs = el('defs', {}, svg);
  const filt = el('filter', { id: 'chatShadow', x: '-20%', y: '-30%', width: '140%', height: '170%' }, defs);
  const shadow = el('feDropShadow', { dx: 0, dy: 4, stdDeviation: 7, 'flood-color': '#000', 'flood-opacity': 0.12 }, filt);

  // measure the sentence (cm)
  const meas = el('text', { 'font-size': FS_TOK, class: 'sans', opacity: 0 }, gRowTok);
  meas.textContent = PROMPT_TEXT;
  const prefix = Array.from({ length: PROMPT_TEXT.length + 1 }, (_, n) => (n ? meas.getSubStringLength(0, n) : 0) / U);
  meas.remove();
  const fullW = prefix[PROMPT_TEXT.length];
  let cursor = 0;
  const pieces = TOKENS.map(k => {
    const start = PROMPT_TEXT.indexOf(k.text, cursor), end = start + k.text.length;
    cursor = end;
    return { ...k, start, end, w: prefix[end] - prefix[start] };
  });

  // chat window with the message bubble right-aligned in it
  const bub = { x1: ROW_CX + fullW / 2 + BUB.padX + 0.7 };
  bub.x0 = bub.x1 - fullW - 2 * BUB.padX; bub.y0 = -BUB.h / 2; bub.y1 = BUB.h / 2;
  const sx = bub.x0 + BUB.padX;                                     // sentence start
  const win = { x0: bub.x0 - 1.6, x1: bub.x1 + 0.45, y0: bub.y0 - BUB.tailH - 0.35, y1: bub.y1 + 0.95 };
  FOCUS = { x: (win.x0 + win.x1) / 2, y: (win.y0 + win.y1) / 2 };
  const gWin = el('g', { filter: 'url(#chatShadow)' }, gRowBg);
  rectCm(gWin, win.x0, win.y0, win.x1, win.y1, { fill: CHAT.window, stroke: CHAT.windowStroke, 'stroke-width': 2, rx: 0.28 * U });
  const gWinUI = el('g', {}, gRowBg);
  [0, 1, 2].forEach(i => el('circle', { cx: X(win.x0 + 0.32 + 0.24 * i), cy: Y(win.y1 - 0.26), r: 0.075 * U, fill: CHAT.dots }, gWinUI));
  el('path', { d: `M ${X(win.x0)} ${Y(win.y1 - 0.52)} H ${X(win.x1)}`, stroke: CHAT.windowStroke, 'stroke-width': 2 }, gWinUI);

  // message bubble -> context box
  const box = el('path', { 'stroke-linejoin': 'round' }, gRowBg);
  const marker = rectCm(gRowBg, 0, 0, 0, 0, { fill: COLORS[CUES[0]], 'fill-opacity': 0.5, rx: 5 });
  const cuePiece = pieces[CUE_I];
  const markX = sx + prefix[cuePiece.start] - 0.04, markW = cuePiece.w + 0.08;

  // token boxes (drawn under the words) and the words themselves
  const tokBoxes = pieces.map(k => el('rect', { fill: k.cue ? COLORS[CUES[0]] : tint(C.yellow, k.tint),
                                               stroke: C.ink, 'stroke-width': LW, opacity: 0 }, gRowTok));
  const words = pieces.map(k => el('text', { 'font-size': FS_TOK, class: 'sans', fill: C.ink,
                                            y: Y(0) + 0.33 * FS_TOK }, gRowTok));
  const caret = el('rect', { width: 3, height: 0.34 * U, fill: '#222' }, gRowTok);
  const shown = pieces.map(() => null);

  on(t => {
    const q = ramp(t, T.tokenize, T.tokDur);                     // tokenization progress
    // chat window: fades in, and out when the tokenization starts
    const winOp = ramp(t, T.prompt, 0.4) * (1 - ramp(t, T.tokenize, 0.35));
    gWin.setAttribute('opacity', winOp); gWinUI.setAttribute('opacity', winOp);
    shadow.setAttribute('flood-opacity', 0.12);
    // bubble -> context box
    const b = { x0: lerp(bub.x0, CTX.x0, q), x1: lerp(bub.x1, CTX.x1, q), y0: lerp(bub.y0, CTX.y0, q), y1: lerp(bub.y1, CTX.y1, q) };
    const tail = 1 - ramp(t, T.tokenize, 0.4);
    box.setAttribute('d', bubblePath(b, lerp(BUB.r, 0, q), BUB.tailW * tail, BUB.tailH * tail, b.x1 - BUB.r - BUB.tailW / 2));
    box.setAttribute('fill', mixColor(CHAT.bubble, '#ffffff', q));
    box.setAttribute('stroke', mixColor(CHAT.bubbleStroke, C.ink, q));
    box.setAttribute('stroke-width', lerp(1.8, LW, q));
    box.setAttribute('opacity', ramp(t, T.prompt + 0.15, 0.35) * (1 - ramp(t, T.ctxBoxOff, 0.4)));
    // typing
    const n = clamp(Math.floor((t - T.type) / TYPE_SPEED), 0, PROMPT_TEXT.length);
    pieces.forEach((k, i) => {
      const s = PROMPT_TEXT.slice(k.start, clamp(n, k.start, k.end));
      if (s !== shown[i]) { words[i].textContent = s; shown[i] = s; }
      const cx = lerp(sx + prefix[k.start] + k.w / 2, tokX[i], q);   // word centre: in the sentence -> in its token
      words[i].setAttribute('x', X(cx - k.w / 2));
      const bw = lerp(k.w + 0.14, TOK, q), bh = lerp(0.46, TOK, q);
      setRect(tokBoxes[i], cx - bw / 2, -bh / 2, cx + bw / 2, bh / 2);
      tokBoxes[i].setAttribute('opacity', ramp(t, T.tokenize, 0.25));
      if (k.cue) {                                                     // the cue token becomes the card
        const vis = t < CARD_SWAP ? 1 : 0;
        tokBoxes[i].setAttribute('opacity', ramp(t, T.tokenize, 0.25) * vis);
        words[i].setAttribute('opacity', vis);
      }
    });
    const blinkOn = (n > 0 && n < PROMPT_TEXT.length) || Math.floor(t * 2.4) % 2 === 0;
    caret.setAttribute('x', X(sx + prefix[n]) + 2);
    caret.setAttribute('y', Y(0.17));
    caret.setAttribute('opacity', t < T.tokenize && blinkOn ? 1 : 0);
    // highlighter on the cue word, handed over to the pink cue token
    setRect(marker, markX, -0.13, markX + markW * ramp(t, T.mark, 0.45, easeOut), 0.2);
    marker.setAttribute('opacity', 1 - ramp(t, T.tokenize, 0.3));
  });

  // "Context c_meaning(w)" label, once the row is in place
  const lbl = text(gNodes, (CTX.x0 + CTX.x1) / 2, 1.8, null, { 'font-size': FS_CTX, class: 'sans', fill: '#222' });
  el('tspan', {}, lbl).textContent = 'Context ';
  el('tspan', { 'font-style': 'italic' }, lbl).textContent = 'c';
  el('tspan', { 'font-size': FS_CTX * 0.68, dy: FS_CTX * 0.22, class: 'serif' }, lbl).textContent = 'meaning';
  el('tspan', { dy: -FS_CTX * 0.22 }, lbl).textContent = '(';
  el('tspan', { 'font-style': 'italic' }, lbl).textContent = 'w';
  el('tspan', {}, lbl).textContent = ')';
  fadeIn(lbl, T.deck, 0.4);
}

/* Cue cards: the front card sits in the prompt; after each run it moves to the back. */
const swapStart = k => T.run + k * T.runDur + 2.0;
const cards = CUES.map((w, i0) => {
  const g = el('g', {}, gCards);
  rectCm(g, -TOK / 2, -TOK / 2, TOK / 2, TOK / 2, { fill: COLORS[w], stroke: C.ink, 'stroke-width': LW });
  text(g, 0, 0, w, { 'font-size': FS_TOK, class: 'sans', fill: C.ink }).setAttribute('y', 0.33 * FS_TOK);
  const glow = rectCm(g, -TOK / 2, -TOK / 2, TOK / 2, TOK / 2, { fill: 'none', stroke: '#000', 'stroke-width': 6, opacity: 0 });
  return { g, glow, i0, z: i0 };
});
const SWAP_DUR = 0.6;
on(t => {
  const n = CUES.length;
  const done = CUES.filter((_, k) => t >= swapStart(k) + SWAP_DUR).length;
  const s = done < n && t >= swapStart(done) ? swapStart(done) : null;
  cards.forEach(c => {
    // the first cue card replaces its token; the others slide in behind it from the upper right
    const t0 = c.i0 === 0 ? CARD_SWAP : T.deck + 0.15 * (n - 1 - c.i0);
    const enter = c.i0 === 0 ? 0 : 1 - ramp(t, t0, 0.5);
    let op = c.i0 === 0 ? (t >= t0 ? 1 : 0) : ramp(t, t0, 0.4);
    let idx = (((c.i0 - done) % n) + n) % n, z = idx;
    if (s !== null) {
      if (idx === 0) {
        if (t < s + 0.35) { z = -1; op *= 1 - ramp(t, s, 0.25); }
        else { idx = n - 1; z = n + 1; op *= ramp(t, s + 0.35, 0.25); }
      } else {
        idx -= ramp(t, s, 0.5); z = idx;
      }
    }
    const pos = cardPos(idx);
    c.z = z;
    c.g.setAttribute('transform', `translate(${X(pos.x + 0.6 * enter)} ${Y(pos.y + 0.4 * enter)})`);
    c.g.setAttribute('opacity', op);
  });
  [...cards].sort((a, b) => b.z - a.z).forEach(c => gCards.appendChild(c.g));
});

/* ---- Embedding layer ---- */
const emb = modelBox(gNodes, EMB, C.emb, 'Embedding Layer');
fadeIn(emb.g, T.emb + 0.2, 0.4);
arrow(gLines, [[0, -TOK / 2], [0, EMB.y1]], T.emb, 0.35);

/* ---- One transformer layer ---- */
const attn = modelBox(gNodes, ATTN, C.attn, 'Self-attention |ℓ');
const mlp  = modelBox(gNodes, MLP,  C.mlp,  'MLP |ℓ');
const hid  = modelBox(gNodes, HID,  C.hid,  'Hidden state |ℓ');
const add = el('g', {}, gNodes);
el('circle', { cx: X(ADD.x), cy: Y(ADD.y), r: ADD.r * U, fill: '#fff', stroke: '#000', 'stroke-width': LW }, add);
el('path', { d: `M ${X(-0.18)} ${Y(ADD.y)} H ${X(0.18)} M 0 ${Y(ADD.y - 0.18)} V ${Y(ADD.y + 0.18)}`,
             stroke: '#000', 'stroke-width': LW }, add);
const addGlow = el('circle', { cx: X(ADD.x), cy: Y(ADD.y), r: ADD.r * U, fill: 'none', 'stroke-width': 7, opacity: 0 }, add);
const vdots = text(gNodes, 0, VDOTS_Y - 0.45, '⋮', { 'font-size': 44, class: 'serif', fill: C.ink });

const PATH_RES  = [[0, EMB.y0], [0, ADD.y + ADD.r]];
const PATH_ATTN = [[EMB.x0, -1.8], [BX, -1.8], [BX, ATTN.y1]];
const PATH_MLP  = [[BX, MLP.y0], [BX, ADD.y], [ADD.x - ADD.r, ADD.y]];
arrow(gLines, PATH_RES, T.layer, 0.6);
arrow(gLines, PATH_ATTN, T.layer, 0.45);
fadeIn(attn.g, T.layer + 0.3, 0.35);
arrow(gLines, [[BX, ATTN.y0], [BX, MLP.y1]], T.layer + 0.55, 0.25);
fadeIn(mlp.g, T.layer + 0.65, 0.35);
arrow(gLines, PATH_MLP, T.layer + 0.9, 0.5);
fadeIn(add, T.layer + 1.1, 0.3);
arrow(gLines, [[0, ADD.y - ADD.r], [0, HID.y1]], T.layer + 1.4, 0.3);
fadeIn(hid.g, T.layer + 1.6, 0.35);
arrow(gLines, [[0, HID.y0], [0, VDOTS_Y]], T.layer + 1.9, 0.3);
fadeIn(vdots, T.layer + 2.1, 0.3);

/* ---- H^l (rows fill during the runs) ---- */
const hCell = (r, c) => ({ x: HM.x + (c + 1) * (MS + MG), y: HM.y - (r + 1) * (MS + MG) });
const hRowFill = [];
{
  const g = el('g', {}, gNodes);
  rectCm(g, HM.x - PADM, matBottom, hRight, HM.y + MS + PADM, { fill: 'none', stroke: '#000', 'stroke-width': LW, rx: PT });
  matrixLabel(g, HM.x - 0.035, HM.y + MS + PADM - 0.5 + 0.035, 'H', 'ℓ');
  for (let c = 0; c < NDIM; c++) {
    const sq = square(g, HM.x + (c + 1) * (MS + MG), HM.y, MS, '', C.dim, 0.7);
    sq.t.setAttribute('font-style', 'italic');
    el('tspan', {}, sq.t).textContent = 'D';
    el('tspan', { 'font-style': 'normal' }, sq.t).textContent = String(c + 1);
  }
  CUES.forEach((w, r) => square(g, HM.x, HM.y - (r + 1) * (MS + MG), MS, w, COLORS[w], 0.7));
  fadeIn(g, T.hFrame + 0.3, 0.45);
  arrow(gLines, [[HID.x1, HY], [HM.x - PADM, HY]], T.hFrame, 0.4);

  H.forEach((row, r) => {
    hRowFill[r] = row.map((v, c) => {
      const { x, y } = hCell(r, c);
      const fill = rectCm(g, x, y, x + MS, y + MS, { fill: grey(v, 0), opacity: 0 });
      rectCm(g, x, y, x + MS, y + MS, { fill: 'none', stroke: '#000', 'stroke-width': LW_CELL });
      const txt = el('text', { x: X(x + MS / 2), y: Y(y + MS / 2) + 0.35 * FS_VALUE, 'font-size': FS_VALUE,
                               'text-anchor': 'middle', class: 'serif', fill: '#000', opacity: 0 }, g);
      txt.textContent = fmt(v);
      return [fill, txt];
    });
  });
}

/* ---- The runs: a dot in the cue's colour travels through the pipeline ---- */
const RUN = {
  glowCard: [0.0, 0.25],
  toEmb: [0.2, 0.25],
  split: [0.55, 0.8],
  toHid: [1.4, 0.25],
  toH:   [1.75, 0.35],
  fill:  2.1,
};
const PATH_IN     = [[0, -TOK / 2], [0, EMB.y1]];
const PATH_BRANCH = [...PATH_ATTN, [BX, ATTN.y0], ...PATH_MLP];
const PATH_HID    = [[0, ADD.y - ADD.r], [0, HY]];
const PATH_NEXT   = [[0, HY], [0, VDOTS_Y]];
const PATH_H      = r => [[0, HY], [HID.x1, HY], [HM.x - PADM, HY],
                          [HM.x + MS + MG - 0.05, hCell(r, 0).y + MS / 2]];
const runStart = k => T.run + k * T.runDur;
const runAt = t => clamp(Math.floor((t - T.run) / T.runDur), 0, CUES.length - 1);

function dot(r = 0.14) {
  return el('circle', { r: r * U, 'stroke-width': 2.5, stroke: C.ink, opacity: 0 }, gDots);
}
function moveDot(d, path, t, k, [t0, dur], fadeTail = false) {
  const s = runStart(k) + t0;
  const p = (t - s) / dur;
  if (p < 0 || p > 1.05) return false;
  const [x, y] = along(path, p);
  d.setAttribute('cx', X(x)); d.setAttribute('cy', Y(y));
  d.setAttribute('fill', COLORS[CUES[k]]);
  d.setAttribute('opacity', fadeTail ? 0.6 * (1 - clamp(p)) : 1);
  return true;
}
{
  const dMain = dot(), dBranch = dot(), dNext = dot(0.11);
  const attnIn = fracAt(PATH_BRANCH, 2), attnOut = fracAt(PATH_BRANCH, 3);
  const mlpIn = fracAt(PATH_BRANCH, 4), mlpOut = fracAt(PATH_BRANCH, 5);
  const glowTargets = [
    [emb.glow,  RUN.toEmb[0] + RUN.toEmb[1], RUN.split[0] + 0.1],
    [attn.glow, RUN.split[0] + attnIn * RUN.split[1], RUN.split[0] + attnOut * RUN.split[1]],
    [mlp.glow,  RUN.split[0] + mlpIn * RUN.split[1], RUN.split[0] + mlpOut * RUN.split[1]],
    [addGlow,   RUN.split[0] + RUN.split[1] - 0.05, RUN.toHid[0] + 0.1],
    [hid.glow,  RUN.toHid[0] + RUN.toHid[1], RUN.toH[0] + 0.15],
  ];
  on(t => {
    const k = runAt(t), col = COLORS[CUES[k]];
    for (const d of [dMain, dBranch, dNext]) d.setAttribute('opacity', 0);
    if (t >= T.run && t < T.run + CUES.length * T.runDur) {
      moveDot(dMain, PATH_IN, t, k, RUN.toEmb)
        || moveDot(dMain, PATH_RES, t, k, RUN.split)
        || moveDot(dMain, PATH_HID, t, k, RUN.toHid)
        || moveDot(dMain, PATH_H(k), t, k, RUN.toH);
      moveDot(dBranch, PATH_BRANCH, t, k, RUN.split);
      moveDot(dNext, PATH_NEXT, t, k, [RUN.toH[0], 0.5], true);
    }
    glowTargets.forEach(([e, a, b]) => {
      const s = runStart(k);
      e.setAttribute('stroke', col);
      e.setAttribute('opacity', t >= T.run ? bump(t, s + a, s + b) : 0);
    });
    cards.forEach((c, i) => {
      const s = runStart(i) + RUN.glowCard[0];
      c.glow.setAttribute('stroke', COLORS[CUES[i]]);
      c.glow.setAttribute('opacity', t >= T.run ? bump(t, s, s + RUN.glowCard[1]) : 0);
    });
  });
  hRowFill.forEach((cells, r) => cells.forEach(([fill, txt], c) => {
    const s = runStart(r) + RUN.fill + 0.07 * c;
    fadeIn(fill, s, 0.25);
    fadeIn(txt, s, 0.25);
  }));
}

const ATT_X = tokX.slice(0, CUE_I);
/* ---- Attention (subtle): while the cue passes the self-attention box, arcs from the cue token show
        how strongly it attends to each context token (arc width and opacity ~ ATTENTION) ---- */
{
  const wMax = Math.max(...ATTENTION), n = ATT_X.length;
  const arcs = ATT_X.map((x, i) => {
    // nested bridges: farther tokens get higher arcs that leave further right on the cue card
    const sx = -0.35 + 0.3 * (1 - i / Math.max(1, n - 1)), y0 = TOK / 2;
    const h = 0.3 + 0.12 * Math.abs(x - sx);
    const d = `M ${X(sx)} ${Y(y0)} C ${X(sx)} ${Y(y0 + h)} ${X(x)} ${Y(y0 + h)} ${X(x)} ${Y(y0)}`;
    return el('path', { d, fill: 'none', 'stroke-linecap': 'round', pathLength: 1, 'stroke-dasharray': '1 2',
                        'stroke-width': 2 + 14 * ATTENTION[i], opacity: 0 }, gAttn);
  });
  const attnIn = fracAt(PATH_BRANCH, 2);               // when the dot enters the self-attention box
  const windows = [                                    // [start, end, index of the cue word]
    ...CUES.map((_, k) => [runStart(k) + RUN.split[0] + attnIn * RUN.split[1], runStart(k) + RUN.toHid[0] + 0.2, k]),
  ];
  on(t => {
    const w = windows.filter(([a, b]) => t >= a && t < b + 0.35).pop();
    arcs.forEach((e, i) => {
      if (!w) { e.setAttribute('opacity', 0); return; }
      e.setAttribute('stroke', COLORS[CUES[w[2]]]);
      e.setAttribute('stroke-dashoffset', 1 - ramp(t, w[0], 0.4, easeOut));
      e.setAttribute('opacity', (1 - ramp(t, w[1], 0.35)) * (0.25 + 0.65 * ATTENTION[i] / wMax));
    });
  });
}

/* ---- S^hid ---- */
const sCell = (r, c) => ({ x: SM.x + (c + 1) * (MS + MG), y: SM.y - (r + 1) * (MS + MG) });
const pairs = [];
CUES.forEach((_, i) => CUES.forEach((__, j) => { if (j >= i) pairs.push([i, j]); }));
const pairStart = m => T.sPairs + m * T.sPairStagger;
{
  const g = el('g', {}, gNodes);
  rectCm(g, sLeft, matBottom, sRight, SM.y + MS + PADM, { fill: 'none', stroke: '#000', 'stroke-width': LW, rx: PT });
  matrixLabel(g, SM.x - 0.035, SM.y + MS + PADM - 0.5 + 0.035, 'S', 'hid');
  CUES.forEach((w, c) => square(g, SM.x + (c + 1) * (MS + MG), SM.y, MS, w, COLORS[w], 0.7));
  CUES.forEach((w, r) => square(g, SM.x, SM.y - (r + 1) * (MS + MG), MS, w, COLORS[w], 0.7));
  fadeIn(g, T.sFrame + 0.3, 0.45);
  arrow(gLines, [[hRight, HY], [sLeft, HY]], T.sFrame, 0.4);

  SIM.forEach((row, r) => row.forEach((v, c) => {
    const { x, y } = sCell(r, c);
    const fill = rectCm(g, x, y, x + MS, y + MS, { fill: grey(v, 0.45), opacity: 0 });
    rectCm(g, x, y, x + MS, y + MS, { fill: 'none', stroke: '#000', 'stroke-width': LW_CELL });
    const txt = el('text', { x: X(x + MS / 2), y: Y(y + MS / 2) + 0.35 * FS_VALUE, 'font-size': FS_VALUE,
                             'text-anchor': 'middle', class: 'serif', fill: '#000', opacity: 0 }, g);
    txt.textContent = fmt(v);
    const m = pairs.findIndex(([i, j]) => i === Math.min(r, c) && j === Math.max(r, c));
    fadeIn(fill, pairStart(m) + 0.2, 0.25);
    fadeIn(txt, pairStart(m) + 0.2, 0.25);
  }));
}
{
  const o = 0.05, w = 3.5;
  const rowHi = CUES.map((_, r) => {
    const y = HM.y - (r + 1) * (MS + MG);
    return rectCm(gHi, HM.x - o, y - o, HM.x + NDIM * (MS + MG) + MS + o, y + MS + o,
                  { fill: 'none', stroke: HILITE, 'stroke-width': w, rx: 5, opacity: 0 });
  });
  const cellHi = CUES.map((_, r) => CUES.map((__, c) => {
    const { x, y } = sCell(r, c);
    return rectCm(gHi, x - o, y - o, x + MS + o, y + MS + o,
                  { fill: 'none', stroke: HILITE, 'stroke-width': w, rx: 5, opacity: 0 });
  }));
  const win = (t, t0) => ramp(t, t0, 0.15) * (1 - ramp(t, t0 + 0.45, 0.15));
  on(t => {
    const rowA = CUES.map(() => 0), cellA = CUES.map(() => CUES.map(() => 0));
    pairs.forEach(([i, j], m) => {
      const a = win(t, pairStart(m));
      rowA[i] = Math.max(rowA[i], a); rowA[j] = Math.max(rowA[j], a);
      cellA[i][j] = Math.max(cellA[i][j], a); cellA[j][i] = Math.max(cellA[j][i], a);
    });
    rowHi.forEach((e, r) => e.setAttribute('opacity', rowA[r]));
    cellHi.forEach((row, r) => row.forEach((e, c) => e.setAttribute('opacity', cellA[r][c])));
  });
}

/* ---- Caption ---- */
if (SHOW_CAPTION) {
  CAPTIONS.forEach(([a, b, parts]) => {
    const txt = el('text', { x: X((VB.x + VB.w / 2) / U), y: CAP_Y, 'font-size': FS_CAP, 'text-anchor': 'middle', class: 'cap' }, gCap);
    let back = 0;
    const add = (s, attrs = {}) => {
      if (back) { attrs.dy = (attrs.dy || 0) + back; back = 0; }
      el('tspan', attrs, txt).textContent = s;
    };
    for (const p of parts) {
      if (typeof p === 'string') add(p);
      else if (p.it) add(p.it, { 'font-style': 'italic' });
      else if (p.bold) {
        add(p.bold, { 'font-weight': 'bold' });
        add(p.sup, { 'font-size': FS_CAP * 0.7, dy: -FS_CAP * 0.38, 'font-style': p.sup === 'ℓ' ? 'italic' : 'normal' });
        back = FS_CAP * 0.38;
      }
    }
    on(t => txt.setAttribute('opacity', ramp(t, a, 0.3) * (1 - ramp(t, b - 0.3, 0.3))));
  });
}

on(t => gFig.setAttribute('opacity', 1 - ramp(t, T.fadeOut, 0.7)));

/* =====================================================================
   8. PLAYBACK
   ===================================================================== */
const render = t => { for (const f of actors) f(t); };
window.renderAt = render;
window.LOOP_SECONDS = T.loop;            // in timeline seconds
window.PLAYBACK = PLAYBACK;            // real-time length = LOOP_SECONDS / PLAYBACK

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
if (FREEZE !== null || reduceMotion) {
  render(FREEZE !== null ? FREEZE : T.fadeOut - 0.01);
  return;
}
const ICON_PAUSE = '<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="2" width="3.5" height="12" rx="1"/><rect x="9.5" y="2" width="3.5" height="12" rx="1"/></svg>';
const ICON_PLAY = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 2.5v11a.5.5 0 0 0 .77.42l8.5-5.5a.5.5 0 0 0 0-.84l-8.5-5.5A.5.5 0 0 0 4 2.5z"/></svg>';
const ctl = document.getElementById('ctl');
const btnPlay = document.getElementById('btn-play');
const btnRestart = document.getElementById('btn-restart');
let paused = false, visible = true, elapsed = 0, last = null, dirty = true;
const wrap = t => ((t % T.loop) + T.loop) % T.loop;
const setPaused = p => {
  paused = p;
  btnPlay.innerHTML = p ? ICON_PLAY : ICON_PAUSE;
  btnPlay.setAttribute('aria-label', p ? 'Play animation' : 'Pause animation');
  btnPlay.title = p ? 'Play' : 'Pause';
  ctl.classList.toggle('paused', p);
};
const togglePause = () => setPaused(!paused);
const seek = dt => { elapsed += dt; dirty = true; };
const restart = () => { elapsed = 0; dirty = true; };
function frame(now) {
  const dt = last === null ? 0 : Math.min(0.1, (now - last) / 1000);   // no jump after a background tab
  last = now;
  if (visible && !paused) { elapsed += dt * SPEED; dirty = true; }
  if (dirty) { render(wrap(elapsed)); dirty = false; }
  requestAnimationFrame(frame);
}
// Play only while at least 30 % of the figure is on screen. Inside an <iframe>, the observer
// measures against the top-level page viewport, so the loop starts when the reader scrolls to it.
if ('IntersectionObserver' in window) {
  visible = false;
  new IntersectionObserver(entries => {
    for (const e of entries) visible = e.isIntersecting && e.intersectionRatio >= 0.3;
  }, { threshold: [0, 0.3] }).observe(document.getElementById('fig'));
}
btnPlay.addEventListener('click', togglePause);
btnRestart.addEventListener('click', restart);
ctl.addEventListener('click', e => e.stopPropagation());          // buttons do not also toggle via the page
document.addEventListener('click', togglePause);
document.addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.key === 'Enter')) return;
  if (e.code === 'Space') { e.preventDefault(); togglePause(); }
  else if (e.key === 'ArrowRight') seek(0.25);
  else if (e.key === 'ArrowLeft') seek(-0.25);
  else if (e.key === 'r' || e.key === 'R') restart();
});
setPaused(false);
ctl.hidden = false;
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
